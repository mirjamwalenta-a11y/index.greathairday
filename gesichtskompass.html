<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gesichtskompass · A Great Hair Day</title>
<meta name="description" content="Gesichtsform erkennen und mit Styling sofort optimieren – mit Vorher/Optimiert-Fotos und Checkliste für alle Formen."/>
<meta name="theme-color" content="#F7F2EA"/>
<style>
  @font-face{font-family:'Cormorant Garamond';font-style:italic;font-weight:500;font-display:swap;src:url(fonts/CormorantGaramond-italic-500.woff2) format('woff2')}
  @font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/CormorantGaramond-normal-500.woff2) format('woff2')}
  @font-face{font-family:'Jost';font-style:normal;font-weight:400 500;font-display:swap;src:url(fonts/Jost-normal-400.woff2) format('woff2')}

  :root{
    --bg:#F7F2EA; --card:#FFFDF9; --ink:#2A241D; --muted:#776C5F;
    --line:#E6DCCD; --accent:#9A7B4F; --accent-soft:#EFE5D5; --buehne:#F1E9DD;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.55 'Jost',system-ui,-apple-system,sans-serif}
  button{font:inherit;color:inherit}
  .wrap{max-width:980px;margin:0 auto;padding:24px 16px 48px;min-height:100vh;display:flex;flex-direction:column}

  header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
  .marke{font:italic 500 22px/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.01em}
  .stationen{display:flex;gap:4px;list-style:none;margin:0;padding:0}
  .stationen button{background:none;border:none;padding:6px 8px;cursor:pointer;font-size:12px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--line)}
  .stationen button[aria-current="step"]{color:var(--ink);border-color:var(--accent)}
  .stationen button.fertig{border-color:var(--accent-soft)}
  .stationen button:disabled{cursor:default;opacity:.55}
  .stationen button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  main{flex:1}
  .zaehler{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  h1{font:500 34px/1.15 'Cormorant Garamond',Georgia,serif;margin:0 0 8px}
  .hinweis{color:var(--muted);margin:0 0 22px;max-width:46ch}

  /* Station: Bühne + Auswahl */
  .station{display:grid;gap:18px;grid-template-areas:'kopf' 'buehne' 'auswahl'}
  .kopf{grid-area:kopf} .buehne{grid-area:buehne} .auswahl{grid-area:auswahl}
  .kopf .hinweis{margin-bottom:0}
  .buehne{background:var(--buehne);border-radius:18px;display:flex;flex-direction:column;align-items:center;padding:18px 16px 20px}
  .buehne svg{width:100%;max-width:240px;height:auto;display:block}
  .buehne .bild{transition:opacity .22s ease}
  .buehne .bild.wechsel{opacity:0}
  .erklaerung{text-align:center;min-height:4.2em;margin-top:6px;max-width:34ch}
  .erklaerung b{display:block;font:500 22px/1.2 'Cormorant Garamond',Georgia,serif;margin-bottom:4px}
  .erklaerung span{color:var(--muted);font-size:15px}

  .frage{font-size:15px;color:var(--muted);margin:0 0 12px}
  .optionen{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .option{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 6px 10px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:6px;transition:border-color .2s,background .2s}
  .option svg{width:100%;max-width:96px;height:auto;display:block}
  .option span{font-size:13.5px;line-height:1.25;text-align:center}
  .option:hover{border-color:var(--accent)}
  .option:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .option[aria-pressed="true"]{border-color:var(--ink);background:var(--accent-soft)}

  .navi{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px}
  .zurueck{background:none;border:none;padding:8px 0;font-size:15px;color:var(--muted);cursor:pointer}
  .zurueck:hover{color:var(--ink)}
  .knopf{font-size:15px;border-radius:999px;padding:12px 24px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--bg)}
  .knopf:disabled{background:transparent;color:var(--muted);border-color:var(--line);cursor:default}
  .knopf.leise{background:transparent;color:var(--ink)}
  .knopf:not(:disabled):hover{opacity:.88}
  .zurueck:focus-visible,.knopf:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  /* Start */
  .start{max-width:520px;margin:4vh auto 0;text-align:center}
  .start h1{font-size:42px}
  .start .hinweis{margin:0 auto 10px}
  .start .regeln{list-style:none;padding:0;margin:22px auto 30px;display:grid;gap:8px;max-width:360px;text-align:left}
  .start .regeln li{display:flex;gap:12px;align-items:baseline}
  .start .regeln i{font:italic 500 20px/1 'Cormorant Garamond',Georgia,serif;color:var(--accent);font-style:italic;min-width:1em}

  /* Gesamtbild */
  .verdichtung h2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 6px}
  .verdichtung .einleitung{font:italic 500 28px/1.2 'Cormorant Garamond',Georgia,serif;margin:0 0 14px}
  .zeilen{list-style:none;margin:0;padding:0}
  .zeilen li{border-top:1px solid var(--line);padding:14px 0;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .zeilen li:last-child{border-bottom:1px solid var(--line)}
  .zeilen small{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .zeilen b{font-weight:500;font-size:18px}
  .zeilen button{background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
  .zeilen button:hover{color:var(--ink)}
  .schluss{color:var(--muted);margin:18px 0 24px}
  .aktionen{display:flex;gap:10px;flex-wrap:wrap}

  /* Fotos */
  img{display:block;max-width:100%;height:auto}
  .buehne img,.platzhalter{width:100%;max-width:230px;aspect-ratio:1/1;object-fit:cover;border-radius:14px;background:#E9E6E3}
  .platzhalter{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);background:transparent}
  .buehne .bild{width:100%;display:flex;flex-direction:column;align-items:center}
  .buehne .erklaerung{margin-top:12px}
  .optionen.sechs{grid-template-columns:repeat(3,minmax(0,1fr))}
  .option img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px}
  .option{padding:6px 6px 8px}
  .startbilder{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 auto 22px}
  .startbilder img{width:120px;aspect-ratio:1/1;object-fit:cover;border-radius:12px}
  .startbilder span{color:var(--accent);font-size:22px}
  .styling,.uebersicht{max-width:720px;margin:0 auto}
  .vergleich{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
  .vergleich figure{margin:0;background:var(--buehne);border-radius:14px;padding:8px 8px 12px;text-align:center}
  .vergleich figure.opt{background:var(--accent-soft);outline:1px solid var(--accent)}
  .vergleich img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;margin-bottom:8px}
  .vergleich figcaption{font-size:14px;line-height:1.3}
  .vergleich small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  .massnahmen{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .massnahmen h2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 8px}
  .massnahmen ol,.uebersicht ol{margin:0;padding-left:1.3em;display:grid;gap:4px}
  .warum{margin:12px 0 0;color:var(--muted);font-size:15px}
  .warum b{color:var(--ink);font-weight:500}
  .uebersicht .karte{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px}
  .uebersicht .karte h2{font:500 24px/1.2 'Cormorant Garamond',Georgia,serif;margin:0 0 10px}
  @media (min-width:760px){ .vergleich{gap:16px} .vergleich figcaption{font-size:15px} }
  footer{margin-top:40px;font-size:12.5px;color:var(--muted);text-align:center}

  @media (min-width:760px){
    .station{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);grid-template-areas:'buehne kopf' 'buehne auswahl';grid-template-rows:auto 1fr;align-items:start;column-gap:36px;row-gap:20px}
    .optionen{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .option svg{max-width:120px}
    .option span{font-size:14.5px}
    .buehne{position:sticky;top:16px;padding:26px 20px}
    .buehne svg{max-width:340px}
  }
  @media (max-width:420px){
    h1{font-size:29px} .start h1{font-size:36px}
    .option{padding:6px 3px 8px} .option span{font-size:12.5px}
    .stationen button{padding:6px 5px;font-size:11px;letter-spacing:.08em}
  }
  @media (prefers-reduced-motion:reduce){ .buehne .bild{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="marke">Gesichtskompass</div>
    <nav aria-label="Stationen"><ol class="stationen" id="stationen"></ol></nav>
  </header>
  <main id="inhalt" aria-live="polite"></main>
  <footer>Es werden keine Daten gespeichert oder gesendet.</footer>
</div>

<script>
/* ─────────────────────────────────────────────────────────────
   Gesichtskompass
   Gesichtsform erkennen und mit Styling sofort optisch ausgleichen.
     1 Gesichtsform  (sechs Formen mit Beispielfoto)
     2 Styling       (Vorher und Optimiert, dazu die Sofortmaßnahmen)
   Dazu eine Übersicht aller Formen als Checkliste.
   Rein clientseitig, es werden keine Daten gespeichert oder gesendet.
   ───────────────────────────────────────────────────────────── */

// ── Inhalte ──────────────────────────────────────────────────
// Pro Gesichtsform: was sie ausmacht, welches Styling sie ungünstig betont
// (vorher) und wie man sie sofort optimiert (opt, schritte, warum).
const FORMEN_INFO = [
  { id: 'rund', name: 'rund',
    was: 'Länge und Breite sind fast gleich, die Linien weich. Das Gesicht wirkt sanft und offen.',
    vorher: { kurz: 'Symmetrie, flach am Oberkopf', text: 'Ein symmetrischer Schnitt ohne Höhe am Oberkopf lässt das Gesicht noch runder wirken.' },
    opt: { kurz: 'Seitenscheitel, Höhe am Oberkopf',
      schritte: ['Einen tiefen Seitenscheitel ziehen.', 'Am Oberkopf mit Texturspray Höhe aufbauen.', 'Den Pony zur Seite wegstylen.'],
      warum: 'Diagonale Linien und Höhe am Oberkopf strecken das Gesicht optisch.' } },
  { id: 'eckig', name: 'eckig',
    was: 'Gerade Seiten und ein deutlicher Kieferwinkel. Das Gesicht wirkt klar und markant.',
    vorher: { kurz: 'Harte Kanten', text: 'Stumpfe, gerade Linien wiederholen die Kanten und betonen den Kiefer.' },
    opt: { kurz: 'Wellen, Seitenscheitel, weicher Pony',
      schritte: ['Mit einem schmalen Lockenstab Wellen formen.', 'Einen Seitenscheitel ziehen und so die Symmetrie aufbrechen.', 'Pony und Partien ums Gesicht weich und locker stylen.'],
      warum: 'Weiche Textur und unregelmäßige Längen zeichnen die Kieferlinie weicher.' } },
  { id: 'herz', name: 'herzförmig',
    was: 'Breit an der Stirn, schmal zum Kinn. Der Blick geht nach oben zu Augen und Stirn.',
    vorher: { kurz: 'Breite Stirn, spitzes Kinn', text: 'Kurzes Haar mit geradem Pony betont die breite Stirn, das Kinn wirkt spitzer.' },
    opt: { kurz: 'Oben flach, Pony diagonal, Gesicht umrahmt',
      schritte: ['Das Volumen am Oberkopf flach halten.', 'Den Pony diagonal zur Seite stylen.', 'Strähnen vor den Ohren lassen, damit sie das Gesicht umrahmen.'],
      warum: 'Fülle auf Kinnhöhe gleicht die schmale untere Gesichtshälfte aus.' } },
  { id: 'oval', name: 'oval',
    was: 'Etwas länger als breit, Stirn und Kinn ausgewogen. Die Proportionen wirken harmonisch.',
    vorher: { kurz: 'Harmonisch, aber unauffällig', text: 'Streng zurückgenommen wirkt das ausgewogene Gesicht harmonisch, aber konventionell.' },
    opt: { kurz: 'Jedes Styling möglich',
      schritte: ['Jedes Styling ist möglich – die Form trägt fast alles.', 'Mit Asymmetrie oder einem Curtain-Pony einen Akzent setzen.', 'Textur einarbeiten, damit das Haar Bewegung bekommt.'],
      warum: 'Ausgewogene Proportionen brauchen keinen Ausgleich – hier geht es um Ausdruck.' } },
  { id: 'lang', name: 'länglich',
    was: 'Deutlich länger als breit. Das Gesicht wirkt gestreckt und schmal.',
    vorher: { kurz: 'Zieht in die Länge', text: 'Langes, glattes Haar mit Mittelscheitel führt den Blick nach unten und streckt das Gesicht noch mehr.' },
    opt: { kurz: 'Horizontaler Pony, Breite an den Seiten',
      schritte: ['Einen horizontalen Pony schneiden oder stylen.', 'Mit Wellen oder Locken Volumen an den Seiten aufbauen.', 'Einen Seitenscheitel ziehen.'],
      warum: 'Horizontale Linien und Breite an den Seiten verkürzen das Gesicht optisch.' } },
  { id: 'diamant', name: 'diamantförmig',
    was: 'Schmale Stirn, schmales Kinn, breite Wangenknochen. Das Gesicht wirkt markant.',
    vorher: { kurz: 'Markante Wangenknochen', text: 'Streng zurückgenommenes Haar legt die Wangenknochen frei und betont die breiteste Stelle.' },
    opt: { kurz: 'Weicher Pony, Textur am Kiefer',
      schritte: ['Den Pony weich und fransig stylen.', 'Auf Kieferhöhe Textur erzeugen.', 'Das Haar locker nach vorne frisieren.'],
      warum: 'Fülle an Stirn und Kiefer gleicht die schmalen Partien zu den Wangenknochen aus.' } }
];

const STATIONEN = [
  { key: 'form', kurz: 'Form',    name: 'Gesichtsform' },
  { key: 'look', kurz: 'Styling', name: 'Styling' }
];

// ── Fotos ────────────────────────────────────────────────────
// Pro Gesichtsform ein Foto „vorher“ und eines „optimiert“ (quadratisch, Gesicht mittig).
const foto = (id, look, alt) =>
  `<img src="bilder/gesichtskompass/${id}-${look}.jpg" width="440" height="440" alt="${esc(alt)}" decoding="async">`;

// ── Ablauf ───────────────────────────────────────────────────
const wahl = { form: null };
let ansicht = 'start';        // 'start' | 0 | 1 | 'uebersicht'
let vonUebersicht = 'start';
const inhalt = document.getElementById('inhalt');
const leiste = document.getElementById('stationen');

function esc(s){ return String(s).replace(/[&<>"]/g, z => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[z])); }
const form = id => FORMEN_INFO.find(o => o.id === id);
const liste = schritte => `<ol>${schritte.map(s => `<li>${esc(s)}</li>`).join('')}</ol>`;

function zeigeLeiste(){
  const aus = ansicht === 'start' || ansicht === 'uebersicht';
  leiste.innerHTML = STATIONEN.map((s, i) => `
    <li><button type="button" data-i="${i}" ${ansicht === i ? 'aria-current="step"' : ''} class="${wahl.form ? 'fertig' : ''}"
      ${aus || (i === 1 && !wahl.form) ? 'disabled' : ''}>${i + 1} ${esc(s.kurz)}</button></li>`).join('') +
    `<li><button type="button" data-i="alle" ${ansicht === 'uebersicht' ? 'aria-current="step"' : ''}>Alle</button></li>`;
  leiste.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    b.dataset.i === 'alle' ? zeigeUebersicht() : zeigeStation(Number(b.dataset.i));
  }));
}

function zeigeStart(){
  ansicht = 'start';
  zeigeLeiste();
  inhalt.innerHTML = `
    <section class="start">
      <div class="startbilder" aria-hidden="true">
        ${foto('lang', 'vorher', '')}<span>→</span>${foto('lang', 'opt', '')}
      </div>
      <p class="zaehler">Gesichtsform-Analyse</p>
      <h1>Was passt zu welchem Gesicht?</h1>
      <p class="hinweis">Gesichtsform erkennen und mit Styling sofort optisch ausgleichen – in zwei Schritten.</p>
      <ul class="regeln">
        <li><i>1</i><span>Gesichtsform erkennen</span></li>
        <li><i>2</i><span>Vorher und optimiert vergleichen, mit Sofortmaßnahmen</span></li>
      </ul>
      <div class="aktionen" style="justify-content:center">
        <button type="button" class="knopf" id="los">Beginnen</button>
        <button type="button" class="knopf leise" id="alle">Alle Formen im Überblick</button>
      </div>
    </section>`;
  document.getElementById('los').addEventListener('click', () => zeigeStation(0));
  document.getElementById('alle').addEventListener('click', zeigeUebersicht);
}

function zeigeStation(i){
  if (i === 1 && !wahl.form) return;
  ansicht = i;
  zeigeLeiste();
  i === 0 ? stationForm() : stationStyling();
  window.scrollTo({ top: 0 });
}

function stationForm(){
  const aktiv = wahl.form;
  const buehne = id => id
    ? `${foto(id, 'vorher', 'Gesichtsform ' + form(id).name)}<p class="erklaerung"><b>${esc(form(id).name)}</b><span>${esc(form(id).was)}</span></p>`
    : `<div class="platzhalter">Wähle eine Form</div><p class="erklaerung"><b>Gesichtsform</b><span>Achte auf Stirn, Wangenknochen und Kinn – wo ist das Gesicht am breitesten?</span></p>`;
  inhalt.innerHTML = `
    <section class="station">
      <div class="buehne"><div class="bild" id="bild">${buehne(aktiv)}</div></div>
      <div class="kopf">
        <p class="zaehler">Schritt 1 von 2 · Gesichtsform</p>
        <h1>Welche Gesichtsform ist es?</h1>
        <p class="hinweis">Vergleiche Stirn, Wangenknochen und Kinn mit den Beispielen.</p>
      </div>
      <div class="auswahl">
        <div class="optionen sechs" role="group" aria-label="Gesichtsform">
          ${FORMEN_INFO.map(o => `<button type="button" class="option" data-id="${o.id}" aria-pressed="${aktiv === o.id}">
            ${foto(o.id, 'vorher', '')}<span>${esc(o.name)}</span></button>`).join('')}
        </div>
        <div class="navi">
          <button type="button" class="zurueck" id="zurueck">← Zurück</button>
          <button type="button" class="knopf" id="weiter" ${aktiv ? '' : 'disabled'}>Styling ansehen</button>
        </div>
      </div>
    </section>`;
  inhalt.querySelectorAll('.option').forEach(btn => btn.addEventListener('click', () => {
    wahl.form = btn.dataset.id;
    inhalt.querySelectorAll('.option').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    document.getElementById('weiter').disabled = false;
    const bild = document.getElementById('bild');
    bild.classList.add('wechsel');
    setTimeout(() => { if (!bild.isConnected) return; bild.innerHTML = buehne(wahl.form); bild.classList.remove('wechsel'); }, 140);
    zeigeLeiste();
  }));
  document.getElementById('zurueck').addEventListener('click', zeigeStart);
  document.getElementById('weiter').addEventListener('click', () => zeigeStation(1));
}

function vergleich(f){
  return `<div class="vergleich">
    <figure>${foto(f.id, 'vorher', 'Vorher: ' + f.vorher.kurz)}<figcaption><small>Vorher</small>${esc(f.vorher.kurz)}</figcaption></figure>
    <figure class="opt">${foto(f.id, 'opt', 'Optimiert: ' + f.opt.kurz)}<figcaption><small>Optimiert</small>${esc(f.opt.kurz)}</figcaption></figure>
  </div>`;
}

function stationStyling(){
  const f = form(wahl.form);
  inhalt.innerHTML = `
    <section class="styling">
      <p class="zaehler">Schritt 2 von 2 · Styling</p>
      <h1>Gesichtsform ${esc(f.name)}</h1>
      <p class="hinweis">${esc(f.vorher.text)}</p>
      ${vergleich(f)}
      <div class="massnahmen">
        <h2>Sofortmaßnahmen</h2>
        ${liste(f.opt.schritte)}
        <p class="warum"><b>Warum es wirkt:</b> ${esc(f.opt.warum)}</p>
      </div>
      <p class="schluss">Kein Urteil, sondern ein Bild für unser Gespräch.</p>
      <div class="navi">
        <button type="button" class="zurueck" id="zurueck">← Andere Form</button>
        <div class="aktionen">
          <button type="button" class="knopf leise" id="alle">Alle Formen</button>
        </div>
      </div>
    </section>`;
  document.getElementById('zurueck').addEventListener('click', () => zeigeStation(0));
  document.getElementById('alle').addEventListener('click', zeigeUebersicht);
}

// Checkliste aller Formen: Vorher / Optimiert mit den Sofortmaßnahmen
function zeigeUebersicht(){
  if (ansicht !== 'uebersicht') vonUebersicht = ansicht;
  ansicht = 'uebersicht';
  zeigeLeiste();
  inhalt.innerHTML = `
    <section class="uebersicht">
      <p class="zaehler">Checkliste</p>
      <h1>Alle Gesichtsformen im Überblick</h1>
      <p class="hinweis">Was die Form betont – und wie du sie sofort mit Styling optimierst.</p>
      ${FORMEN_INFO.map(f => `
        <article class="karte">
          <h2>${esc(f.name)}</h2>
          ${vergleich(f)}
          ${liste(f.opt.schritte)}
        </article>`).join('')}
      <div class="navi"><button type="button" class="zurueck" id="zurueck">← Zurück</button></div>
    </section>`;
  document.getElementById('zurueck').addEventListener('click', () => typeof vonUebersicht === 'number' ? zeigeStation(vonUebersicht) : zeigeStart());
  window.scrollTo({ top: 0 });
}

zeigeStart();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <script src="https://mirjamwalenta-a11y.github.io/abwesenheiten-ghd/ghd-sitzung.js"></script>  <!-- automatisch abmelden nach 15 min ohne Bedienung -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>A Great Hair Day · Bewerbungen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!--
    Bewerbungs-Übersicht – nur für die Chefin (BEWERBUNGSPROZESS.md).
    Alle Daten kommen über SECURITY DEFINER-Funktionen, die selbst prüfen,
    ob die angemeldete Person die Inhaberin ist (bewerbungen_ist_chefin).
    Die Prüfung hier im Browser blendet nur die Oberfläche ein/aus.
    Die Prozessregeln (Rot = keine Einladung, Gelb nur mit Begründung …)
    erzwingt die Datenbank; die Knöpfe hier spiegeln sie nur.
    Bewerberdaten werden ausschließlich per textContent eingesetzt.
  -->
  <style>
    :root {
      --bg:          #F8F4EA;
      --card:        #FFFFFF;
      --border:      #E4DBC5;
      --text:        #211D17;
      --text-soft:   #6F6858;
      --accent:      #896C32;
      --accent-dark: #6E5527;
      --accent-tint: #EEE6CD;
      --g:           #3F7A52;
      --g-tint:      #DDEBDF;
      --y:           #A67A22;
      --y-tint:      #F3E6C4;
      --r:           #B23A2E;
      --r-tint:      #F5DAD5;
      --radius:      14px;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:'Poppins', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background:var(--bg); color:var(--text);
      min-height:100vh; padding:16px;
      -webkit-font-smoothing:antialiased;
    }
    .wrap { max-width:680px; margin:0 auto; }
    .card {
      background:var(--card); border:1.5px solid var(--border);
      border-radius:var(--radius); padding:22px 18px; margin-bottom:14px;
      box-shadow:0 8px 32px rgba(137,108,50,0.06);
    }
    .brand { font-size:11px; letter-spacing:.12em; color:var(--text-soft); text-transform:uppercase; }
    h1 { font-size:22px; font-weight:700; margin:6px 0 4px; line-height:1.3; }
    h2 { font-size:16px; font-weight:700; margin-bottom:10px; }
    h3 { font-size:14px; font-weight:700; margin:18px 0 8px; }
    p  { font-size:14px; line-height:1.6; color:var(--text-soft); }
    .muted { font-size:12.5px; color:var(--text-soft); }
    .hidden { display:none !important; }

    .top { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
    .top .links { display:flex; gap:8px; flex-wrap:wrap; }
    .link { background:none; border:none; color:var(--accent-dark); font:inherit; font-size:13px; font-weight:600; cursor:pointer; padding:6px 0; }

    /* Login */
    .login { max-width:380px; margin:60px auto 0; }
    label.f { display:block; font-size:12px; font-weight:600; color:var(--text-soft); margin:14px 0 6px; }
    input[type=text], input[type=email], input[type=password], select, textarea {
      width:100%; padding:12px; border:1.5px solid var(--border); border-radius:10px;
      font:inherit; font-size:15px; background:var(--bg); color:var(--text);
    }
    textarea { min-height:160px; resize:vertical; font-size:13.5px; line-height:1.55; }
    .btn {
      display:inline-block; padding:11px 16px; margin:6px 6px 0 0;
      background:var(--accent); color:#fff; border:1.5px solid var(--accent); border-radius:10px;
      font:inherit; font-size:14px; font-weight:600; cursor:pointer;
    }
    .btn:hover { background:var(--accent-dark); border-color:var(--accent-dark); }
    .btn.ghost { background:none; color:var(--accent-dark); border-color:var(--border); }
    .btn.rot { background:var(--r); border-color:var(--r); }
    .btn:disabled { opacity:.45; cursor:default; }
    .btn.voll { display:block; width:100%; margin:20px 0 0; }
    .msg { margin-top:12px; padding:10px 12px; border-radius:10px; font-size:13.5px; background:var(--r-tint); color:var(--r); }

    /* Liste */
    .gruppe h2 { display:flex; justify-content:space-between; align-items:baseline; }
    .gruppe h2 span { font-size:12px; font-weight:600; color:var(--text-soft); }
    .eintrag {
      display:block; width:100%; text-align:left; background:var(--bg); border:1.5px solid var(--border);
      border-radius:10px; padding:12px 14px; margin-top:8px; font:inherit; color:var(--text); cursor:pointer;
    }
    .eintrag:hover { border-color:var(--accent); }
    .eintrag .zeile { display:flex; justify-content:space-between; gap:10px; align-items:center; }
    .eintrag b { font-size:14.5px; }
    .eintrag .info { font-size:12.5px; color:var(--text-soft); margin-top:3px; }
    .hinweis { font-size:12px; font-weight:600; margin-top:4px; }
    .hinweis.y { color:var(--y); }
    .hinweis.r { color:var(--r); }
    .leer { font-size:13px; color:var(--text-soft); margin-top:6px; }

    .pill { font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:20px; white-space:nowrap; }
    .p-g { background:var(--g-tint); color:var(--g); }
    .p-y { background:var(--y-tint); color:var(--y); }
    .p-r { background:var(--r-tint); color:var(--r); }
    .p-n { background:var(--accent-tint); color:var(--accent-dark); }

    /* Detail */
    .daten { display:grid; grid-template-columns:130px 1fr; gap:6px 12px; font-size:13.5px; }
    .daten dt { color:var(--text-soft); }
    .daten dd { word-break:break-word; white-space:pre-wrap; }
    @media (max-width:440px) { .daten { grid-template-columns:1fr; } .daten dd { margin-bottom:6px; } }
    .verdict { border-radius:12px; padding:14px; margin:10px 0 4px; }
    .verdict b { display:block; font-size:16px; margin-bottom:4px; }
    .verdict p { color:inherit; font-size:13.5px; }
    .v-g { background:var(--g-tint); color:var(--g); }
    .v-y { background:var(--y-tint); color:var(--y); }
    .v-r { background:var(--r-tint); color:var(--r); }
    .field { border:1.5px solid var(--border); border-radius:12px; padding:12px; margin-top:10px; }
    .field-head { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .field-head span:first-child { font-weight:600; font-size:14px; }
    .sig { margin-top:10px; padding-left:10px; border-left:3px solid; font-size:13px; line-height:1.55; }
    .sig.r { border-color:var(--r); }
    .sig.y { border-color:var(--y); }
    .sig.g { border-color:var(--g); }
    .sig .sit { color:var(--text-soft); }
    .sig .ans { color:var(--text); margin:2px 0; }
    .sig .why { color:var(--text-soft); font-style:italic; }
    .ask { margin-top:10px; font-size:13px; }
    .ask b { color:var(--text-soft); font-weight:600; }
    .verlauf li { font-size:12.5px; color:var(--text-soft); margin:4px 0 0 18px; }
    .nachricht { margin-top:12px; padding:12px; border-radius:12px; background:var(--accent-tint); }
    .nachricht .muted { margin-bottom:8px; color:var(--accent-dark); font-weight:600; }
    .regel { font-size:13px; color:var(--r); font-weight:600; margin-top:8px; }
    .warnung { margin-top:10px; padding:10px 12px; border-radius:10px; background:var(--y-tint); color:var(--y); font-size:13px; font-weight:600; }

    /* Prüfzone Gelb */
    .pz { border:1.5px solid var(--y); border-radius:12px; padding:14px; margin-top:12px; }
    .pz h3 { margin-top:0; color:var(--y); }
    .pz-step { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-soft); margin:16px 0 8px; }
    .pz .consent { display:flex; gap:10px; align-items:flex-start; margin-top:8px; font-size:13px; line-height:1.5; }
    .pz .consent input { margin-top:3px; width:18px; height:18px; accent-color:var(--accent); flex-shrink:0; }
    .pz input[type=text] { margin-top:8px; font-size:14px; }
    .pz-item { border-top:1px solid var(--border); padding-top:12px; margin-top:12px; font-size:13px; line-height:1.55; }
    .pz-item .ans { color:var(--text-soft); }
    .pz-item .q { color:var(--text); font-weight:600; margin:6px 0 4px; }
    .pz-item .hint { color:var(--text-soft); }
    .pz-item .hint b { font-weight:600; }
    .pz-btns { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
    .pz-btn { flex:1; min-width:90px; padding:8px 6px; border-radius:8px; border:1.5px solid var(--border); background:var(--bg); color:var(--text); font:inherit; font-size:12.5px; cursor:pointer; }
    .pz-btn.on.g { background:var(--g-tint); border-color:var(--g); color:var(--g); font-weight:600; }
    .pz-btn.on.y { background:var(--y-tint); border-color:var(--y); color:var(--y); font-weight:600; }
    .pz-btn.on.r { background:var(--r-tint); border-color:var(--r); color:var(--r); font-weight:600; }
    .pz-status { margin-top:10px; padding:10px 12px; border-radius:10px; font-size:13.5px; font-weight:600; background:var(--accent-tint); color:var(--accent-dark); }
    .pz-status.g { background:var(--g-tint); color:var(--g); }
    .pz-status.r { background:var(--r-tint); color:var(--r); }

    /* Katalog */
    .kat-sit { margin-top:20px; padding-top:16px; border-top:1px solid var(--border); }
    .kat-meta { font-size:11.5px; color:var(--text-soft); letter-spacing:.05em; text-transform:uppercase; margin-bottom:6px; }
    .kat-q { font-size:14px; font-weight:600; line-height:1.5; margin-bottom:8px; }
    .kat-a { display:flex; gap:10px; align-items:flex-start; font-size:13px; line-height:1.5; margin-top:8px; }
    .kat-a .tags { display:flex; flex-direction:column; gap:3px; flex-shrink:0; width:96px; }
    .kat-a .pill { font-size:10.5px; padding:2px 7px; text-align:center; }
    .kat-a .why { display:block; font-size:12.5px; color:var(--text-soft); font-style:italic; margin-top:2px; }
    .rules { font-size:13.5px; line-height:1.65; margin:8px 0 0 18px; }
    .rules li + li { margin-top:6px; }
    .regeltab { width:100%; border-collapse:collapse; font-size:13px; margin-top:6px; }
    .regeltab th, .regeltab td { text-align:left; padding:6px 6px; border-bottom:1px solid var(--border); vertical-align:top; }
    .regeltab th { color:var(--text-soft); font-weight:600; }
  </style>
</head>
<body>
<div class="wrap">

  <div class="card login" id="login">
    <div class="brand">A Great Hair Day</div>
    <h1>Bewerbungen</h1>
    <p>Nur für die Chefin.</p>
    <form id="login-form">
      <label class="f" for="email">E-Mail</label>
      <input type="email" id="email" autocomplete="username">
      <label class="f" for="pw">Passwort</label>
      <input type="password" id="pw" autocomplete="current-password">
      <div class="msg hidden" id="login-msg"></div>
      <button class="btn voll" type="submit" id="login-btn">Einloggen</button>
    </form>
  </div>

  <div id="app" class="hidden"></div>
</div>

<script>
  const SB_URL = 'https://wrxlaltgtgkdomklgrlj.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndyeGxhbHRndGdrZG9ta2xncmxqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNDYwMzYsImV4cCI6MjA5OTgyMjAzNn0.Bw8ch-EJb_cLYTwxHdpjUJWgoCjje3Jc32pB0yiBS8g'; // öffentlicher anon-Schlüssel
  const sb = supabase.createClient(SB_URL, SB_KEY);

  async function rpc(fn, args) {
    const { data, error } = await sb.rpc(fn, args || {});
    if (error) throw new Error(error.message);
    return data;
  }

  // ── Texte ──────────────────────────────────────────────────────────────
  const STELLE = { lehrstelle: 'Lehrstelle', geselle: 'Gesell:in', wiedereinstieg: 'Wiedereinstieg' };
  const AUSBILDUNG = { schule: 'Schule / Schulabschluss', in_ausbildung: 'Lehre läuft', lehrabschluss: 'Lehrabschluss',
                       meisterpruefung: 'Meisterprüfung', quereinstieg: 'Andere Ausbildung / Quereinstieg' };
  const FARBTEXT = { g: 'Grün', y: 'Gelb', r: 'Rot' };
  const RANG = { g: 0, y: 1, r: 2 };
  // Bewertungsregel der Chefin (2026-10-22): Lehrlinge und fertige Stylist:innen
  // werden unterschiedlich gelesen. Die Rechnung selbst macht die Datenbank.
  const istLehrling = b => b.stelle === 'lehrstelle';
  function gesamtText(g, b) {
    if (g === 'g') return ['Gesamt: Grün – gute Grundpassung, Gespräch führen',
      'Ein einzelnes gelbes Feld im Gespräch kurz ansprechen.'];
    if (g === 'r') return ['Gesamt: Rot – keine Weiterführung',
      'Keine Ausnahme aus Sympathie, Mitleid oder Lebenslauf. Rot bleibt Ausschluss.'];
    return istLehrling(b)
      ? ['Gesamt: Gelb – kein Ausschluss, gezielte Prüfzone im Gespräch',
         'Leitfrage: Ist das unreif, aber entwickelbar? Oder zeigt sich hier schon ein Muster, das später im Alltag viel Energie kostet? Jugendliche Unsicherheit, Vorsicht oder Unreife sind nicht automatisch negativ.']
      : ['Gesamt: Gelb – vorsichtig prüfen',
         'Von fertigen Stylist:innen erwarten wir deutlich mehr Reife. Nur weitergehen, wenn jeder gelbe Punkt im Gespräch konkret ansprechbar ist und klar entkräftet wird.'];
  }
  const BASIS_GRUENDE = [
    'Für die Stelle ist gerade kein Platz frei',
    'Das Stundenausmaß passt nicht',
    'Der Start liegt mehr als 6 Monate entfernt',
    'Es gibt schon ein Matcher-Ergebnis aus den letzten 6 Monaten'
  ];
  const GRUPPEN = [
    ['neu',           'Basis-Check'],
    ['basis_ok',      'Matcher-Link verschicken'],
    ['matcher_offen', 'Matcher noch nicht fertig'],
    ['ausgewertet',   'Entscheidung nach dem Matcher'],
    ['gespraech',     'Gespräch'],
    ['probearbeiten', 'Probearbeiten'],
    ['absage_offen',  'Absage freigeben und verschicken'],
    ['fertig',        'Abgeschlossen']
  ];
  const STATUS_TEXT = {
    neu: 'Basis-Check offen', basis_ok: 'Basis passt – Matcher-Link verschicken', matcher_offen: 'Matcher verschickt',
    ausgewertet: 'Matcher ausgefüllt', gespraech: 'Zum Gespräch eingeladen', probearbeiten: 'Probearbeiten',
    zusage: 'Zusage', absage_offen: 'Absage vorbereitet – Freigabe offen', abgesagt: 'Abgesagt', geschlossen: 'Geschlossen'
  };

  const GRUSS = '\n\nLiebe Grüße\nDein Team von A Great Hair Day';
  const VORLAGE = {
    absage_basis: v => `Hallo ${v},\n\nvielen Dank, dass du dich bei uns gemeldet hast – wir haben uns sehr über dein Interesse an A Great Hair Day gefreut.\n\nWir haben uns deine Angaben in Ruhe angesehen. Im Moment passt es von den Rahmenbedingungen her leider nicht zusammen, zum Beispiel bei der Stelle, den Stunden oder dem Startzeitpunkt. Das hat nichts mit dir als Person zu tun.\n\nWir wünschen dir von Herzen alles Gute und viel Freude auf deinem weiteren Weg.` + GRUSS,
    matcher: (v, link, bis) => `Hallo ${v},\n\ndanke für deine Bewerbung – von den Eckdaten her passt es. Als nächsten Schritt schicken wir dir unseren Salon Matcher: acht kurze Situationen aus unserem Salonalltag, etwa fünf Minuten. Du musst nichts vorbereiten und nichts erraten – antworte so, wie du wirklich arbeitest.\n\n${link}\n\nDer Link gilt bis ${bis} und lässt sich einmal ausfüllen. Danach melden wir uns in jedem Fall bei dir.` + GRUSS,
    erinnerung: (v, link, bis) => `Hallo ${v},\n\nkurze Erinnerung an unseren Salon Matcher. Dein Link gilt noch bis ${bis}:\n\n${link}\n\nDanach melden wir uns in jedem Fall bei dir.` + GRUSS,
    gespraech: v => `Hallo ${v},\n\ndanke, dass du dir Zeit für den Salon Matcher genommen hast. Wir würden dich gern im Salon kennenlernen. Wann passt es dir in den nächsten Tagen?` + GRUSS,
    probearbeiten: v => `Hallo ${v},\n\ndanke für das gute Gespräch. Wir würden dich gern zu einem Probetag einladen. Welcher Tag passt dir?` + GRUSS,
    zusage: v => `Hallo ${v},\n\nwir freuen uns sehr: Wir möchten gern mit dir zusammenarbeiten. Lass uns die nächsten Schritte besprechen – wann passt es dir?` + GRUSS,
    absage: v => `Hallo ${v},\n\nvielen Dank, dass du dir die Zeit für deine Bewerbung und unseren Salon Matcher genommen hast – das schätzen wir wirklich.\n\nWir haben uns alles in Ruhe angesehen. Diesmal passt es für uns leider nicht ganz zusammen, deshalb gehen wir den nächsten Schritt nicht gemeinsam. Das sagt nichts über dein Können aus – es geht nur darum, wie gut unsere Arbeitsweisen zueinander passen.\n\nWir wünschen dir von Herzen alles Gute und viel Freude in deinem Beruf. Danke noch einmal für dein Vertrauen!` + GRUSS
  };

  // ── Hilfen ─────────────────────────────────────────────────────────────
  const app = document.getElementById('app');
  function h(tag, attrs = {}, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === undefined || v === null || v === false) continue;
      if (k === 'on') e.addEventListener('click', v);
      else if (k === 'cls') e.className = v;
      else e.setAttribute(k, v === true ? '' : v);
    }
    e.append(...kids.filter(k => k !== null && k !== undefined && k !== false));
    return e;
  }
  const datum = d => d ? new Date(d).toLocaleDateString('de-AT', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '';
  const tageSeit = d => Math.floor((Date.now() - new Date(d)) / 86400000);
  const vorname = name => (name || '').trim().split(/\s+/)[0];
  const pill = farbe => farbe ? h('span', { cls: 'pill p-' + farbe }, FARBTEXT[farbe]) : null;

  // ── Anmeldung ──────────────────────────────────────────────────────────
  async function start() {
    const { data } = await sb.auth.getSession();
    if (data && data.session && await istChefin()) return zeigeListe();
    document.getElementById('login').classList.remove('hidden');
  }
  async function istChefin() {
    try { return await rpc('bewerbungen_ist_chefin') === true; } catch (e) { return false; }
  }
  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const msg = document.getElementById('login-msg'), btn = document.getElementById('login-btn');
    msg.classList.add('hidden');
    btn.disabled = true; btn.textContent = 'Wird geprüft …';
    const { error } = await sb.auth.signInWithPassword({
      email: document.getElementById('email').value.trim(), password: document.getElementById('pw').value });
    btn.disabled = false; btn.textContent = 'Einloggen';
    if (error) { msg.textContent = 'Falsche E-Mail oder Passwort.'; msg.classList.remove('hidden'); return; }
    if (!await istChefin()) {
      await sb.auth.signOut();
      msg.textContent = 'Kein Zugriff – die Bewerbungen sind der Chefin vorbehalten.'; msg.classList.remove('hidden');
      return;
    }
    document.getElementById('pw').value = '';
    zeigeListe();
  });
  async function abmelden() {
    await sb.auth.signOut();
    app.classList.add('hidden'); app.innerHTML = '';
    document.getElementById('login').classList.remove('hidden');
  }

  function rahmen(...kids) {
    document.getElementById('login').classList.add('hidden');
    app.classList.remove('hidden');
    app.innerHTML = '';
    app.append(h('div', { cls: 'top' },
      h('div', {}, h('div', { cls: 'brand' }, 'A Great Hair Day · nur für die Chefin'), h('h1', {}, 'Bewerbungen')),
      h('div', { cls: 'links' },
        h('button', { cls: 'link', on: zeigeListe }, 'Übersicht'),
        h('button', { cls: 'link', on: zeigeKatalog }, 'Fragenkatalog'),
        h('button', { cls: 'link', on: () => { location.href = 'schaltzentrale.html'; } }, '← Schaltzentrale'),
        h('button', { cls: 'link', on: abmelden }, 'Abmelden'))), ...kids.filter(Boolean));
    window.scrollTo(0, 0);
  }
  function fehlerKarte(e) {
    return h('div', { cls: 'card' }, h('div', { cls: 'msg' }, 'Das hat nicht geklappt: ' + e.message));
  }

  // ── Übersicht ──────────────────────────────────────────────────────────
  function hinweise(b) {
    const out = [];
    if (b.status === 'neu' && tageSeit(b.erstellt_am) >= 2) out.push(['y', `Seit ${tageSeit(b.erstellt_am)} Tagen ohne Basis-Check`]);
    if (b.status === 'matcher_offen') {
      if (new Date(b.matcher_gueltig_bis) < new Date()) out.push(['r', 'Link abgelaufen – Vorgang schließen']);
      else if (!b.matcher_erinnert_am && tageSeit(b.matcher_verschickt_am) >= 4) out.push(['y', 'Erinnerung fällig']);
      else out.push(['', 'Link gültig bis ' + datum(b.matcher_gueltig_bis)]);
    }
    if (b.status === 'ausgewertet' && b.gesamt === 'y') out.push(['y', 'Gelb – Gespräch oder Absage entscheiden']);
    if (b.status === 'ausgewertet' && b.gesamt === 'r') out.push(['r', 'Rot – Absage vorbereiten']);
    if (b.frueher && b.frueher.length) {
      const f = b.frueher[0];
      out.push(['y', `Frühere Bewerbung am ${datum(f.erstellt_am)}` + (f.gesamt ? ` – Ergebnis ${FARBTEXT[f.gesamt]}` : '')]);
    }
    return out;
  }

  async function zeigeListe() {
    rahmen(h('p', {}, 'Lädt …'));
    let liste;
    try { liste = await rpc('bewerbungen_liste'); } catch (e) { return rahmen(fehlerKarte(e)); }
    const karten = GRUPPEN.map(([key, titel]) => {
      const eintraege = liste.filter(b => key === 'fertig' ? ['zusage', 'abgesagt', 'geschlossen'].includes(b.status) : b.status === key);
      const karte = h('div', { cls: 'card gruppe' }, h('h2', {}, titel, h('span', {}, String(eintraege.length))));
      if (!eintraege.length) karte.append(h('div', { cls: 'leer' }, 'Nichts offen.'));
      eintraege.forEach(b => karte.append(h('button', { cls: 'eintrag', on: () => zeigeDetail(b.id) },
        h('div', { cls: 'zeile' }, h('b', {}, b.name), pill(b.gesamt)),
        h('div', { cls: 'info' }, `${STELLE[b.stelle]} · eingegangen ${datum(b.erstellt_am)}` + (key === 'fertig' ? ' · ' + STATUS_TEXT[b.status] : '')),
        ...hinweise(b).map(([c, t]) => h('div', { cls: 'hinweis ' + c }, t)))));
      return karte;
    });
    rahmen(neueBewerbungKarte(),
      h('p', { style: 'margin-bottom:14px' }, 'Sortiert nach dem nächsten Schritt. Bewerbungen werden 6 Monate nach Eingang automatisch gelöscht.'), ...karten);
  }

  // Einstieg: Link zur Kurzbewerbung an Interessierte geben (Schritt 1)
  function neueBewerbungKarte() {
    const url = new URL('karriere.html', location.href).href.split('#')[0];
    const text = `Hallo,\n\nschön, dass du dich für A Great Hair Day interessierst. Hier kannst du dich bei uns melden – das dauert insgesamt etwa zehn Minuten:\n\n${url}` + GRUSS;
    return h('div', { cls: 'card' },
      h('h2', {}, 'Neue Bewerbung'),
      h('p', {}, 'Jemand interessiert sich? Schick diesen Link. Die Person füllt die Kurzbewerbung aus und macht gleich danach den Salon Matcher. Danach erscheint sie hier unter „Entscheidung nach dem Matcher“.'),
      h('div', { cls: 'muted', style: 'margin:8px 0 2px;word-break:break-all' }, url),
      h('div', {},
        h('button', { cls: 'btn ghost', on: () => window.open(url, '_blank', 'noopener') }, 'Karriere-Seite öffnen'),
        h('button', { cls: 'btn ghost', on: async ev => {
          try { await navigator.clipboard.writeText(url); ev.target.textContent = 'Kopiert ✓'; } catch (e) { prompt('Link kopieren:', url); }
        }}, 'Link kopieren'),
        h('button', { cls: 'btn ghost', on: () => window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank', 'noopener') }, 'Per WhatsApp schicken')));
  }

  // ── Nachricht mit Kopieren / E-Mail / WhatsApp ─────────────────────────
  function nachricht(b, titel, text) {
    const ta = h('textarea', {});
    ta.value = text;
    const knoepfe = h('div', {},
      h('button', { cls: 'btn ghost', on: async ev => {
        try { await navigator.clipboard.writeText(ta.value); ev.target.textContent = 'Kopiert ✓'; }
        catch (e) { ta.select(); document.execCommand('copy'); ev.target.textContent = 'Kopiert ✓'; }
      }}, 'Text kopieren'));
    if (b.email) knoepfe.append(h('button', { cls: 'btn ghost', on: () => {
      location.href = `mailto:${encodeURIComponent(b.email)}?subject=${encodeURIComponent('Deine Bewerbung bei A Great Hair Day')}&body=${encodeURIComponent(ta.value)}`;
    }}, 'Per E-Mail'));
    if (b.telefon) knoepfe.append(h('button', { cls: 'btn ghost', on: () => {
      let nr = b.telefon.replace(/\D/g, '');
      if (nr.startsWith('00')) nr = nr.slice(2); else if (nr.startsWith('0')) nr = '43' + nr.slice(1);
      window.open(`https://wa.me/${nr}?text=${encodeURIComponent(ta.value)}`, '_blank', 'noopener');
    }}, 'Per WhatsApp'));
    return h('div', { cls: 'nachricht' }, h('div', { cls: 'muted' }, titel), ta, knoepfe);
  }

  // ── Detail ─────────────────────────────────────────────────────────────
  async function zeigeDetail(id, extra) {
    let b;
    try { b = await rpc('bewerbung_detail', { p_id: id }); } catch (e) { return rahmen(fehlerKarte(e)); }
    const y = window.scrollY;
    rahmen(
      h('div', { cls: 'card' },
        h('div', { cls: 'brand' }, `${STELLE[b.stelle]} · eingegangen ${datum(b.erstellt_am)}`),
        h('h1', {}, b.name),
        h('div', { style: 'display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap' },
          h('span', { cls: 'pill p-n' }, STATUS_TEXT[b.status]), pill(b.matcher_gesamt))),
      aktionenKarte(b, extra),
      b.antworten ? auswertungKarte(b) : null,
      datenKarte(b),
      h('div', { cls: 'card' }, h('h2', {}, 'Verlauf'),
        h('ul', { cls: 'verlauf' }, ...(b.verlauf || []).map(v => h('li', {}, `${datum(v.zeit)} – ${v.text}`)))),
      h('div', { cls: 'card' }, h('h2', {}, 'Bewerbung löschen'),
        h('p', {}, 'Für Test-Einträge oder wenn die Person ihre Einwilligung widerruft. Löscht die Bewerbung samt Matcher-Antworten endgültig.'),
        h('button', { cls: 'btn rot', on: async () => {
          if (!confirm(`Bewerbung von ${b.name} endgültig löschen? Das lässt sich nicht rückgängig machen.`)) return;
          try { await rpc('bewerbung_loeschen', { p_id: b.id }); zeigeListe(); } catch (e) { alert(e.message); }
        }}, 'Endgültig löschen')));
    if (extra && extra.scroll) window.scrollTo(0, y);
  }

  async function schritt(b, aktion, notiz, extra) {
    try {
      if (b.pzFlush) await b.pzFlush();
      await rpc('bewerbung_schritt', { p_id: b.id, p_aktion: aktion, p_notiz: notiz || null });
      zeigeDetail(b.id, extra);
    } catch (e) { alert(e.message); }
  }

  function aktionenKarte(b, extra) {
    const v = vorname(b.name);
    const karte = h('div', { cls: 'card' }, h('h2', {}, 'Nächster Schritt'));
    const add = (...els) => karte.append(...els);
    const linkUrl = token => new URL('bewerber.html', location.href).href.split('#')[0].split('?')[0] + '?t=' + token;

    if (b.frueher && b.frueher.length && ['neu', 'basis_ok'].includes(b.status)) {
      const f = b.frueher[0];
      add(h('div', { cls: 'warnung' }, `Frühere Bewerbung am ${datum(f.erstellt_am)}` +
        (f.gesamt ? ` mit Ergebnis ${FARBTEXT[f.gesamt]}. Es gilt das bestehende Ergebnis – kein neuer Matcher.` : '.')));
    }

    switch (b.status) {
      case 'neu': {
        add(h('p', {}, 'Nur prüfen, ob die Bewerbung grundsätzlich in Frage kommt – keine Bewertung von Ton oder Sympathie.'),
            h('p', { cls: 'muted', style: 'margin-top:6px' }, 'Gesell:in ohne Abschluss? Nicht absagen, sondern auf die Lehrstelle umleiten, wenn eine frei ist.'));
        const grund = h('select', {}, h('option', { value: '' }, 'Grund wählen …'),
          ...BASIS_GRUENDE.map(g => h('option', {}, g)), h('option', { value: 'sonst' }, 'Anderer Grund …'));
        const sonst = h('input', { type: 'text', maxlength: '200', placeholder: 'Grund' });
        sonst.classList.add('hidden');
        grund.addEventListener('change', () => sonst.classList.toggle('hidden', grund.value !== 'sonst'));
        add(h('button', { cls: 'btn', on: () => schritt(b, 'basis_passt') }, 'Basis passt'),
            h('h3', {}, 'Basis passt nicht'), grund, sonst,
            h('button', { cls: 'btn ghost', on: () => {
              const g = grund.value === 'sonst' ? sonst.value.trim() : grund.value;
              if (!g) return alert('Bitte einen Grund wählen.');
              schritt(b, 'basis_passt_nicht', g);
            }}, 'Basis passt nicht – Absage vorbereiten'),
            h('h3', {}, 'Pflichtangaben fehlen trotz Nachfrage'),
            h('button', { cls: 'btn ghost', on: () => confirm('Vorgang ohne Rückmeldung schließen?') && schritt(b, 'schliessen', 'Pflichtangaben fehlen trotz Nachfrage') }, 'Vorgang schließen'));
        break;
      }
      case 'basis_ok':
        add(h('p', {}, 'Der Link ist persönlich, gilt 7 Tage und lässt sich einmal ausfüllen.'),
            h('button', { cls: 'btn', on: async () => {
              try {
                const r = await rpc('bewerbung_matcher_link', { p_id: b.id });
                zeigeDetail(b.id, { nachricht: ['Einladung zum Salon Matcher – jetzt verschicken. Der Link wird nur dieses eine Mal angezeigt.', VORLAGE.matcher(v, linkUrl(r.token), datum(r.gueltig_bis))] });
              } catch (e) { alert(e.message); }
            }}, 'Matcher-Link erstellen'),
            h('button', { cls: 'btn ghost', on: () => confirm('Absage vorbereiten?') && schritt(b, 'absage', 'Stelle inzwischen vergeben') }, 'Absage (z. B. Stelle vergeben)'));
        break;
      case 'matcher_offen': {
        const abgelaufen = new Date(b.matcher_gueltig_bis) < new Date();
        add(h('p', {}, `Offen seit ${datum(b.matcher_verschickt_am)}, gültig bis ${datum(b.matcher_gueltig_bis)}.` +
                       (b.matcher_erinnert_am ? ` Erinnert am ${datum(b.matcher_erinnert_am)}.` : '')));
        if (!abgelaufen) {
          add(h('p', { cls: 'muted', style: 'margin-top:6px' }, 'Nach 4 Tagen ohne Antwort: eine Erinnerung. Sie erzeugt einen neuen Link (der alte hört auf zu funktionieren), die Gültigkeit verlängert sich nicht.'),
              h('button', { cls: 'btn ghost', on: async () => {
                try {
                  const r = await rpc('bewerbung_matcher_link', { p_id: b.id, p_erinnerung: true });
                  zeigeDetail(b.id, { nachricht: ['Erinnerung – jetzt verschicken. Der neue Link wird nur dieses eine Mal angezeigt.', VORLAGE.erinnerung(v, linkUrl(r.token), datum(r.gueltig_bis))] });
                } catch (e) { alert(e.message); }
              }}, b.matcher_erinnert_am ? 'Link nochmal neu erzeugen' : 'Erinnerung mit neuem Link'));
        } else {
          add(h('p', { cls: 'regel' }, 'Der Link ist abgelaufen. Einen neuen Versuch gibt es nicht.'),
              h('button', { cls: 'btn', on: () => schritt(b, 'schliessen', 'Matcher nicht ausgefüllt') }, 'Vorgang schließen'));
        }
        break;
      }
      case 'ausgewertet': {
        const g = b.matcher_gesamt;
        add(h('div', { cls: 'verdict v-' + g }, h('b', {}, gesamtText(g, b)[0]), h('p', {}, gesamtText(g, b)[1])),
            h('p', { cls: 'muted', style: 'margin-top:8px' }, 'Eckdaten (Stelle, Stunden, Start) stehen unten bei den Basisdaten. Passen sie nicht: Absage.'));
        if (g !== 'r') add(gespraechsfragen(b, g === 'y' ? 'Im Gespräch gezielt prüfen' : 'Im Gespräch kurz ansprechen'),
                           h('button', { cls: 'btn', on: () => schritt(b, 'gespraech') }, 'Zum Gespräch einladen'));
        if (g === 'r') add(h('p', { cls: 'regel' }, 'Keine Einladung zum Gespräch.'));
        add(h('button', { cls: 'btn ' + (g === 'r' ? 'rot' : 'ghost'), on: () => confirm('Absage vorbereiten?') && schritt(b, 'absage') }, 'Absage vorbereiten'));
        break;
      }
      case 'gespraech':
        add(nachricht(b, 'Einladung zum Kennenlernen', VORLAGE.gespraech(v)));
        if (b.matcher_gesamt === 'y') add(h('div', { cls: 'verdict v-y' }, h('p', {}, gesamtText('y', b)[1])), pruefzone(b));
        else add(gespraechsfragen(b, 'Im Gespräch kurz ansprechen'));
        add(h('button', { cls: 'btn', id: 'weiter-probe', disabled: b.matcher_gesamt === 'y' && !alleGeklaert(b),
                          on: () => schritt(b, 'probearbeiten') }, 'Probearbeiten vereinbaren'),
            h('button', { cls: 'btn ghost', on: () => confirm('Absage vorbereiten?') && schritt(b, 'absage') }, 'Absage vorbereiten'));
        break;
      case 'probearbeiten':
        add(nachricht(b, 'Einladung zum Probetag', VORLAGE.probearbeiten(v)),
            h('button', { cls: 'btn', on: () => confirm('Zusage geben?') && schritt(b, 'zusage') }, 'Zusage'),
            h('button', { cls: 'btn ghost', on: () => confirm('Absage vorbereiten?') && schritt(b, 'absage') }, 'Absage vorbereiten'));
        break;
      case 'absage_offen':
        add(h('p', {}, 'Die Freigabe prüft nur, ob Name und Vorgang stimmen – nicht, ob es vielleicht doch passt.'),
            nachricht(b, 'Absage', b.basis_grund ? VORLAGE.absage_basis(v) : VORLAGE.absage(v)),
            h('p', { cls: 'muted', style: 'margin-top:8px' }, 'Du kannst den Text vor dem Verschicken frei anpassen.'),
            h('button', { cls: 'btn', on: () => confirm('Ist die Absage verschickt? Danach lässt sie sich nicht mehr zurücknehmen.') && schritt(b, 'absage_verschickt') }, 'Absage freigegeben und verschickt'),
            h('button', { cls: 'btn ghost', on: () => confirm('Absage zurücknehmen? Die Bewerbung springt in den Schritt davor zurück.') && schritt(b, 'absage_zuruecknehmen') }, 'Absage zurücknehmen'));
        break;
      case 'zusage':
        add(nachricht(b, 'Zusage', VORLAGE.zusage(v)));
        break;
      default:
        add(h('p', {}, 'Abgeschlossen.'));
    }
    if (extra && extra.nachricht) karte.insertBefore(nachricht(b, ...extra.nachricht), karte.children[1]);
    return karte;
  }

  // ── Auswertung ─────────────────────────────────────────────────────────
  function auswertungKarte(b) {
    const karte = h('div', { cls: 'card' }, h('h2', {}, 'Auswertung Salon Matcher'),
      h('p', { cls: 'muted' }, `Ausgefüllt am ${datum(b.matcher_ausgefuellt_am)}`));
    const felder = b.matcher_felder || {};

    // In einem Satz: warum diese Gesamtfarbe (Gesamt = schwächstes Feld)
    const name = k => b.felder_info[k].name.split(' ')[0];
    const anzahl = (k, c) => b.antworten.filter(a => a.bewertung[k] === c).length;
    const teil = (c, wort) => Object.keys(felder).filter(k => felder[k] === c)
      .map(k => `${name(k)} ${wort} (${anzahl(k, c)} ${anzahl(k, c) === 1 ? 'Antwort' : 'Antworten'})`);
    const gruen = Object.keys(felder).filter(k => felder[k] === 'g').map(name);
    const g = b.matcher_gesamt;
    const gelbe = teil('y', 'gelb');
    const satz = g === 'g'
      ? (gelbe.length ? `Gesamt Grün: ${gelbe[0]}, ${gruen.join(', ')} grün. Ein gelbes Feld ist in Ordnung – im Gespräch kurz ansprechen.`
                      : 'Gesamt Grün: alle vier Felder grün.')
      : `Gesamt ${FARBTEXT[g]}, weil: ${[...teil('r', 'rot'), ...gelbe].join(', ')}.` +
        (gruen.length ? ` ${gruen.join(', ')} ${gruen.length === 1 ? 'ist' : 'sind'} grün.` : '') +
        (g === 'r' ? (istLehrling(b) ? ' Bei Lehrlingen ist Rot bei Respekt, Wertschätzung oder Offenheit ein Ausschluss – Grün gleicht das nicht aus.'
                                     : ' Von fertigen Stylist:innen erwarten wir mehr Reife: ein rotes Feld ist Ausschluss – Grün gleicht das nicht aus.')
                   : istLehrling(b) && felder.Z === 'r' ? ' Rot bei Zuwendung zählt bei Lehrlingen als Gelb – oft jugendliche Unreife, im Gespräch prüfen.'
                   : ' Ab zwei gelben Feldern ist es Gelb.');
    karte.append(h('div', { cls: 'verdict v-' + g }, h('p', {}, satz)));
    Object.keys(felder).sort((x, y) => RANG[felder[y]] - RANG[felder[x]]).forEach(k => {
      const signale = b.antworten.filter(a => a.bewertung[k] && a.bewertung[k] !== 'g')
        .sort((x, y) => RANG[y.bewertung[k]] - RANG[x.bewertung[k]]);
      const box = h('div', { cls: 'field' },
        h('div', { cls: 'field-head' }, h('span', {}, b.felder_info[k].name), pill(felder[k])));
      if (!signale.length) box.append(h('div', { cls: 'muted', style: 'margin-top:8px' }, 'Alle Signale grün.'));
      signale.forEach(a => box.append(h('div', { cls: 'sig ' + a.bewertung[k] },
        h('div', { cls: 'sit' }, (a.bewertung[k] === 'r' ? 'Rote Flagge · ' : 'Gelb · ') + a.frage),
        h('div', { cls: 'ans' }, 'Gewählt: ' + a.text),
        h('div', { cls: 'why' }, a.begruendung || ''))));
      if (felder[k] !== 'g') box.append(h('div', { cls: 'ask' }, h('b', {}, 'Im Gespräch fragen: '), b.felder_info[k].gespraech));
      karte.append(box);
    });

    // Alle 8 Antworten der Reihe nach, mit Farbe je Pflichtfeld
    karte.append(h('h3', {}, 'Alle Antworten'));
    b.antworten.forEach((a, i) => {
      const tags = h('div', { style: 'display:flex;gap:4px;flex-wrap:wrap;margin-top:4px' },
        ...Object.entries(a.bewertung).map(([f, c]) => h('span', { cls: 'pill p-' + c }, `${b.felder_info[f].name.split(' ')[0]} · ${FARBTEXT[c]}`)));
      karte.append(h('div', { cls: 'sig ' + (Object.values(a.bewertung).includes('r') ? 'r' : Object.values(a.bewertung).includes('y') ? 'y' : 'g') },
        h('div', { cls: 'sit' }, `Situation ${i + 1} · ${a.frage}`),
        h('div', { cls: 'ans' }, 'Gewählt: ' + a.text),
        tags));
    });
    return karte;
  }

  // Gesprächsfragen zu den gelben Antworten (ohne Bewertungsknöpfe)
  function gespraechsfragen(b, titel) {
    const punkte = pzPunkte(b);
    if (!punkte.length) return null;
    return h('div', { cls: 'pz' }, h('h3', {}, titel),
      ...punkte.map(a => h('div', { cls: 'pz-item' },
        h('div', { cls: 'ans' }, 'Gewählt: ' + a.text),
        h('div', { cls: 'q' }, 'Frage: ' + a.prueffrage))));
  }

  // ── Prüfzone Gelb ──────────────────────────────────────────────────────
  const pzPunkte = b => b.antworten.filter(a => a.prueffrage);
  const pzKey = a => a.situation + '-' + a.option;
  function alleGeklaert(b) {
    const u = (b.pruefzone && b.pruefzone.urteile) || {};
    return pzPunkte(b).every(a => u[pzKey(a)] === 'g');
  }

  function pruefzone(b) {
    const pz = Object.assign({ stark: false, fach: false, begruendung: '', urteile: {} }, b.pruefzone || {});
    pz.urteile = Object.assign({}, pz.urteile);
    const punkte = pzPunkte(b);
    const box = h('div', { cls: 'pz' }, h('h3', {}, 'Prüfzone Gelb'));
    const teil2 = h('div');
    const status3 = h('div', { cls: 'pz-status' });
    const gespeichert = h('div', { cls: 'muted', style: 'margin-top:6px' });

    let timer = null;
    async function jetztSpeichern() {
      clearTimeout(timer); timer = null;
      try {
        await rpc('bewerbung_pruefzone', { p_id: b.id, p_daten: { stark: pz.stark, fach: pz.fach, begruendung: pz.begruendung, urteile: pz.urteile } });
        gespeichert.textContent = 'Gespeichert.';
      } catch (e) { gespeichert.textContent = 'Nicht gespeichert: ' + e.message; }
    }
    function speichern() {
      clearTimeout(timer);
      gespeichert.textContent = 'Wird gespeichert …';
      timer = setTimeout(jetztSpeichern, 500);
    }
    // Vor „Zum Gespräch“ / „Probearbeiten“: Ausstehendes zuerst speichern
    b.pzFlush = () => timer ? jetztSpeichern() : Promise.resolve();

    // Schritt 2 – im Gespräch prüfen
    teil2.append(h('div', { cls: 'pz-step' }, 'Im Gespräch gezielt prüfen'));
    punkte.forEach(a => {
      const key = pzKey(a);
      const wrap = h('div', { cls: 'pz-btns' });
      [['g', 'Geklärt'], ['y', 'Bleibt unklar'], ['r', 'Bestätigt sich']].forEach(([v, t]) => {
        const btn = h('button', { cls: 'pz-btn ' + v + (pz.urteile[key] === v ? ' on' : ''), on: () => {
          pz.urteile[key] = v;
          wrap.querySelectorAll('.pz-btn').forEach(x => x.classList.remove('on'));
          btn.classList.add('on');
          update(); speichern();
        }}, t);
        wrap.append(btn);
      });
      const felder = Object.keys(a.bewertung).filter(k => a.bewertung[k] === 'y').map(k => b.felder_info[k].name).join(' · ');
      teil2.append(h('div', { cls: 'pz-item' },
        h('div', { cls: 'muted' }, felder),
        h('div', { cls: 'ans' }, 'Gewählt: ' + a.text),
        h('div', { cls: 'q' }, 'Frage: ' + a.prueffrage),
        h('div', { cls: 'hint' }, h('b', {}, 'Spricht für Passung: '), a.pruef_gut),
        h('div', { cls: 'hint' }, h('b', {}, 'Bleibt kritisch: '), a.pruef_krit),
        wrap));
    });
    teil2.append(h('div', { cls: 'pz-step' }, 'Entscheidung nach dem Gespräch'), status3);
    box.append(teil2, gespeichert);

    function update() {
      const u = punkte.map(a => pz.urteile[pzKey(a)]);
      const offen = u.filter(x => !x).length;
      if (u.includes('r')) {
        status3.className = 'pz-status r';
        status3.textContent = 'Absage. Eine gelbe Stelle hat sich im Gespräch bestätigt – das zählt wie Rot.';
      } else if (offen) {
        status3.className = 'pz-status';
        status3.textContent = `Noch ${offen} von ${punkte.length} Punkten zu prüfen.`;
      } else if (u.includes('y')) {
        status3.className = 'pz-status r';
        status3.textContent = 'Absage. Gelb ist eine Prüfzone, keine Warteschleife. Wenn es trotz gezielter Prüfung nicht klar wird, passt es nicht.';
      } else {
        status3.className = 'pz-status g';
        status3.textContent = 'Alle gelben Stellen geklärt. Weiter zum nächsten Schritt (z. B. Probearbeiten).';
      }
      const btnProbe = document.getElementById('weiter-probe');
      if (btnProbe) btnProbe.disabled = !(u.length && u.every(x => x === 'g'));
    }
    // erst nach dem Einhängen in die Seite (Knöpfe existieren dann)
    setTimeout(update);
    update();
    return box;
  }

  // ── Basisdaten ─────────────────────────────────────────────────────────
  function datenKarte(b) {
    const zeile = (t, w) => w ? [h('dt', {}, t), h('dd', {}, w)] : [];
    return h('div', { cls: 'card' }, h('h2', {}, 'Basisdaten'),
      h('dl', { cls: 'daten' },
        ...zeile('Telefon', b.telefon), ...zeile('E-Mail', b.email),
        ...zeile('Stelle', STELLE[b.stelle]), ...zeile('Ausbildung', AUSBILDUNG[b.ausbildung]),
        ...zeile('Über sich', b.ueber_dich), ...zeile('Stunden', b.stunden), ...zeile('Start', b.start),
        ...zeile('Portfolio', b.portfolio), ...zeile('Basis-Check', b.basis_grund ? 'passt nicht – ' + b.basis_grund : null),
        ...zeile('Löschung am', datum(b.loeschen_am))));
  }

  // ── Fragenkatalog ──────────────────────────────────────────────────────
  async function zeigeKatalog() {
    rahmen(h('p', {}, 'Lädt …'));
    let k;
    try { k = await rpc('matcher_katalog'); } catch (e) { return rahmen(fehlerKarte(e)); }
    const karte = h('div', { cls: 'card' },
      h('h2', {}, 'Bewertungsregel'),
      h('p', {}, 'Der Salon Matcher ist ein Kulturfilter, kein Persönlichkeitstest und kein endgültiges Urteil über einen Menschen. Er zeigt, wie genau wir hinschauen müssen.'),
      h('h3', {}, 'Für fertige Stylist:innen'),
      h('p', {}, 'Wir erwarten eine deutlich höhere berufliche und menschliche Reife.'),
      h('ul', { cls: 'rules' },
        h('li', {}, h('b', {}, 'Grün'), ' bedeutet: gute Grundpassung, Gespräch führen.'),
        h('li', {}, h('b', {}, 'Gelb'), ' bedeutet: vorsichtig prüfen, nur weitergehen, wenn der gelbe Punkt konkret ansprechbar und im Gespräch klar entkräftbar ist.'),
        h('li', {}, h('b', {}, 'Rot'), ' bedeutet: keine Weiterführung.')),
      h('h3', {}, 'Für Lehrlinge'),
      h('p', {}, 'Wir prüfen stärker auf Haltung, Lernbereitschaft und Entwicklungspotenzial als auf fertige Reife.'),
      h('ul', { cls: 'rules' },
        h('li', {}, h('b', {}, 'Grün'), ' bedeutet: gute Grundpassung, Gespräch führen.'),
        h('li', {}, h('b', {}, 'Gelb'), ' bedeutet: kein Ausschluss, sondern gezielte Prüfzone im Gespräch.'),
        h('li', {}, h('b', {}, 'Rot'), ' bedeutet: keine Weiterführung, wenn das Rot auf Haltung, Respektlosigkeit, Geringschätzung, Abwehr oder fehlende Lernoffenheit hinweist.')),
      h('p', { style: 'margin-top:10px' }, 'Jugendliche Unsicherheit, Vorsicht oder Unreife sind nicht automatisch negativ. Frühe Geringschätzung, fehlender Respekt, abwertendes Verhalten und dauernde Opferhaltung werden auch bei Lehrlingen nicht verharmlost.'),
      h('p', { style: 'margin-top:10px' }, h('b', {}, 'Leitfrage bei gelben Lehrlings-Profilen: '), 'Ist das unreif, aber entwickelbar? Oder zeigt sich hier schon ein Muster, das später im Alltag viel Energie kostet?'),
      h('p', { style: 'margin-top:10px' }, h('b', {}, 'Gesprächsziel bei Gelb: '), 'Der Matcher entscheidet nicht über Zu- oder Absage. Er zeigt, worüber wir im Gespräch gezielt sprechen müssen.'),
      h('h2', { style: 'margin-top:22px' }, 'Auswertungslogik'),
      h('ul', { cls: 'rules' },
        h('li', {}, 'Ein Pflichtfeld ist rot, sobald darin eine rote Antwort vorkommt.'),
        h('li', {}, 'Ein Pflichtfeld ist gelb, wenn keine rote, aber mindestens eine gelbe Antwort vorkommt.'),
        h('li', {}, 'Es wird nichts verrechnet – grüne Antworten gleichen ein Rot nicht aus.')),
      h('h3', {}, 'Gesamtfarbe'),
      h('table', { cls: 'regeltab' },
        h('tr', {}, h('th', {}, ''), h('th', {}, 'Stylist:in'), h('th', {}, 'Lehrling')),
        h('tr', {}, h('td', {}, 'Rot bei Respekt oder Wertschätzung'), h('td', {}, 'Rot'), h('td', {}, 'Rot')),
        h('tr', {}, h('td', {}, 'Rot bei Offenheit'), h('td', {}, 'Rot'), h('td', {}, 'Rot (fehlende Lernoffenheit)')),
        h('tr', {}, h('td', {}, 'Rot bei Zuwendung'), h('td', {}, 'Rot'), h('td', {}, 'zählt als gelbes Feld')),
        h('tr', {}, h('td', {}, 'zwei oder mehr Felder gelb'), h('td', {}, 'Gelb'), h('td', {}, 'Gelb')),
        h('tr', {}, h('td', {}, 'sonst (höchstens ein Feld gelb)'), h('td', {}, 'Grün'), h('td', {}, 'Grün'))),
      h('p', { style: 'margin-top:10px' }, 'Nach dem Gespräch bei Gelb: alle Punkte geklärt → nächster Schritt; einer bleibt unklar oder bestätigt sich → Absage. Gelb ist eine Prüfzone, keine Warteschleife. Keine Ausnahme aus Sympathie, Mitleid oder Lebenslauf.'),
      h('h3', {}, 'Die acht Situationen'),
      h('p', { cls: 'muted' }, 'Bewerber:innen sehen die Antworten in zufälliger Reihenfolge und nie die Farben.'));
    k.situationen.forEach((s, idx) => {
      const box = h('div', { cls: 'kat-sit' },
        h('div', { cls: 'kat-meta' }, `Situation ${idx + 1} · ${s.art}`),
        h('div', { cls: 'kat-q' }, s.frage));
      s.optionen.forEach(o => {
        const tags = h('div', { cls: 'tags' });
        Object.entries(o.bewertung).forEach(([f, c]) => tags.append(h('span', { cls: 'pill p-' + c }, `${k.felder[f].name.split(' ')[0]} · ${FARBTEXT[c]}`)));
        const txt = h('div', {}, o.text);
        if (o.begruendung) txt.append(h('span', { cls: 'why' }, o.begruendung));
        if (o.prueffrage) txt.append(h('span', { cls: 'why' }, 'Prüffrage bei Gelb: ' + o.prueffrage));
        box.append(h('div', { cls: 'kat-a' }, tags, txt));
      });
      karte.append(box);
    });
    rahmen(karte);
  }

  start();
</script>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Farbkompass · A Great Hair Day</title>
<meta name="description" content="Finde in drei Schritten eine stimmige Farbrichtung für deine Farbberatung."/>
<meta name="theme-color" content="#F7F2EA"/>
<style>
  @font-face{font-family:'Cormorant Garamond';font-style:italic;font-weight:500;font-display:swap;src:url(fonts/CormorantGaramond-italic-500.woff2) format('woff2')}
  @font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/CormorantGaramond-normal-500.woff2) format('woff2')}
  @font-face{font-family:'Jost';font-style:normal;font-weight:400 500;font-display:swap;src:url(fonts/Jost-normal-400.woff2) format('woff2')}

  :root{
    --bg:#F7F2EA; --card:#FFFDF9; --ink:#2A241D; --muted:#7A6F62;
    --line:#E6DCCD; --accent:#9A7B4F; --accent-soft:#EFE5D5; --sel:#2A241D;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.55 'Jost',system-ui,-apple-system,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:28px 16px 56px;min-height:100vh;display:flex;flex-direction:column}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:36px;min-height:32px}
  .marke{font:italic 500 20px/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.01em}
  .schritte{display:flex;gap:6px}
  .schritte i{width:22px;height:2px;border-radius:2px;background:var(--line);transition:background .3s}
  .schritte i.on{background:var(--accent)}

  .station{animation:rein .35s ease both}
  @keyframes rein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .zaehler{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
  h1{font:500 34px/1.15 'Cormorant Garamond',Georgia,serif;margin:0 0 10px}
  .hinweis{color:var(--muted);margin:0 0 28px}

  .optionen{display:grid;gap:10px}
  .option{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
    transition:border-color .2s,background .2s,transform .1s}
  .option:hover{border-color:var(--accent)}
  .option:active{transform:scale(.99)}
  .option:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .option b{display:block;font-weight:500;font-size:17px}
  .option span{display:block;color:var(--muted);font-size:14.5px;margin-top:2px}
  .option.gewaehlt{border-color:var(--sel);background:var(--accent-soft)}

  .zurueck{margin-top:28px;align-self:flex-start;background:none;border:none;padding:6px 0;
    font:inherit;font-size:14px;color:var(--muted);cursor:pointer}
  .zurueck:hover{color:var(--ink)}

  /* Ergebnis */
  .ergebnis-name{font:italic 500 40px/1.1 'Cormorant Garamond',Georgia,serif;margin:4px 0 14px;color:var(--accent)}
  .wirkung{font-size:18px;margin:0 0 32px}
  .block{border-top:1px solid var(--line);padding:22px 0 4px}
  .block h2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 8px}
  .block p{margin:0 0 14px}
  .abschluss{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:18px 0 0}
  .alternative{margin-top:28px;border:1px dashed var(--line);border-radius:14px;padding:18px 20px}
  .alternative h2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 6px}
  .alternative .alt-name{font:italic 500 26px/1.2 'Cormorant Garamond',Georgia,serif;margin:0 0 6px}
  .alternative p{margin:0;color:var(--muted)}
  .aktionen{margin-top:32px}
  .knopf{font:inherit;font-size:15px;border-radius:999px;padding:12px 22px;cursor:pointer;
    border:1px solid var(--ink);background:transparent;color:var(--ink)}
  .knopf:hover{background:var(--ink);color:var(--bg)}

  @media (max-width:420px){ h1{font-size:30px} .ergebnis-name{font-size:36px} }
  @media (prefers-reduced-motion:reduce){ .station{animation:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="marke">Farbkompass</div>
    <div class="schritte" aria-hidden="true"><i></i><i></i><i></i></div>
  </header>
  <main id="buehne" aria-live="polite"></main>
</div>

<script src="farbkompass-kern.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   Farbkompass V1 – Kund:innen-Version
   Wirkung vor Technik · Entscheidungshilfe vor Typisierung ·
   Farbrichtung statt fixer Farbton.
   Rein clientseitig, es werden keine Daten gespeichert oder gesendet.
   Fachlicher Kern: farbkompass-kern.js
   ───────────────────────────────────────────────────────────── */

// Fragen, Punkte-Logik und Texte kommen aus dem gemeinsamen Kern (farbkompass-kern.js),
// damit Kund:innen- und Team-Version immer dasselbe Ergebnis liefern.
const { RICHTUNGEN, FRAGEN, ABSCHLUSS, auswerten, warumText } = window.FARBKOMPASS;

// ── Darstellung ───────────────────────────────────────────────
const buehne = document.getElementById('buehne');
const balken = document.querySelectorAll('.schritte i');
let antworten = [];

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function zeigeFrage(n){
  balken.forEach((el, i) => el.classList.toggle('on', i <= n));
  const f = FRAGEN[n];
  buehne.innerHTML = `
    <section class="station">
      <p class="zaehler">Schritt ${n + 1} von 3</p>
      <h1>${esc(f.titel)}</h1>
      <p class="hinweis">${esc(f.hinweis)}</p>
      <div class="optionen">
        ${f.optionen.map((o, i) => `
          <button class="option${antworten[n] === i ? ' gewaehlt' : ''}" data-i="${i}">
            <b>${esc(o.t)}</b><span>${esc(o.s)}</span>
          </button>`).join('')}
      </div>
      ${n > 0 ? '<button class="zurueck" id="zurueck">← Zurück</button>' : ''}
    </section>`;
  buehne.querySelectorAll('.option').forEach(btn => btn.addEventListener('click', () => {
    buehne.querySelectorAll('.option').forEach(x => x.classList.remove('gewaehlt'));
    btn.classList.add('gewaehlt');
    antworten[n] = Number(btn.dataset.i);
    antworten.length = n + 1;
    setTimeout(() => n < 2 ? zeigeFrage(n + 1) : zeigeErgebnis(), 260);
  }));
  const z = document.getElementById('zurueck');
  if (z) z.addEventListener('click', () => zeigeFrage(n - 1));
  window.scrollTo({ top: 0 });
}

function zeigeErgebnis(){
  balken.forEach(el => el.classList.add('on'));
  const { haupt, alternative } = auswerten(antworten);
  const r = RICHTUNGEN[haupt];
  buehne.innerHTML = `
    <section class="station">
      <p class="zaehler">Deine stimmige Farbrichtung</p>
      <h1 class="ergebnis-name">${esc(r.name)}</h1>
      <p class="wirkung">${esc(r.wirkung)}</p>

      <div class="block">
        <h2>Warum das zu dir passen könnte</h2>
        <p>${esc(warumText(antworten))}</p>
      </div>
      <div class="block">
        <h2>Darauf achten wir im Salon</h2>
        <p>${esc(r.salon)}</p>
      </div>
      <p class="abschluss">${esc(ABSCHLUSS)}</p>

      ${alternative ? `
      <div class="alternative">
        <h2>Auch gut zu dir passen könnte:</h2>
        <p class="alt-name">${esc(RICHTUNGEN[alternative.zu].name)}</p>
        <p>${esc(alternative.wann)}</p>
      </div>` : ''}

      <div class="aktionen">
        <button class="knopf" id="neu">Noch einmal starten</button>
      </div>
      <button class="zurueck" id="zurueck">← Letzte Antwort ändern</button>
    </section>`;
  document.getElementById('neu').addEventListener('click', () => { antworten = []; zeigeFrage(0); });
  document.getElementById('zurueck').addEventListener('click', () => zeigeFrage(2));
  window.scrollTo({ top: 0 });
}

zeigeFrage(0);
</script>
</body>
</html>

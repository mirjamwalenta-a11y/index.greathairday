<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Wörni · Schaltzentrale</title>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="Wörni"/>
  <meta name="theme-color" content="#F8F4EA"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --bg:#F8F4EA; --bg-soft:#F0E9D8; --card:#FFFFFF; --border:#E4DBC5;
      --text:#211D17; --text-soft:#7C7565;
      --accent:#896C32; --accent-dark:#6E5527; --accent-tint:#EEE6CD;
      --ok:#4C7A5B; --ok-tint:#DCEEE1;
      --crit:#B23A2E; --crit-tint:#F5DAD5;
      --heute:#A67A22; --heute-tint:#F1E4C4;
      --woche:#4E7288; --woche-tint:#DCE7EC;
      --wann:#8B8172; --wann-tint:#EAE3D6;
      --radius:14px;
    }
    *{-webkit-tap-highlight-color:transparent;box-sizing:border-box;}
    ::-webkit-scrollbar{display:none;} *{-ms-overflow-style:none;scrollbar-width:none;}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
      font-family:'Poppins',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;min-height:100vh;}
    @keyframes einblenden{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
    @keyframes kritisch-puls{0%,100%{opacity:1;}50%{opacity:0.4;}}
    @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
    .einblenden{animation:einblenden 0.3s ease both;}
    .kritisch-dot{animation:kritisch-puls 2s ease-in-out infinite;}

    /* ── Aufgaben-Karte ── */
    .aufgabe-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
      padding:13px 14px 13px 16px;margin-bottom:10px;cursor:pointer;position:relative;overflow:hidden;
      transition:border-color 0.15s,transform 0.2s,opacity 0.2s;}
    .aufgabe-card:hover{border-color:var(--accent);}
    .aufgabe-card:active{transform:scale(0.98);opacity:0.8;}
    .aufgabe-stripe{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px;}

    /* ── Vorlage-Karte ── */
    .vorlage-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
      padding:13px 16px;margin-bottom:8px;cursor:pointer;
      display:flex;align-items:center;gap:12px;
      transition:border-color 0.15s;}
    .vorlage-card:hover{border-color:var(--accent);}
    .vorlage-card.inaktiv{opacity:0.45;}
    .vorlage-rhythmus{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
      padding:3px 8px;border-radius:999px;flex-shrink:0;}
    .rhythmus-taeglich{background:#F0E9D8;color:#6E5527;}
    .rhythmus-woechentlich{background:var(--woche-tint);color:var(--woche);}
    .rhythmus-monatlich{background:var(--heute-tint);color:var(--heute);}
    .rhythmus-spontan{background:var(--bg-soft);color:var(--text-soft);}

    /* ── Badges ── */
    .badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:0.04em;}
    .badge-krit{background:var(--crit-tint);color:var(--crit);border:1px solid rgba(178,58,46,.2);}
    .badge-heute{background:var(--heute-tint);color:var(--heute);border:1px solid rgba(166,122,34,.2);}
    .badge-woche{background:var(--woche-tint);color:var(--woche);border:1px solid rgba(78,114,136,.2);}
    .badge-wann{background:var(--wann-tint);color:var(--wann);border:1px solid rgba(139,129,114,.2);}
    .badge-typ{background:var(--bg-soft);color:var(--text-soft);border:1px solid var(--border);}
    .badge-fix{background:var(--accent-tint);color:var(--accent-dark);border:1px solid rgba(137,108,50,.2);}
    .badge-auto{background:var(--ok-tint);color:var(--ok);border:1px solid rgba(76,122,91,.2);}

    /* ── Tabs ── */
    .tabs{display:flex;gap:6px;margin-bottom:20px;}
    .tab{flex:1;padding:10px;border-radius:999px;font-weight:700;font-size:12px;
      border:1.5px solid var(--border);background:var(--card);color:var(--text-soft);
      cursor:pointer;font-family:inherit;text-align:center;transition:background 0.15s,color 0.15s,border-color 0.15s;}
    .tab.active{background:var(--text);color:#fff;border-color:var(--text);}

    /* ── Abschnitt ── */
    .abschnitt-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
    .abschnitt-label{font-size:10.5px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;}
    .abschnitt-count{font-size:10.5px;color:rgba(33,29,23,0.25);font-weight:600;}
    .abschnitt-line{flex:1;height:1px;background:rgba(33,29,23,0.06);}

    /* ── Header ── */
    .header{padding:52px 20px 0;margin-bottom:20px;}
    .header-eyebrow{font-size:10px;font-weight:700;color:rgba(33,29,23,0.3);letter-spacing:0.12em;margin-bottom:6px;text-transform:uppercase;}
    .header-row{display:flex;align-items:flex-end;justify-content:space-between;}
    .header-h1{font-size:28px;font-weight:800;color:var(--text);line-height:1.1;margin:0;}
    .header-sub{font-size:13px;color:rgba(33,29,23,0.35);margin-top:4px;}
    .btn-add-header{background:var(--accent-tint);border:1px solid rgba(137,108,50,0.35);border-radius:12px;
      padding:10px 14px;color:var(--accent-dark);font-size:12px;font-weight:700;cursor:pointer;
      font-family:inherit;white-space:nowrap;flex-shrink:0;transition:background 0.15s;min-width:80px;text-align:center;}
    .btn-nav{background:var(--card);border:1px solid var(--border);border-radius:12px;
      padding:10px 14px;color:var(--text);font-size:12px;font-weight:700;cursor:pointer;
      font-family:inherit;white-space:nowrap;flex-shrink:0;transition:background 0.15s;min-width:80px;text-align:center;}
    .btn-nav:hover{border-color:var(--accent);}

    /* ── FAB ── */
    .fab{position:fixed;right:20px;bottom:28px;background:var(--accent);color:#fff;border:none;
      border-radius:999px;padding:14px 22px;font-weight:700;font-size:14px;
      box-shadow:0 8px 20px rgba(137,108,50,0.40);cursor:pointer;font-family:inherit;z-index:20;
      transition:background 0.15s;}
    .fab:hover{background:var(--accent-dark);}
    .fab:active{transform:scale(0.96);}

    /* ── Skeleton ── */
    .skeleton{background:var(--bg-soft);border-radius:var(--radius);height:80px;
      animation:einblenden 0.4s ease both;}

    /* ── Fehler ── */
    .fehler-box{background:var(--crit-tint);border:1px solid rgba(178,58,46,0.25);
      border-radius:12px;padding:14px 16px;margin-bottom:20px;}

    /* ── Erledigt-Karte ── */
    .done-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
      padding:13px 16px;display:flex;align-items:center;gap:12px;margin-bottom:8px;}

    /* ── Modal / Sheet ── */
    .modal-backdrop{position:fixed;inset:0;background:rgba(33,29,23,0.6);z-index:100;
      display:flex;align-items:flex-end;}
    .sheet{background:var(--bg);width:100%;border-radius:22px 22px 0 0;max-height:90vh;
      display:flex;flex-direction:column;animation:einblenden 0.22s ease;}
    .sheet-scroll{overflow-y:auto;padding:10px 20px 6px;flex:1;}
    .sheet-handle{width:38px;height:4px;background:var(--border);border-radius:99px;margin:8px auto 18px;}
    .sheet h2{font-size:17px;font-weight:700;color:var(--text);margin:0 0 4px;}
    .sheet-hint{font-size:12px;color:var(--text-soft);margin:0 0 16px;}
    .sheet-actions{display:flex;gap:10px;padding:12px 20px calc(20px + env(safe-area-inset-bottom));
      background:var(--bg);border-top:1px solid var(--border);flex-shrink:0;}
    .btn-secondary{flex:1;padding:14px;border-radius:12px;border:1.5px solid var(--border);
      background:var(--card);font-weight:700;font-size:14px;cursor:pointer;color:var(--text);font-family:inherit;}
    .btn-primary-save{flex:1.6;padding:14px;border-radius:12px;border:none;background:var(--accent);
      color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;transition:background 0.15s;}
    .btn-primary-save:hover{background:var(--accent-dark);}
    .btn-primary-save:disabled{background:var(--bg-soft);color:rgba(33,29,23,0.3);cursor:default;}
    .btn-primary-save:active{transform:scale(0.98);}

    /* ── Detail Aktionen ── */
    .detail-action-primary{width:100%;background:var(--accent);color:#fff;border:none;
      border-radius:13px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;
      font-family:inherit;margin-bottom:10px;transition:background 0.15s;}
    .detail-action-primary:hover{background:var(--accent-dark);}
    .detail-action-secondary{width:100%;background:var(--card);color:rgba(33,29,23,0.8);
      border:1.5px solid var(--border);border-radius:13px;padding:14px;font-size:14px;
      font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:8px;transition:border-color 0.15s;}
    .detail-action-secondary:hover{border-color:var(--accent);}
    .detail-action-danger{width:100%;background:var(--crit-tint);color:var(--crit);
      border:1.5px solid rgba(178,58,46,0.3);border-radius:13px;padding:14px;font-size:14px;
      font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:8px;}

    /* ── Felder ── */
    .field{margin-bottom:14px;}
    .field label{display:block;font-size:11px;font-weight:700;color:var(--text-soft);
      letter-spacing:0.04em;margin-bottom:5px;text-transform:uppercase;}
    .field input[type=text],.field input[type=date],.field select{
      width:100%;padding:13px 12px;border-radius:12px;border:1.5px solid var(--border);
      background:var(--card);font-size:15px;color:var(--text);font-family:inherit;
      outline:none;transition:border-color 0.15s;}
    .field input:focus,.field select:focus{border-color:var(--accent);}
    .field input.shake{border-color:var(--crit);animation:shake 0.3s;}
    .two-col{display:flex;gap:10px;}
    .two-col .field{flex:1;}

    /* ── Prio Options ── */
    .prio-options{display:flex;gap:6px;flex-wrap:wrap;}
    .prio-opt{flex:1;min-width:72px;text-align:center;padding:10px 4px;border-radius:12px;
      font-size:12px;font-weight:700;border:1.5px solid var(--border);cursor:pointer;
      color:var(--text-soft);background:var(--card);font-family:inherit;transition:background 0.12s,border-color 0.12s,color 0.12s;}
    .prio-opt.sel-krit{border-color:var(--crit);background:var(--crit-tint);color:var(--crit);}
    .prio-opt.sel-heute{border-color:var(--heute);background:var(--heute-tint);color:var(--heute);}
    .prio-opt.sel-woche{border-color:var(--woche);background:var(--woche-tint);color:var(--woche);}
    .prio-opt.sel-wann{border-color:var(--wann);background:var(--wann-tint);color:var(--wann);}

    /* ── Rhythmus Options ── */
    .rhythmus-options{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
    .rhythmus-opt{flex:1;min-width:80px;text-align:center;padding:10px 4px;border-radius:12px;
      font-size:12px;font-weight:700;border:1.5px solid var(--border);cursor:pointer;
      color:var(--text-soft);background:var(--card);font-family:inherit;transition:all 0.12s;}
    .rhythmus-opt.sel{border-color:var(--accent);background:var(--accent-tint);color:var(--accent-dark);}

    /* ── Toggle ── */
    .toggle-row{display:flex;align-items:center;justify-content:space-between;
      background:var(--card);border:1px solid var(--border);border-radius:12px;
      padding:12px 14px;margin-bottom:14px;cursor:pointer;}
    .toggle-lab{font-size:13.5px;font-weight:600;}
    .toggle-desc{font-size:11.5px;color:var(--text-soft);margin-top:2px;}
    .switch{width:42px;height:24px;border-radius:99px;background:var(--border);position:relative;flex-shrink:0;}
    .switch.on{background:var(--accent);}
    .switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;
      border-radius:50%;background:#fff;transition:left 0.15s;}
    .switch.on::after{left:20px;}

    /* ── More toggle ── */
    .more-toggle{display:flex;align-items:center;gap:6px;background:none;border:none;
      color:var(--accent-dark);font-weight:700;font-size:13px;cursor:pointer;
      padding:4px 2px 14px;font-family:inherit;}
    .more-details{display:none;}
    .more-details.open{display:block;}

    /* ── Next step box ── */
    .next-step-box{background:var(--bg-soft);border:1px solid var(--border);border-radius:10px;
      padding:12px 14px;margin-bottom:20px;}
    .next-step-label{font-size:10px;color:rgba(33,29,23,0.35);font-weight:700;margin-bottom:4px;
      letter-spacing:0.06em;text-transform:uppercase;}

    /* ── Refresh ── */
    .refresh-btn{display:block;margin:0 auto 24px;background:var(--card);border:1px solid var(--border);
      border-radius:999px;padding:10px 20px;color:var(--text-soft);font-size:12px;font-weight:600;
      cursor:pointer;font-family:inherit;letter-spacing:0.04em;transition:border-color 0.15s;}
    .refresh-btn:hover{border-color:var(--accent);}

    /* ── Leer ── */
    .empty-state{text-align:center;padding-top:60px;}
    .empty-icon{font-size:48px;margin-bottom:16px;}
    .empty-title{color:rgba(33,29,23,0.6);font-size:18px;font-weight:700;}
    .empty-sub{color:rgba(33,29,23,0.3);font-size:14px;margin-top:6px;}

    /* ── Toast ── */
    .toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);
      background:var(--text);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;
      font-weight:600;max-width:88%;text-align:center;opacity:0;transition:opacity 0.25s,transform 0.25s;
      pointer-events:none;z-index:200;white-space:nowrap;}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

    /* ── Schaltzentrale ── */
    .sz-karte{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-dark) 100%);
      color:#fff;border-radius:var(--radius);padding:18px;margin-bottom:20px;
      box-shadow:0 8px 24px rgba(137,108,50,0.3);}
    .sz-tag{font-size:10px;letter-spacing:.14em;opacity:.8;font-weight:700;text-transform:uppercase;}
    .sz-zahl{font-size:40px;font-weight:800;line-height:1;}
    .sz-sub{font-size:13px;opacity:.85;margin-top:4px;}
    .sz-chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
    .sz-chip{background:rgba(255,255,255,0.2);border-radius:999px;padding:6px 12px;
      font-size:12px;font-weight:700;}
    .sz-chip.rot{background:rgba(178,58,46,0.4);}
    .sz-chip.gold{background:rgba(166,122,34,0.35);}
  </style>
</head>
<body>

<!-- LOGIN SCREEN (wird ausgeblendet nach Auth) -->
<div id="sz-login" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px;text-align:center;">
  <div style="width:14px;height:14px;border-radius:50%;background:var(--accent);margin:0 auto 20px;"></div>
  <div style="font-size:20px;font-weight:700;margin-bottom:2px;">Wörni · Schaltzentrale</div>
  <div style="font-size:11px;letter-spacing:.12em;color:var(--text-soft);text-transform:uppercase;margin-bottom:28px;">A Great Hair Day</div>
  <div style="width:100%;max-width:280px;margin:0 auto 16px;">
    <input type="email" id="sz-email" placeholder="E-Mail"
      style="width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--border);
      background:var(--card);font-size:16px;font-family:inherit;color:var(--text);
      outline:none;text-align:center;transition:border-color .15s;margin-bottom:10px;display:block;"
      onkeydown="if(event.key==='Enter')document.getElementById('sz-pw').focus()"/>
    <input type="password" id="sz-pw" placeholder="Passwort"
      style="width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--border);
      background:var(--card);font-size:16px;font-family:inherit;color:var(--text);
      outline:none;text-align:center;transition:border-color .15s;display:block;"
      onkeydown="if(event.key==='Enter')szLogin()"
      oninput="document.getElementById('sz-fehler').style.display='none'"/>
    <div id="sz-fehler" style="display:none;color:var(--crit);font-size:12px;font-weight:600;margin-top:8px;text-align:center;">
      Falsche E-Mail oder Passwort — bitte nochmal versuchen.
    </div>
  </div>
  <button id="sz-login-btn" onclick="szLogin()"
    style="background:var(--accent);color:#fff;border:none;border-radius:12px;
    padding:13px 32px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;">
    Einloggen
  </button>
</div>

<div id="root" style="display:none;"></div>

<!-- MIKRO-FAB -->
<button id="ghd-mikro-fab" style="display:none;position:fixed;left:20px;bottom:28px;z-index:9999;background:var(--bg-soft);color:var(--accent-dark);border:1.5px solid var(--border);border-radius:999px;padding:14px 22px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(137,108,50,0.2);font-family:inherit;">🎤 Sprechen</button>
<script>
document.getElementById('ghd-mikro-fab').addEventListener('click', function(){
  setTimeout(function(){
    var ev = new CustomEvent('ghd-sprache-starten');
    document.dispatchEvent(ev);
  }, 100);
});
</script>


<div class="toast" id="ghd-toast"></div>

<!-- OFFLINE-BANNER -->
<div id="offline-banner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:300;background:#B23A2E;color:#fff;text-align:center;padding:10px 16px;font-size:13px;font-weight:700;font-family:'Poppins',sans-serif;letter-spacing:.03em;">
  ⚡ Keine Verbindung — Änderungen werden nicht gespeichert
</div>
<script>
function offlineBanner(zeigen) {
  var b = document.getElementById('offline-banner');
  if (b) b.style.display = zeigen ? 'block' : 'none';
}
window.addEventListener('offline', function(){ offlineBanner(true); });
window.addEventListener('online',  function(){ offlineBanner(false); });
if (!navigator.onLine) offlineBanner(true);

// ── Supabase Auth für Schaltzentrale ──
const SZ_AUTH = supabase.createClient(
  "https://wrxlaltgtgkdomklgrlj.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndyeGxhbHRndGdrZG9ta2xncmxqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNDYwMzYsImV4cCI6MjA5OTgyMjAzNn0.Bw8ch-EJb_cLYTwxHdpjUJWgoCjje3Jc32pB0yiBS8g"
);

// ── Auftrag 1: Wörni ist exklusiver Chefin-Bereich ────────────────────────
// Jede echte Supabase-Session wird serverseitig gegen teamapp_persons geprüft
// (dieselbe Tabelle, die auch team.html/rechte-gatekeeper bereits nutzen),
// bevor die Schaltzentrale angezeigt wird. Nur "ist eingeloggt" reicht nicht
// mehr — nur rolle==='inhaberin' erhält Zugriff.
async function szPruefeChefinRolle(session) {
  try {
    if (!session || !session.user || !session.user.email) return false;
    const r = await fetch(
      `https://wrxlaltgtgkdomklgrlj.supabase.co/rest/v1/teamapp_persons?email=eq.${encodeURIComponent(session.user.email)}&select=rolle`,
      { headers: {
          "apikey": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndyeGxhbHRndGdrZG9ta2xncmxqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNDYwMzYsImV4cCI6MjA5OTgyMjAzNn0.Bw8ch-EJb_cLYTwxHdpjUJWgoCjje3Jc32pB0yiBS8g",
          "Authorization": `Bearer ${session.access_token}`
        } }
    );
    const rows = await r.json();
    return Array.isArray(rows) && rows.length > 0 && rows[0].rolle === 'inhaberin';
  } catch (e) { return false; }
}
async function szZugriffVerweigert() {
  szChefBereichAktiv = false;
  clearTimeout(szInaktivitaetsTimer);
  await SZ_AUTH.auth.signOut();
  const err = document.getElementById('sz-fehler');
  if (err) { err.textContent = 'Kein Zugriff — Wörni ist der Chefin vorbehalten.'; err.style.display = 'block'; }
  document.getElementById('root').style.display = 'none';
  document.getElementById('sz-login').style.display = 'flex';
}

async function szLogin() {
  const email = document.getElementById('sz-email').value.trim();
  const pw    = document.getElementById('sz-pw').value;
  if (!email || !pw) return;
  const btn = document.getElementById('sz-login-btn');

function tageszeitBegruessung() {

}
function formatDatum(iso) { if(!iso) return null; const d=new Date(iso); return `${d.getDate()}. ${MONATE[d.getMonth()]}`; }
function isoHeute() { return new Date().toISOString().slice(0,10); }
function morgenIso() { const d = new Date(); d.setDate(d.getDate() + 1); return d.toISOString().slice(0, 10); }

// ─── ZWEITES ÖFFNEN HEUTE (für Tagesabschluss) ────────────────────────────────
// Sehr einfache, robuste lokale Zählung: pro Kalendertag ein Zähler in localStorage.
// Zählt bei jedem Laden hoch; ab dem zweiten Aufruf am selben Tag gilt "zweites Öffnen".
function pruefeZweitesOeffnenHeute() {
  try {
    const heute = isoHeute();
    const key = 'ghd_besuche_heute';
    const roh = localStorage.getItem(key);
    let daten = roh ? JSON.parse(roh) : null;
    if (!daten || daten.datum !== heute) daten = { datum: heute, anzahl: 0 };
    daten.anzahl += 1;
    localStorage.setItem(key, JSON.stringify(daten));
    return daten.anzahl >= 2;
  } catch (e) { return false; }
}

// ─── FOKUS-STREAK ("steht seit X Tagen oben") ─────────────────────────────────
// Rein lokal (localStorage): merkt sich nur {id, tage, letzterTag} der aktuellen
// Fokus-Aufgabe — keine Historie, kein zusätzliches Datenbankfeld. Zählt nur bei
// echt aufeinanderfolgenden Kalendertagen hoch; jede Lücke oder ein Wechsel der
// Fokus-Aufgabe setzt auf 1 zurück.
function aktualisiereFokusStreak(fokusAufgabeId, heute_iso) {
  if (!fokusAufgabeId) return 0;
  try {
    const key = 'ghd_fokus_streak';
    const roh = localStorage.getItem(key);
    const rec = roh ? JSON.parse(roh) : null;
    const gestern = (() => { const d = new Date(heute_iso + 'T00:00:00'); d.setDate(d.getDate() - 1); return d.toISOString().slice(0,10); })();
    let neu;
    if (rec && rec.id === fokusAufgabeId) {
      if (rec.letzterTag === heute_iso) neu = rec;
      else if (rec.letzterTag === gestern) neu = { id: rec.id, tage: rec.tage + 1, letzterTag: heute_iso };
      else neu = { id: fokusAufgabeId, tage: 1, letzterTag: heute_iso };
    } else {
      neu = { id: fokusAufgabeId, tage: 1, letzterTag: heute_iso };
    }
    localStorage.setItem(key, JSON.stringify(neu));
    return neu.tage;
  } catch (e) { return 0; }
}

// ─── HANDLUNGSEMPFEHLUNG ("Wenn heute nur eine Sache passiert") ───────────────
// Übersetzt Engpass + Fokus-Aufgabe in einen kurzen Handlungssatz — bewusst andere
// Sprachebene als die Begründung (fokusGrund erklärt "warum oben", das hier sagt
// "was jetzt damit tun"). Rein deterministisch, keine KI nötig.
function bestimmeHandlungsempfehlung({ engpassLabel, fokusAufgabe }) {
  if (!fokusAufgabe) return null;
  const schritt = fokusAufgabe.naechster_schritt ? fokusAufgabe.naechster_schritt.trim() : null;

  if (engpassLabel === 'Rückstände') {
    return schritt ? `Schließ das jetzt ab: ${schritt}.` : 'Schließ das jetzt ab, bevor es weiter liegen bleibt.';
  }
  if (engpassLabel === 'Fristen') {
    return schritt ? `Bring das jetzt zu Ende: ${schritt}.` : 'Bring das jetzt zu Ende, bevor die Frist kippt.';
  }
  if (engpassLabel === 'Team') {
    return schritt ? `Kläre das im Team: ${schritt}.` : 'Hol dir jetzt die Rückmeldung, die im Team fehlt.';
  }
  if (engpassLabel === 'Sichtbarkeit') {
    return schritt ? `Bring das jetzt raus: ${schritt}.` : 'Bring jetzt etwas raus, damit die Woche nicht unsichtbar bleibt.';
  }
  // Kein dominanter Engpass: nur anzeigen, wenn es etwas Konkretes gibt — sonst lieber nichts
  return schritt ? `Fang damit an: ${schritt}.` : null;
}

// ─── ENGPASS-EINORDNUNG ("Heute wirklich kritisch") ───────────────────────────
// Rein deterministisch aus vorhandenen Feldern (prioritaet, faellig_am, app_kontext).
// Reihenfolge der Kandidaten = Priorität bei Gleichstand: harte Zeit-Signale vor
// weicheren Kontext-Signalen. Schwellen verhindern, dass eine einzelne Nebenaufgabe
// schon als "kritisch" auftaucht.
function bestimmeEngpass({ ueberfaellig, kritisch, faelligHeute, faelligMorgen, aufgabenSichtbar }) {
  const fristenIds = new Set();
  kritisch.forEach(a => fristenIds.add(a.id));
  faelligHeute.forEach(a => fristenIds.add(a.id));
  faelligMorgen.forEach(a => fristenIds.add(a.id));

  const teamAnzahl = aufgabenSichtbar.filter(a => a.app_kontext === 'Team' || a.app_kontext === 'Abwesenheit').length;
  const sichtbarkeitAnzahl = aufgabenSichtbar.filter(a => a.app_kontext === 'Reichweite').length;

  const kandidaten = [
    { kategorie: 'Rückstände', score: ueberfaellig.length, schwelle: 1,
      halbsatz: ueberfaellig.length === 1 ? 'Eine Aufgabe ist überfällig.' : `${ueberfaellig.length} Aufgaben sind überfällig.` },
    { kategorie: 'Fristen', score: fristenIds.size, schwelle: 1,
      halbsatz: faelligMorgen.length > 0
        ? (faelligMorgen.length === 1 ? 'Eine Frist kippt morgen.' : `${faelligMorgen.length} Fristen kippen morgen.`)
        : (fristenIds.size === 1 ? 'Eine Aufgabe ist heute kritisch.' : `${fristenIds.size} Aufgaben sind heute kritisch.`) },
    { kategorie: 'Team', score: teamAnzahl, schwelle: 2,
      halbsatz: `${teamAnzahl} offene Team-Aufgaben.` },
    { kategorie: 'Sichtbarkeit', score: sichtbarkeitAnzahl, schwelle: 2,
      halbsatz: `${sichtbarkeitAnzahl} offene Reichweite-Aufgaben.` },
  ];

  const relevante = kandidaten.filter(k => k.score >= k.schwelle);
  if (relevante.length === 0) return null;
  // stabiler Sort: bei Score-Gleichstand gewinnt die oben zuerst gelistete Kategorie
  relevante.sort((a, b) => b.score - a.score);
  const top = relevante[0];
  return { label: top.kategorie, halbsatz: top.halbsatz };
}

// ─── FOKUS-BEGRÜNDUNG (deterministisch, aus vorhandenen Feldern) ──────────────
// Harte Fälle (kritisch/überfällig/heute-fällig) werden immer klar benannt und
// brauchen keine KI — nur der weiche Restfall (keine klare Frist/Priorität)
// bekommt optional eine KI-Einordnung obendrauf.
function berechneFokusGrund(aufgabe, heute_iso, morgen_iso, ueberfaelligListe) {
  if (!aufgabe) return null;
  const istUeberfaellig = (ueberfaelligListe || []).some(a => a.id === aufgabe.id);
  const faelligDatum = aufgabe.faellig_am ? aufgabe.faellig_am.slice(0, 10) : null;

  if (aufgabe.prioritaet === "kritisch") {
    return istUeberfaellig
      ? { text: 'Zuerst, weil das kritisch ist und die Frist bereits überschritten ist.', hart: true }
      : { text: 'Zuerst, weil das kritisch ist.', hart: true };
  }
  if (istUeberfaellig) {
    const tage = Math.max(1, Math.round((new Date(heute_iso) - new Date(faelligDatum)) / 86400000));
    return { text: `Zuerst, weil die Frist seit ${tage} Tag${tage > 1 ? 'en' : ''} überschritten ist.`, hart: true };
  }
  if (faelligDatum === heute_iso) {
    return { text: 'Zuerst, weil die Frist heute endet.', hart: true };
  }
  if (faelligDatum === morgen_iso) {
    return { text: 'Zuerst, weil die Frist morgen endet.', hart: true };
  }
  if (aufgabe.prioritaet === "heute") {
    return { text: 'Zuerst, weil das für heute markiert ist.', hart: true };
  }
  // Weicher Fall: keine klare Frist/Priorität unterscheidet diese Aufgabe von anderen
  return { text: 'Zuerst, weil gerade sonst nichts Dringenderes ansteht.', hart: false };
}
function ersterDesMonats() { const d=new Date(); return d.getDate()===1; }
function istMontag() { return new Date().getDay()===1; }

// Prüft ob Vorlage heute fällig ist und noch keine Aufgabe existiert
function vorlageFaellig(vorlage, aufgaben) {
  if (!vorlage.aktiv) return false;
  const exists = aufgaben.some(a => a.signal_key === `vorlage_${vorlage.id}_${isoHeute()}`);
  if (exists) return false;
  if (vorlage.rhythmus === 'taeglich') return true;
  if (vorlage.rhythmus === 'woechentlich' && istMontag()) return true;
  if (vorlage.rhythmus === 'monatlich' && ersterDesMonats()) return true;
  return false;
}

// Nur für die Anzeige im Vorlagen-Tab: dieselbe Rhythmus-Tageslogik wie oben
// (rhythmus + istMontag()/ersterDesMonats()), aber bewusst OHNE den Duplikat-Schutz
// (exists-Check) — der gehört zur automatischen Aufgaben-Erzeugung, nicht zur Frage
// "steht das laut Rhythmus heute an". vorlageFaellig() bleibt unverändert und wird
// weiterhin unverändert für die automatische Aufgaben-Erzeugung verwendet.
function rhythmusHeuteDran(vorlage) {
  if (!vorlage.aktiv) return false;
  if (vorlage.rhythmus === 'taeglich') return true;
  if (vorlage.rhythmus === 'woechentlich') return istMontag();
  if (vorlage.rhythmus === 'monatlich') return ersterDesMonats();
  return false;
}

// ─── AUFGABE FORM ─────────────────────────────────────────────────────────────
function AufgabeForm({ initial, onSave, onDelete, onClose, isEdit }) {
  function normPrio(p) {
    // Nur für Anzeige: keine Umwandlung nötig, DB-Werte bleiben wie sie sind
    return p || "heute";
  }
  const leer = { typ:"betrieb", titel:"", naechster_schritt:"", prioritaet:"heute", faellig_am:"" };
  const [form, setForm] = useState(initial ? {
    typ: initial.typ||"betrieb",
    titel: initial.titel||"",
    naechster_schritt: initial.naechster_schritt||"",
    prioritaet: normPrio(initial.prioritaet),
    faellig_am: initial.faellig_am ? initial.faellig_am.slice(0,10) : "",
  } : leer);
  const [moreOpen, setMoreOpen] = useState(isEdit);
  const [shaking, setShaking] = useState(false);
  const [delConfirm, setDelConfirm] = useState(false);
  const [saving, setSaving] = useState(false);
  const set = (k, v) => setForm(p => ({ ...p, [k]: v }));
  const valid = form.titel.trim().length > 1;

  async function speichern() {
    if (!valid) { setShaking(true); setTimeout(()=>setShaking(false),400); toast('Bitte einen Titel eingeben'); return; }
    setSaving(true);
    try {
      await onSave({ ...form, faellig_am: form.faellig_am || null });
    } catch(err) {
      toast('⚠ Speichern fehlgeschlagen: ' + err.message.slice(0,60));
    } finally {
      setSaving(false);
    }
  }

  return (
    <div className="modal-backdrop" onClick={e => e.target===e.currentTarget && onClose()}>
      <div className="sheet" onClick={e => e.stopPropagation()}>
        <div className="sheet-scroll">
          <div className="sheet-handle"/>
          <h2>{isEdit ? 'Aufgabe bearbeiten' : 'Neue Aufgabe'}</h2>
          <p className="sheet-hint">{isEdit ? 'Änderungen werden sofort gespeichert.' : 'Titel eingeben, Wann wählen — fertig.'}</p>

          {/* TITEL — groß und klar */}
          <div className="field">
            <input type="text" className={shaking ? 'shake' : ''}
              value={form.titel} onChange={e => set("titel", e.target.value)}
              placeholder="Was soll Wörni erledigen?"
              style={{ fontSize:16, padding:'16px 14px' }}
              autoFocus={!isEdit}/>
          </div>

          {/* WANN — die einzige Pflichtauswahl */}
          <div className="field">
            <label>Wann?</label>
            <WannChips selected={form.prioritaet} onChange={v => set("prioritaet", v)} />
          </div>

          {/* MEHR DETAILS — optional, eingeklappt */}
          <button className="more-toggle" onClick={() => setMoreOpen(o => !o)}>
            {moreOpen ? '－ Weniger' : '＋ Mehr Details (optional)'}
          </button>
          <div className={`more-details ${moreOpen ? 'open' : ''}`}>
            <div className="field">

// ─── HAUPTKOMPONENTE ──────────────────────────────────────────────────────────
function Woerni() {
  const [aufgaben, setAufgaben]       = useState([]);
  const [erledigt, setErledigt]       = useState([]);
  const [vorlagen, setVorlagen]       = useState([]);
  const [ereignisse, setEreignisse]   = useState([]);
  const [laden, setLaden]             = useState(true);
  const [fehler, setFehler]           = useState(null);
  const [liveVerbunden, setLiveVerbunden] = useState(false);
  const [ausgewaehlt, setAusgewaehlt] = useState(null);
  const [bearbeiten, setBearbeiten]   = useState(null);
  const [neueAufgabe, setNeueAufgabe] = useState(false);
  const [neueVorlage, setNeueVorlage] = useState(false);
  const [bearbVorlage, setBearbVorlage] = useState(null);
  const [vorlagenAlleZeigen, setVorlagenAlleZeigen] = useState(false);
  const TAB_KEY = 'ghd_woerni_tab';
  const [tab, setTab] = useState(() => {
    try { return localStorage.getItem(TAB_KEY) || 'heute'; } catch(e) { return 'heute'; }
  });

  function wechsleTab(id) {
    setTab(id);
    try { localStorage.setItem(TAB_KEY, id); } catch(e) {}
  }
  const [sprache, setSprache] = useState(false); // Spracheingabe aktiv
  const [sprachText, setSprachText] = useState('');
  const [woerniAntwort, setWoerniAntwort] = useState('');
  const [fokusKIText, setFokusKIText] = useState(null); // {id, text|null} — Cache pro Fokus-Aufgabe, nur für den weichen Fall
  const [zweitesOeffnenHeute] = useState(() => pruefeZweitesOeffnenHeute());
  const [fokusStreakTage, setFokusStreakTage] = useState(0);
  const [hoert, setHoert] = useState(false);
  const erkennungRef = useRef(null);

  // Fix-Aufgaben zurücksetzen
  async function resetFixAufgaben(alle) {
    const heute = new Date().toISOString().slice(0,10);
    const zuReset = alle.filter(a => a.fix && a.status==="erledigt" && a.erledigt_am && a.erledigt_am.slice(0,10) < heute);
    for (const a of zuReset) await api.updateAufgabe(a.id, { status:"neu", erledigt_am:null, erledigt_von:null });
    return zuReset.length > 0;
  }

  // Vorlagen-Aufgaben automatisch erstellen
  async function erstelleVorlagenAufgaben(vorlagen_, aufgaben_) {
    const faellig = vorlagen_.filter(v => vorlageFaellig(v, aufgaben_));
    for (const v of faellig) {
      await api.addAufgabe({
        titel: v.titel,
        naechster_schritt: v.naechster_schritt||"",
        prioritaet: v.prioritaet,
        typ: v.typ,
        status: "offen",
        erstellt_von: "wörni-auto",
        app_kontext: `vorlage_${v.rhythmus}`,
        signal_key: `vorlage_${v.id}_${isoHeute()}`,
      });
    }
    return faellig.length > 0;
  }

  const CACHE_KEY = 'ghd_woerni_cache';

  function cacheSchreiben(a_, e_, v_) {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        aufgaben: a_, erledigt: e_, vorlagen: v_,
        gespeichert: new Date().toISOString()
      }));
    } catch(e) {}
  }

  function cacheLaden() {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch(e) { return null; }
  }

  async function laden_() {
    // Cache sofort anzeigen während geladen wird
    if (aufgaben.length === 0) {
      const cache = cacheLaden();
      if (cache) {
        setAufgaben(cache.aufgaben||[]);
        setErledigt(cache.erledigt||[]);
        setVorlagen(cache.vorlagen||[]);
      }
    }
    try {
      setFehler(null); setLaden(true);
      const [a, e, v, ev] = await Promise.all([api.getAufgaben(), api.getErledigt(), api.getVorlagen(), api.getEreignisse().catch(()=>[])]);
      const hatReset = await resetFixAufgaben(a||[]);
      // Für die "schon erledigt heute?"-Prüfung auch die zuletzt erledigten Aufgaben
      // mitgeben, nicht nur die offenen — sonst legt Wörni eine gerade erledigte
      // Vorlagen-Aufgabe am selben Tag sofort wieder neu an.
      const hatNeu   = await erstelleVorlagenAufgaben(v||[], [...(a||[]), ...(e||[])]);
      if (hatReset || hatNeu) {
        const [a2, e2] = await Promise.all([api.getAufgaben(), api.getErledigt()]);
        setAufgaben(a2||[]); setErledigt(e2||[]);
        cacheSchreiben(a2||[], e2||[], v||[]);
      } else {
        console.log('[DEBUG] Aufgaben aus Supabase:', (a||[]).map(x => ({id:x.id, titel:x.titel?.slice(0,20), prioritaet:x.prioritaet, status:x.status})));
      setAufgaben(a||[]); setErledigt(e||[]);
        cacheSchreiben(a||[], e||[], v||[]);
      }
      setEreignisse(ev||[]);
      setVorlagen(v||[]);
    } catch(err) {
      const cache = cacheLaden();
      if (cache) {
        setAufgaben(cache.aufgaben||[]);
        setErledigt(cache.erledigt||[]);
        setVorlagen(cache.vorlagen||[]);
        const zeit = cache.gespeichert
          ? new Date(cache.gespeichert).toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'})
          : '';
        setFehler('Offline — letzte Daten vom ' + zeit);
      } else {
        setFehler('Keine Verbindung und noch kein Cache verfügbar');
      }
    }
    finally { setLaden(false); }
  }

  useEffect(() => {
    // Erstmaliges Laden
    laden_();

    // Realtime: ghd_aufgaben + ghd_aufgaben_vorlagen → Aufgabenliste neu laden
    const aufgabenChannel = sbClient
      .channel('woerni-aufgaben')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'ghd_aufgaben' }, () => laden_())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'ghd_aufgaben_vorlagen' }, () => laden_())
      .subscribe(status => setLiveVerbunden(status === 'SUBSCRIBED'));

    // Realtime: ghd_ereignisse → nur Ereignisse aktualisieren
    const ereignisseChannel = sbClient
      .channel('woerni-ereignisse')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'ghd_ereignisse' }, payload => {
        setEreignisse(prev => [payload.new, ...prev]);
        toast('📡 Neues Ereignis aus einer App');
      })

  // ── Intent-Parsing: Priorität & Typ aus gesprochenem Text erkennen ──
  function intentParsing(text) {
    const t = text.toLowerCase();

    // Vorlage-Erkennung
    let istVorlage = false;
    let rhythmus = 'monatlich';
    if (/vorlage|wiederkehrend|immer wieder|regelmäßig|regelmassig/.test(t)) istVorlage = true;
    if (/täglich|taeglich|jeden tag|every day/.test(t)) { istVorlage = true; rhythmus = 'taeglich'; }
    if (/jeden montag|jede woche|wöchentlich|woechentlich/.test(t)) { istVorlage = true; rhythmus = 'woechentlich'; }
    if (/jeden monat|monatlich|jeden ersten/.test(t)) { istVorlage = true; rhythmus = 'monatlich'; }

    // Priorität
    let prioritaet = 'heute'; // Standard
    if (/dringend|sofort|kritisch|notfall|unbedingt|jetzt|emergency/.test(t))
      prioritaet = 'kritisch';
    else if (/heute|heut|asap|bald|schnell/.test(t))
      prioritaet = 'heute';
    else if (/diesen monat|monat|bis ende|monatsende/.test(t))
      prioritaet = 'diesen-monat';
    else if (/speziell|besonderer|einmalig|event|termin|irgendwann|später|wenn zeit/.test(t))
      prioritaet = 'speziell';

    // Typ
    let typ = 'betrieb'; // Standard
    if (/bestell|einkauf|lager|lieferung|nachbestell/.test(t))
      typ = 'bestellung';
    else if (/team|mitarbeiter|lehrl|gespräch|besprechung|sagen|schreib|anruf|mail/.test(t))
      typ = 'kommunikation';
    else if (/entscheid|wählen|auswählen|überlegen|beschließen/.test(t))
      typ = 'entscheidung';
    else if (/lern|quiz|kurs|fortbild|prüfung/.test(t))
      typ = 'lernen';

    return { prioritaet, typ, istVorlage, rhythmus };
  }

              </div>
              <div style={{fontSize:11,color:'var(--text-soft)',marginTop:2}}>
                {faelligBald.map(a => a.titel).join(' · ')}
              </div>
            </div>
          </div>
        )}

        {/* TABS */}
        <div className="tabs">
          {[["heute",`Offen${aufgaben.length>0?' ('+aufgaben.length+')':''}`],["vorlagen",`Vorlagen${vorlagen.length>0?' ('+vorlagen.length+')':''}`],["erledigt","Erledigt"]].map(([id,label]) => (
            <button key={id} className={`tab ${tab===id?'active':''}`} onClick={() => wechsleTab(id)}>{label}</button>
          ))}
        </div>

        {/* FEHLER */}
        {fehler && (
          <div className="fehler-box">
            <p style={{color:'var(--crit)',fontSize:14,fontWeight:600,margin:0}}>{fehler}</p>
            <button onClick={laden_} style={{marginTop:8,fontSize:13,color:'rgba(33,29,23,0.5)',background:'none',border:'none',cursor:'pointer',padding:0,textDecoration:'underline',fontFamily:'inherit'}}>
              Erneut versuchen
            </button>
          </div>
        )}

        {/* SKELETON */}
        {laden && (
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {[...Array(3)].map((_,i) => <div key={i} className="skeleton" style={{animationDelay:`${i*80}ms`}}/>)}
          </div>
        )}

        {/* TAB: OFFEN */}
        {!laden && tab==="heute" && (
          <>
            {/* EREIGNISSE aus ghd_ereignisse */}
            {ereignisse.length > 0 && (
              <div style={{marginBottom:24}}>
                <div className="abschnitt-header">
                  <span className="abschnitt-label" style={{color:'var(--woche)'}}>📡 Neu aus Apps</span>
                  <span className="abschnitt-count">{ereignisse.length}</span>
                  <div className="abschnitt-line"/>
                </div>
                {ereignisse.map((ev, i) => (
                  <div key={ev.id} className="aufgabe-card einblenden" style={{animationDelay:`${i*40}ms`}}
                    onClick={async () => {
                      // Karte sofort aus der Ansicht nehmen — unabhängig vom Netzwerk, damit
                      // ein Antippen nie hängen/blockiert wirkt. Alles Weitere (Aufgabe anlegen,
                      // als gelesen markieren) läuft im Hintergrund weiter wie bisher.
                      setEreignisse(prev => prev.filter(e => e.id !== ev.id));

                      // Priorität aus Ereignis ableiten
                      const prio = ev.prioritaet && PRIORITAETEN[ev.prioritaet]
                        ? ev.prioritaet
                        : "diese-woche";

                      // Nur für Belege: doppelte offene Aufgabe für denselben Kalendermonat
                      // verhindern. Schlüssel aus dem bestehenden Ereignis-Zeitstempel
                      // (erstellt_am), nicht aus dem Antipp-Zeitpunkt. Für alle anderen
                      // Ereignis-Typen (u.a. Reichweite) bleibt signalKey null und der
                      // Ablauf exakt wie bisher.
                      let signalKey = null;
                      if (ev.app === "Belege") {
                        const monat = (ev.erstellt_am || new Date().toISOString()).slice(0,7);
                        signalKey = `belege-pruefbedarf-${monat}`;
                        const bereitsOffen = aufgaben.some(a => a.signal_key === signalKey);
                        if (bereitsOffen) {
                          await api.ereignisGelesen(ev.id).catch(()=>{});
                          toast('Für diesen Monat ist schon eine Belege-Aufgabe offen');
                          return;
                        }
                      } else if (ev.app === "Reichweite") {
                        // Nur für Reichweite: doppelte offene Aufgabe für dieselbe Kalenderwoche
                        // verhindern. Schlüssel aus dem bestehenden Ereignis-Zeitstempel
                        // (erstellt_am), nicht aus dem Antipp-Zeitpunkt. Dieselbe KW-Berechnung
                        // wie getKwKey() in Reichweite.html, nur mit dem Ereignis-Datum statt
                        // new Date().
                        const evDatum = new Date(ev.erstellt_am || Date.now());
                        const jahresstart = new Date(evDatum.getFullYear(), 0, 1);
                        const kw = Math.ceil(((evDatum - jahresstart) / 86400000 + jahresstart.getDay() + 1) / 7);
                        const kwKey = evDatum.getFullYear() + '-W' + String(kw).padStart(2, '0');
                        signalKey = `reichweite-luecke-${kwKey}`;
                        const bereitsOffen = aufgaben.some(a => a.signal_key === signalKey);
                        if (bereitsOffen) {
                          await api.ereignisGelesen(ev.id).catch(()=>{});
                          toast('Für diese Woche ist schon eine Reichweite-Aufgabe offen');
                          return;
                        }
                      }

                      // Aufgabe erstellen
                      try {
                        await api.addAufgabe({
                          titel: ev.titel,
                          typ: "betrieb",
                          prioritaet: prio,
                          app_kontext: ev.app || null,
                          erstellt_von: "woerni",
                          ...(signalKey ? { signal_key: signalKey } : {}),
                        });
                        toast('✓ Aufgabe erstellt');
                      } catch(e) {
                        toast('⚠ Aufgabe konnte nicht erstellt werden');
                      }
                      // Ereignis als gelesen markieren (Karte ist bereits entfernt)
                      await api.ereignisGelesen(ev.id).catch(()=>{});
                      // Aufgabenliste neu laden damit Aufgabe sofort erscheint
                      laden_();
                    }}>
                    <div className="aufgabe-stripe" style={{background:'var(--woche)',opacity:0.6}}/>
                    <div style={{paddingLeft:10}}>
                      <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:6,flexWrap:'wrap'}}>
                        <span className="badge badge-woche">{ev.app.toUpperCase()}</span>
                        <span style={{fontSize:11,color:'rgba(33,29,23,0.4)',marginLeft:'auto'}}>
                          {ev.erstellt_am ? new Date(ev.erstellt_am).toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'}) : ''}
                        </span>
                      </div>
                      <p style={{color:'#211D17',fontWeight:600,fontSize:14,lineHeight:1.35,marginBottom:0}}>
                        {ev.titel}
                      </p>
                      <p style={{fontSize:11,color:'rgba(33,29,23,0.4)',marginTop:4}}>
                        Tippen → Wörni erstellt Aufgabe
                      </p>
                    </div>
                  </div>
                ))}
              </div>
            )}
            <Abschnitt label="🔴 Kritisch" stripeColor="var(--crit)"
              kinder={gruppen.kritisch.map((a,i) => <AufgabeKarte key={a.id} aufgabe={a} delay={i*55} onClick={() => setAusgewaehlt(a)}/>)} />
            <Abschnitt label="🟠 Heute" stripeColor="var(--heute)"
              kinder={gruppen.heute.map((a,i) => <AufgabeKarte key={a.id} aufgabe={a} delay={i*55} onClick={() => setAusgewaehlt(a)}/>)} />
            <Abschnitt label="📅 Diesen Monat" stripeColor="var(--woche)"
              kinder={gruppen["diesen-monat"].map((a,i) => <AufgabeKarte key={a.id} aufgabe={a} delay={i*55} onClick={() => setAusgewaehlt(a)}/>)} />
            <Abschnitt label="🎯 Speziell" stripeColor="var(--wann)"
              kinder={gruppen["speziell"].map((a,i) => <AufgabeKarte key={a.id} aufgabe={a} delay={i*55} onClick={() => setAusgewaehlt(a)}/>)} />
            {aufgaben.length===0 && !fehler && (
              <div className="empty-state einblenden">
                <div className="empty-icon">✓</div>
                <p className="empty-title">Alles erledigt.</p>
                <p className="empty-sub">Great Hair Day läuft.</p>
              </div>
            )}
          </>
        )}

        {/* TAB: VORLAGEN */}
        {!laden && tab==="vorlagen" && (
          <div>
            {(() => {
              if (vorlagen.length === 0) return null;
              const appIcons = {
                'Aufträge':'🏠','Reichweite':'✨','Checklisten':'✅','Abwesenheit':'📅',
                'Team':'💬','Lernquiz':'✂️','Lerntool':'📖','Lager':'📦',
                'Handbuch':'📒','Belege':'🧾','Wörni':'🤖','Innung':'🏫',
                'Schnuppertag':'🌟','Schrank':'🗄','Sonstige':'📋'
              };
              const appUrls = {
                'Aufträge':    'woerni.html',
                'Reichweite':  'https://mirjamwalenta-a11y.github.io/moment.greathairday/reichweite.html',
                'Checklisten': 'https://mirjamwalenta-a11y.github.io/salon-checklist/salon-checklist.html',
                'Abwesenheit': 'https://mirjamwalenta-a11y.github.io/abwesenheiten-ghd/abwesenheiten.html',
                'Team':        'https://mirjamwalenta-a11y.github.io/Team/',
                'Lernquiz':    'https://mirjamwalenta-a11y.github.io/lernquiz.greathairday/lernquiz.html',
                'Lerntool':    'https://mirjamwalenta-a11y.github.io/lernquiz.greathairday/lerntool.html',
                'Lager':       'https://mirjamwalenta-a11y.github.io/lager.greathairday/Lager_index.html',
                'Handbuch':    'https://mirjamwalenta-a11y.github.io/Mitarbeiterhandbuch/Mitarbeiterhandbuch_App.html',
                'Belege':      'https://mirjamwalenta-a11y.github.io/belege.greathairday/belege.html',
                'Innung':      'https://mirjamwalenta-a11y.github.io/innungsapp.greathairday/innungsapp.html',
                'Schnuppertag':'https://mirjamwalenta-a11y.github.io/lernquiz.greathairday/schnuppertag.html',
                'Schrank':     'https://mirjamwalenta-a11y.github.io/dokumentenschrank-ghd/',
              };

              // Eine Vorlage-Karte — unverändertes Markup, nur einmal herausgezogen,
              // damit "Heute dran" und die vollständige Liste exakt gleich aussehen.
              const renderVorlageCard = (v) => {
                const r = RHYTHMEN[v.rhythmus]||RHYTHMEN['spontan'];
                const appKey = v.app || 'Sonstige';
                return (
                  <div key={v.id} className={`vorlage-card ${!v.aktiv?'inaktiv':''}`}
                    style={{flexDirection:'column',alignItems:'stretch',gap:8}}
                    onClick={() => setBearbVorlage(v)}>
                    <div style={{display:'flex',alignItems:'center',gap:12}}>
                      <span className={`vorlage-rhythmus ${r.cls}`}>{r.label}</span>
                      <div style={{flex:1}}>
                        <p style={{margin:0,fontWeight:600,fontSize:14,color:'var(--text)'}}>{v.titel}</p>
                        {v.naechster_schritt && <p style={{margin:'2px 0 0',fontSize:12,color:'var(--text-soft)'}}>{v.naechster_schritt}</p>}
                      </div>
                      <span className={`badge ${(PRIORITAETEN[v.prioritaet]||PRIORITAETEN["diese-woche"]).badgeCls}`} style={{fontSize:9}}>
                        {(PRIORITAETEN[v.prioritaet]||PRIORITAETEN["diese-woche"]).label}
                      </span>
                      <span style={{color:'var(--text-soft)',fontSize:18}}>›</span>
                    </div>
                    {v.aktiv && (
                      <button
                        onClick={async e => {
                          e.stopPropagation();
                          await addAufgabe({
                            titel: v.titel,
                            naechster_schritt: v.naechster_schritt||'',
                            prioritaet: v.prioritaet,
                            typ: v.typ,
                          });
                          toast('✓ Aufgabe erstellt — jetzt in Offen');
                        }}
                        style={{
                          background:'var(--accent)',color:'#fff',border:'none',
                          borderRadius:10,padding:'9px 14px',fontWeight:700,
                          fontSize:13,cursor:'pointer',fontFamily:'inherit',
                          width:'100%',marginTop:2
                        }}>
                        ▶ Jetzt als Aufgabe erstellen
                      </button>
                    )}
                    {appUrls[appKey] && (
                      <button
                        onClick={e => { e.stopPropagation(); window.location.href = appUrls[appKey]; }}
                        style={{
                          background:'var(--card)',color:'var(--accent-dark)',
                          border:'1.5px solid var(--border)',
                          borderRadius:10,padding:'9px 14px',fontWeight:700,
                          fontSize:13,cursor:'pointer',fontFamily:'inherit',
                          width:'100%',marginTop:4
                        }}>
                        → {appKey} öffnen
                      </button>
                    )}
                  </div>
                );
              };

              // Nach App gruppieren — für die vollständige Liste, unverändert wie bisher.
              const apps = [...new Set(vorlagen.map(v => v.app||'Sonstige'))].sort();
              // Nur die bestehende Rhythmus-Tageslogik (wie in vorlageFaellig, ohne den
              // Duplikat-Schutz) — bestimmt, was heute im Vordergrund steht.
              const vorlagenHeute = vorlagen.filter(rhythmusHeuteDran);

              return (
                <div>
                  {/* HEUTE DRAN — verdichtete Führungsansicht, steht zuerst */}
                  <div style={{marginBottom:28}}>
                    <div className="abschnitt-header">
                      <span className="abschnitt-label" style={{color:'var(--accent-dark)'}}>📆 Heute dran</span>
                      <span className="abschnitt-count">{vorlagenHeute.length}</span>
                      <div className="abschnitt-line"/>
                    </div>
                    {vorlagenHeute.length > 0
                      ? vorlagenHeute.map(renderVorlageCard)
                      : <p className="prio-empty-hint">Heute steht laut Rhythmus keine Vorlage an.</p>}
                  </div>

                  {/* VOLLSTÄNDIGE LISTE — bleibt erhalten, tritt aber in den Hintergrund */}
                  <button className="more-toggle" onClick={() => setVorlagenAlleZeigen(o => !o)}>
                    {vorlagenAlleZeigen ? '－ Alle Vorlagen ausblenden' : `＋ Alle Vorlagen anzeigen (${vorlagen.length})`}
                  </button>
                  <div className={`more-details ${vorlagenAlleZeigen ? 'open' : ''}`}>
                    {apps.map(app => {
                      const gruppe = vorlagen.filter(v => (v.app||'Sonstige')===app);
                      if (gruppe.length===0) return null;
                      return (
                        <div key={app} style={{marginBottom:28}}>
                          <div className="abschnitt-header">
                            <span className="abschnitt-label" style={{color:'var(--accent-dark)'}}>
                              {appIcons[app]||'📋'} {app}
                            </span>
                            <span className="abschnitt-count">{gruppe.length}</span>
                            <div className="abschnitt-line"/>
                          </div>
                          {gruppe.map(renderVorlageCard)}
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })()}
            {vorlagen.length===0 && (
              <div className="empty-state einblenden">
                <div className="empty-icon">📋</div>
                <p className="empty-title">Noch keine Vorlagen.</p>
                <p className="empty-sub">Erstelle wiederkehrende Aufgaben-Vorlagen.</p>
              </div>
            )}
            <button className="refresh-btn" style={{marginTop:8}} onClick={() => setNeueVorlage(true)}>
              + Neue Vorlage erstellen
            </button>
            <button className="refresh-btn" style={{marginTop:6}} onClick={spracheStarten}>
              🎤 Per Sprache erstellen
            </button>
          </div>
        )}

        {/* TAB: ERLEDIGT */}
        {!laden && tab==="erledigt" && (
          <div>
            {erledigt.length===0 && <p style={{color:'rgba(33,29,23,0.3)',fontSize:14,textAlign:'center',paddingTop:40}}>Noch nichts erledigt.</p>}
            {erledigt.map((a,i) => (
              <div key={a.id} className="done-card einblenden" style={{animationDelay:`${i*50}ms`}}>
                <div style={{width:20,height:20,borderRadius:'50%',background:'var(--bg-soft)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                  <span style={{fontSize:10,color:'rgba(33,29,23,0.4)'}}>✓</span>
                </div>
                <div style={{flex:1}}>
                  <p style={{color:'rgba(33,29,23,0.45)',fontSize:14,fontWeight:600,textDecoration:'line-through',textDecorationColor:'rgba(33,29,23,0.15)',margin:0}}>{a.titel}</p>
                  {a.erledigt_am && <p style={{fontSize:11,color:'rgba(33,29,23,0.2)',marginTop:2}}>{formatDatum(a.erledigt_am)}</p>}
                </div>
              </div>
            ))}
          </div>
        )}

      </div>

      {/* REFRESH */}
      <div style={{padding:'24px 20px 0'}}>
        <button className="refresh-btn" onClick={laden_}>↻ Aktualisieren</button>
      </div>

      {/* FABs */}
      <div style={{position:'fixed',right:20,bottom:28,display:'flex',gap:10,zIndex:20}}>
        <button className="fab" onClick={() => setNeueAufgabe(true)}>+ Aufgabe</button>
      </div>



      {/* MODALS */}
      {ausgewaehlt && (
        <AufgabeDetail aufgabe={ausgewaehlt}
          onUpdate={updateAufgabe}
          onDelete={() => deleteAufgabe(ausgewaehlt.id)}
          onClose={() => setAusgewaehlt(null)}
          onEdit={a => { setAusgewaehlt(null); setBearbeiten(a); }}
          onAlsVorlage={async a => {
            await addVorlage({ titel: a.titel, naechster_schritt: a.naechster_schritt||'', prioritaet: a.prioritaet, typ: a.typ, rhythmus: 'monatlich', aktiv: true, app: 'Sonstige' });
            setAusgewaehlt(null);
            toast('🔁 Als Vorlage gespeichert');
          }}
        />
      )}
      {bearbeiten && (
        <AufgabeForm initial={bearbeiten} isEdit
          onSave={d => editAufgabe(bearbeiten.id, d).then(() => setBearbeiten(null))}
          onDelete={() => deleteAufgabe(bearbeiten.id).then(() => setBearbeiten(null))}
          onClose={() => setBearbeiten(null)}
        />
      )}
      {neueAufgabe && (
        <AufgabeForm onSave={d => addAufgabe(d).then(() => setNeueAufgabe(false))} onClose={() => setNeueAufgabe(false)} />
      )}

      {sprache && (
        <div className="modal-backdrop" onClick={spracheAbbrechen}>
          <div className="sheet" onClick={e => e.stopPropagation()}>
            <div className="sheet-scroll" style={{padding:'10px 24px 6px'}}>
              <div className="sheet-handle"/>
              <div style={{textAlign:'center',marginBottom:16}}>
                <div style={{fontSize:36,marginBottom:8}}>{hoert ? '🎤' : '⏸'}</div>
                <div style={{fontWeight:700,fontSize:16,marginBottom:4}}>
                  {hoert ? 'Ich höre zu…' : 'Mikrofon bereit'}
                </div>
                <div style={{fontSize:12,color:'var(--text-soft)'}}>
                  {hoert ? 'Sprich jetzt' : 'Tippe auf das Mikrofon'}
                </div>
              </div>
              {!hoert && !sprachText && (
                <div style={{textAlign:'center',marginBottom:16}}>
                  <button onClick={spracheStarten} style={{background:'var(--accent)',color:'#fff',border:'none',borderRadius:999,width:64,height:64,fontSize:24,cursor:'pointer',boxShadow:'0 6px 16px rgba(137,108,50,0.35)'}}>🎤</button>
                </div>
              )}
              {sprachText && (
                <div style={{background:'var(--bg-soft)',border:'1px solid var(--border)',borderRadius:12,padding:'12px 14px',marginBottom:12}}>
                  <div style={{fontSize:10,fontWeight:700,color:'var(--text-soft)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:4}}>Du hast gesagt</div>
                  <div style={{fontSize:15,fontWeight:600,color:'var(--text)',lineHeight:1.4}}>{sprachText}</div>
                  {(() => {
                    const { prioritaet, typ, istVorlage, rhythmus } = intentParsing(sprachText);
                    const p = PRIORITAETEN[prioritaet];
                    const tp = TYPEN[typ];
                    return (
                      <div style={{display:'flex',gap:6,marginTop:10,flexWrap:'wrap'}}>
                        {istVorlage
                          ? <span className="badge badge-auto">🔁 Vorlage · {RHYTHMEN[rhythmus].label}</span>
                          : <span className={`badge ${p.badgeCls}`}>→ {p.label}</span>}
                        <span className="badge badge-typ">{tp.icon} {tp.label}</span>
                      </div>
                    );
                  })()}
                </div>
              )}
              {sprachText && !hoert && (
                <button onClick={spracheStarten} style={{display:'block',width:'100%',background:'none',border:'1px solid var(--border)',borderRadius:10,padding:'10px',fontSize:13,color:'var(--text-soft)',cursor:'pointer',fontFamily:'inherit',marginBottom:8}}>🎤 Nochmal sprechen</button>
              )}
            </div>
            {woerniAntwort && (
              <div style={{margin:'8px 0',background:'var(--bg-soft)',border:'1px solid var(--border)',borderRadius:12,padding:'12px 14px'}}>
                <div style={{fontSize:10,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:'var(--accent-dark)',marginBottom:4}}>🤖 Wörni antwortet</div>
                <div style={{fontSize:14,lineHeight:1.6,color:'var(--text)'}}>{woerniAntwort}</div>
              </div>
            )}
            <div className="sheet-actions" style={{flexDirection:'column',gap:8}}>
              <div style={{display:'flex',gap:8}}>
                <button className="btn-secondary" onClick={spracheAbbrechen}>Schließen</button>
                {sprachText && (
                  <button className="btn-primary-save" onClick={spracheBestaetigen}>✓ Als Aufgabe speichern</button>
                )}
              </div>
            </div>
          </div>
        </div>
      )}
      {neueVorlage && (
        <VorlageForm onSave={d => addVorlage(d).then(() => setNeueVorlage(false))} onClose={() => setNeueVorlage(false)} />
      )}
      {bearbVorlage && (
        <VorlageForm initial={bearbVorlage} isEdit
          onSave={d => editVorlage(bearbVorlage.id, d).then(() => setBearbVorlage(null))}
          onDelete={() => deleteVorlage(bearbVorlage.id).then(() => setBearbVorlage(null))}
          onClose={() => setBearbVorlage(null)}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Woerni />);
</script>


</body>
</html>

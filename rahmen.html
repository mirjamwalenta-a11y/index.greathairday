<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Great Hair Day</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c1917">
<!--
  APP-RAHMEN der Salon-App „GHD“
  Das Alle-Apps-Verzeichnis (ghd-verzeichnis.js) öffnet eine App in der
  installierten Salon-App hier im Rahmen, statt direkt dorthin zu springen.
  Grund: Ist die Ziel-App auf dem Handy auch einzeln installiert (Checkliste,
  Team, Lager …), öffnet Android sonst diese eigene App – und „Zurück“ schließt
  sie ganz. Im Rahmen bleibt alles in GHD, „Zurück“ geht Schritt für Schritt
  zurück (der Browser führt den Verlauf des Rahmens automatisch mit).
  Aufruf: rahmen.html#<Adresse der App, URL-kodiert>. Nur Adressen unter
  https://mirjamwalenta-a11y.github.io/ werden geöffnet, alles andere führt
  zur Startseite.
-->
<style>
  html, body { margin: 0; height: 100%; background: #faf7f0; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #faf7f0; }
</style>
</head>
<body>
<iframe id="app" title="App" allow="camera; microphone; geolocation; clipboard-read; clipboard-write; web-share; screen-wake-lock; fullscreen; autoplay"></iframe>
<script>
(function () {
  'use strict';
  window.__ghdRahmen = true;
  var START = new URL('index.html', location.href).href;
  var ziel = START;
  try {
    var roh = decodeURIComponent(location.hash.slice(1));
    var u = new URL(roh, location.href);
    if (u.origin === location.origin) ziel = u.href; // nur eigene Apps
  } catch (e) { ziel = START; }
  var f = document.getElementById('app');
  f.src = ziel;
  // Titel der App übernehmen (für die App-Übersicht des Handys)
  f.addEventListener('load', function () {
    try { if (f.contentDocument && f.contentDocument.title) document.title = f.contentDocument.title; } catch (e) { /* andere Adresse */ }
  });
})();
</script>
</body>
</html>

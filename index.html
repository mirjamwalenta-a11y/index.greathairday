<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A Great Hair Day">
<title>A Great Hair Day · Mirjam Walenta</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--navy:#1B2A3B;--copper:#B5622A;--slate:#F0F2F5;--white:#fff;--muted:#6B7684;--border:#D6DAE0;--error:#C0392B;}
  body{font-family:system-ui,-apple-system,sans-serif;background:var(--navy);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
  #loginScreen{width:100%;max-width:340px;text-align:center}
  .logo-dot{width:14px;height:14px;border-radius:50%;background:var(--copper);margin:0 auto 20px}
  .logo-name{color:#fff;font-size:22px;font-weight:800;margin-bottom:4px}
  .logo-sub{color:rgba(255,255,255,0.45);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:40px}
  .pin-label{color:rgba(255,255,255,0.6);font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:16px}
  .pin-dots{display:flex;gap:16px;justify-content:center;margin-bottom:32px}
  .pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,0.3);background:transparent;transition:all 0.15s}
  .pin-dot.filled{background:#fff;border-color:#fff}
  .pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:240px;margin:0 auto 20px}
  .pin-btn{aspect-ratio:1;border-radius:50%;border:none;background:rgba(255,255,255,0.1);color:#fff;font-size:22px;font-weight:600;cursor:pointer;transition:background 0.15s;font-family:inherit}
  .pin-btn:active{background:rgba(255,255,255,0.25)}
  .pin-btn.empty{background:transparent;cursor:default;pointer-events:none}
  .pin-error{color:#F4A49A;font-size:13px;min-height:20px;margin-bottom:8px}
  #appScreen{display:none;width:100%;max-width:420px}
  .app-header{text-align:center;margin-bottom:28px}
  .app-dot{width:10px;height:10px;border-radius:50%;background:var(--copper);margin:0 auto 12px}
  .app-name{color:#fff;font-size:20px;font-weight:800;margin-bottom:2px}
  .app-sub{color:rgba(255,255,255,0.4);font-size:11px;letter-spacing:0.08em;text-transform:uppercase}
  .app-greeting{color:rgba(255,255,255,0.7);font-size:13px;margin-top:8px}
  .apps-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
  .app-card{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:18px 16px;cursor:pointer;text-decoration:none;display:block;transition:all 0.15s;-webkit-tap-highlight-color:transparent}
  .app-card:active{background:rgba(255,255,255,0.14);transform:scale(0.97)}
  .app-card-icon{font-size:28px;margin-bottom:10px}
  .app-card-name{color:#fff;font-size:14px;font-weight:700;margin-bottom:3px}
  .app-card-desc{color:rgba(255,255,255,0.45);font-size:11px;line-height:1.4}
  .app-card.special{background:rgba(181,98,42,0.15);border-color:rgba(181,98,42,0.3)}
  .logout-btn{display:block;width:100%;padding:12px;background:none;border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:rgba(255,255,255,0.5);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  .logout-btn:active{background:rgba(255,255,255,0.05)}
  .team-login{margin-top:16px}
  .team-btn{display:block;width:100%;padding:12px;background:none;border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:rgba(255,255,255,0.4);font-size:13px;cursor:pointer;font-family:inherit}
  #teamLoginScreen{display:none;width:100%;max-width:340px}
  .back-link{color:rgba(255,255,255,0.4);font-size:12px;cursor:pointer;margin-bottom:24px;display:inline-block}
  .inp{width:100%;padding:12px 14px;border:none;border-radius:10px;font-size:15px;font-family:inherit;background:rgba(255,255,255,0.1);color:#fff;outline:none;margin-bottom:10px}
  .inp::placeholder{color:rgba(255,255,255,0.35)}
  .login-btn{width:100%;padding:14px;border:none;border-radius:10px;background:#fff;color:var(--navy);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:4px}
  .inp-err{color:#F4A49A;font-size:12px;text-align:center;min-height:18px;margin-bottom:8px}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="logo-dot"></div>
  <div class="logo-name">Mirjam Walenta</div>
  <div class="logo-sub">A great hair day</div>
  <div class="pin-label">PIN eingeben</div>
  <div class="pin-dots">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>
  <div class="pin-error" id="pinError"></div>
  <div class="pin-grid">
    <button class="pin-btn" onclick="pinTap('1')">1</button>
    <button class="pin-btn" onclick="pinTap('2')">2</button>
    <button class="pin-btn" onclick="pinTap('3')">3</button>
    <button class="pin-btn" onclick="pinTap('4')">4</button>
    <button class="pin-btn" onclick="pinTap('5')">5</button>
    <button class="pin-btn" onclick="pinTap('6')">6</button>
    <button class="pin-btn" onclick="pinTap('7')">7</button>
    <button class="pin-btn" onclick="pinTap('8')">8</button>
    <button class="pin-btn" onclick="pinTap('9')">9</button>
    <button class="pin-btn empty"></button>
    <button class="pin-btn" onclick="pinTap('0')">0</button>
    <button class="pin-btn" onclick="pinDel()">⌫</button>
  </div>
  <div class="team-login">
    <button class="team-btn" onclick="showTeamLogin()">Team-Login →</button>
  </div>
</div>

<div id="teamLoginScreen">
  <button class="back-link" onclick="showPinLogin()">← Zurück</button>
  <div class="logo-dot"></div>
  <div class="logo-name" style="color:#fff;margin-bottom:4px">Team-Login</div>
  <div class="logo-sub" style="margin-bottom:32px">A great hair day</div>
  <input class="inp" id="teamKennung" placeholder="Kennung (z. B. anna)" autocapitalize="none" autocorrect="off">
  <input class="inp" id="teamPin" type="password" placeholder="PIN (4 Ziffern)" maxlength="4" inputmode="numeric">
  <div class="inp-err" id="teamErr"></div>
  <button class="login-btn" onclick="doTeamLogin()">Anmelden</button>
</div>

<div id="appScreen">
  <div class="app-header">
    <div class="app-dot"></div>
    <div class="app-name">A Great Hair Day</div>
    <div class="app-sub">Mirjam Walenta · Wien</div>
    <div class="app-greeting" id="appGreeting"></div>
  </div>
  <div class="apps-grid" id="appsGrid"></div>
  <button class="logout-btn" onclick="doLogout()">Abmelden</button>
</div>

<script>
const MIRJAM_PIN = '3101';
const B = 'https://mirjamwalenta-a11y.github.io';

// Korrekte URLs aus den Repository-Namen
const ALLE_APPS = [
  {
    icon:'✅', name:'Checklisten', desc:'Tagesaufgaben & Bereiche',
    url:`${B}/salon-checklist/salon-checklist.html`,
    rollen:['chefin','mitarbeiterin','ausbildnerin','lager']
  },
  {
    icon:'📅', name:'Abwesenheit', desc:'Urlaub & Krankenstand',
    url:`${B}/abwesenheiten-ghd/abwesenheiten.html`,
    rollen:['chefin','mitarbeiterin','ausbildnerin','lager']
  },
  {
    icon:'💬', name:'Team', desc:'Mitteilungen & Besprechungen',
    url:`${B}/Team/team.html`,
    rollen:['chefin','mitarbeiterin','ausbildnerin','lager']
  },
  {
    icon:'✂️', name:'Lernquiz', desc:'Quiz & Prüfungsvorbereitung',
    url:`${B}/lernquiz.greathairday/lernquiz.html`,
    rollen:['chefin','ausbildnerin','lehrling']
  },
  {
    icon:'📖', name:'Lerntool', desc:'Lernkarten & Themen',
    url:`${B}/lerntool.index.html/lerntool.html`,
    rollen:['chefin','ausbildnerin','lehrling']
  },
  {
    icon:'📦', name:'Lager', desc:'Bestand & Bestellungen',
    url:`${B}/lager.greathairday/index.html`,
    rollen:['chefin','lager']
  },
  {
    icon:'📒', name:'Mitarbeiterhandbuch', desc:'Richtlinien & Standards',
    url:`${B}/Mitarbeiterhandbuch/Mitarbeiterhandbuch_App.html`,
    rollen:['chefin','mitarbeiterin','ausbildnerin','lager'],
  },
  {
    icon:'🧾', name:'Belege', desc:'Rechnungen & Steuerberater',
    url:`${B}/belege.greathairday/belege.html`,
    rollen:['chefin'], special:true
  },
  {
    icon:'🏫', name:'Innung', desc:'Seminare & Trainer:innen',
    url:`${B}/innungsapp.greathairday/innungsapp.html`,
    rollen:['chefin'], special:true
  }
];

const SUPA_URL='https://wrxlaltgtgkdomklgrlj.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndyeGxhbHRndGdrZG9ta2xncmxqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNDYwMzYsImV4cCI6MjA5OTgyMjAzNn0.Bw8ch-EJb_cLYTwxHdpjUJWgoCjje3Jc32pB0yiBS8g';

let pinBuffer='';
let currentSession=null;

function md5(str){
  function L(q,a,b,x,s,t){let n=(q&0xFFFF)+(a&0xFFFF),m=(q>>16)+(a>>16)+(n>>16);return((m<<16)|(n&0xFFFF))&0xFFFFFFFF}
  function R(n,c){return(n<<c)|(n>>>32-c)}
  function C(q,a,b,x,s,t){return L(R(L(L(a,q),L(x,t)),s),b)}
  function F(a,b,c,d,x,s,t){return C((b&c)|(~b&d),a,b,x,s,t)}
  function G(a,b,c,d,x,s,t){return C((b&d)|(c&~d),a,b,x,s,t)}
  function H(a,b,c,d,x,s,t){return C(b^c^d,a,b,x,s,t)}
  function I(a,b,c,d,x,s,t){return C(c^(b|~d),a,b,x,s,t)}
  str=unescape(encodeURIComponent(str));
  let n=str.length,s=[],i;
  for(i=0;i<n;i++){s[i>>2]|=(str.charCodeAt(i)&0xFF)<<((i%4)*8)}
  s[n>>2]|=0x80<<((n%4)*8);s[(((n+8)>>6)<<4)+14]=n*8;
  let a=1732584193,b=-271733879,c=-1732584194,d=271733878;
  for(i=0;i<s.length;i+=16){
    let A=a,B2=b,C2=c,D=d;
    a=F(a,b,c,d,s[i+0],7,-680876936);d=F(d,a,b,c,s[i+1],12,-389564586);c=F(c,d,a,b,s[i+2],17,606105819);b=F(b,c,d,a,s[i+3],22,-1044525330);
    a=F(a,b,c,d,s[i+4],7,-176418897);d=F(d,a,b,c,s[i+5],12,1200080426);c=F(c,d,a,b,s[i+6],17,-1473231341);b=F(b,c,d,a,s[i+7],22,-45705983);
    a=F(a,b,c,d,s[i+8],7,1770035416);d=F(d,a,b,c,s[i+9],12,-1958414417);c=F(c,d,a,b,s[i+10],17,-42063);b=F(b,c,d,a,s[i+11],22,-1990404162);
    a=F(a,b,c,d,s[i+12],7,1804603682);d=F(d,a,b,c,s[i+13],12,-40341101);c=F(c,d,a,b,s[i+14],17,-1502002290);b=F(b,c,d,a,s[i+15],22,1236535329);
    a=G(a,b,c,d,s[i+1],5,-165796510);d=G(d,a,b,c,s[i+6],9,-1069501632);c=G(c,d,a,b,s[i+11],14,643717713);b=G(b,c,d,a,s[i+0],20,-373897302);
    a=G(a,b,c,d,s[i+5],5,-701558691);d=G(d,a,b,c,s[i+10],9,38016083);c=G(c,d,a,b,s[i+15],14,-660478335);b=G(b,c,d,a,s[i+4],20,-405537848);
    a=G(a,b,c,d,s[i+9],5,568446438);d=G(d,a,b,c,s[i+14],9,-1019803690);c=G(c,d,a,b,s[i+3],14,-187363961);b=G(b,c,d,a,s[i+8],20,1163531501);
    a=G(a,b,c,d,s[i+13],5,-1444681467);d=G(d,a,b,c,s[i+2],9,-51403784);c=G(c,d,a,b,s[i+7],14,1735328473);b=G(b,c,d,a,s[i+12],20,-1926607734);
    a=H(a,b,c,d,s[i+5],4,-378558);d=H(d,a,b,c,s[i+8],11,-2022574463);c=H(c,d,a,b,s[i+11],16,1839030562);b=H(b,c,d,a,s[i+14],23,-35309556);
    a=H(a,b,c,d,s[i+1],4,-1530992060);d=H(d,a,b,c,s[i+4],11,1272893353);c=H(c,d,a,b,s[i+7],16,-155497632);b=H(b,c,d,a,s[i+10],23,-1094730640);
    a=H(a,b,c,d,s[i+13],4,681279174);d=H(d,a,b,c,s[i+0],11,-358537222);c=H(c,d,a,b,s[i+3],16,-722521979);b=H(b,c,d,a,s[i+6],23,76029189);
    a=H(a,b,c,d,s[i+9],4,-640364487);d=H(d,a,b,c,s[i+12],11,-421815835);c=H(c,d,a,b,s[i+15],16,530742520);b=H(b,c,d,a,s[i+2],23,-995338651);
    a=I(a,b,c,d,s[i+0],6,-198630844);d=I(d,a,b,c,s[i+7],10,1126891415);c=I(c,d,a,b,s[i+14],15,-1416354905);b=I(b,c,d,a,s[i+5],21,-57434055);
    a=I(a,b,c,d,s[i+12],6,1700485571);d=I(d,a,b,c,s[i+3],10,-1894986606);c=I(c,d,a,b,s[i+10],15,-1051523);b=I(b,c,d,a,s[i+1],21,-2054922799);
    a=I(a,b,c,d,s[i+8],6,1873313359);d=I(d,a,b,c,s[i+15],10,-30611744);c=I(c,d,a,b,s[i+6],15,-1560198380);b=I(b,c,d,a,s[i+13],21,1309151649);
    a=I(a,b,c,d,s[i+4],6,-145523070);d=I(d,a,b,c,s[i+11],10,-1120210379);c=I(c,d,a,b,s[i+2],15,718787259);b=I(b,c,d,a,s[i+9],21,-343485551);
    a=L(a,A);b=L(b,B2);c=L(c,C2);d=L(d,D);
  }
  return [a,b,c,d].map(v=>{let h='';for(let j=0;j<4;j++)h+=('0'+((v>>(j*8))&0xFF).toString(16)).slice(-2);return h;}).join('');
}

window.addEventListener('DOMContentLoaded',()=>{
  const saved=localStorage.getItem('ghd_session');
  if(saved){try{currentSession=JSON.parse(saved);showApp();return;}catch(e){localStorage.removeItem('ghd_session');}}
  document.getElementById('loginScreen').style.display='block';
  document.getElementById('teamPin').addEventListener('keydown',e=>{if(e.key==='Enter')doTeamLogin();});
});

function pinTap(d){
  if(pinBuffer.length>=4)return;
  pinBuffer+=d;
  updatePinDots();
  if(pinBuffer.length===4)setTimeout(()=>checkPin(),150);
}
function pinDel(){
  pinBuffer=pinBuffer.slice(0,-1);
  updatePinDots();
  document.getElementById('pinError').textContent='';
}
function updatePinDots(){
  for(let i=0;i<4;i++)document.getElementById('d'+i).className='pin-dot'+(i<pinBuffer.length?' filled':'');
}
function checkPin(){
  if(pinBuffer===MIRJAM_PIN){
    currentSession={name:'Mirjam',rolle:'chefin'};
    localStorage.setItem('ghd_session',JSON.stringify(currentSession));
    showApp();
  }else{
    document.getElementById('pinError').textContent='PIN nicht korrekt.';
    pinBuffer='';updatePinDots();
  }
}

function showTeamLogin(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('teamLoginScreen').style.display='block';
}
function showPinLogin(){
  document.getElementById('teamLoginScreen').style.display='none';
  document.getElementById('loginScreen').style.display='block';
  pinBuffer='';updatePinDots();
}

async function doTeamLogin(){
  const kennung=document.getElementById('teamKennung').value.trim().toLowerCase();
  const pin=document.getElementById('teamPin').value;
  document.getElementById('teamErr').textContent='';
  if(!kennung||!pin){document.getElementById('teamErr').textContent='Bitte alle Felder ausfüllen.';return;}
  try{
    const rows=await fetch(`${SUPA_URL}/rest/v1/salon_personen?kennung=eq.${encodeURIComponent(kennung)}&pin_hash=eq.${encodeURIComponent(md5(pin))}&aktiv=eq.true`,
      {headers:{'apikey':SUPA_KEY,'Authorization':`Bearer ${SUPA_KEY}`}}).then(r=>r.json());
    if(!rows.length){document.getElementById('teamErr').textContent='Kennung oder PIN ungültig.';return;}
    const p=rows[0];
    currentSession={name:p.name,rolle:p.rolle,id:p.id};
    localStorage.setItem('ghd_session',JSON.stringify(currentSession));
    showApp();
  }catch(e){document.getElementById('teamErr').textContent='Verbindungsfehler.';}
}

function showApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('teamLoginScreen').style.display='none';
  document.getElementById('appScreen').style.display='block';
  const h=new Date().getHours();
  const gruss=h<12?'Guten Morgen':h<17?'Guten Tag':'Guten Abend';
  document.getElementById('appGreeting').textContent=`${gruss}, ${currentSession.name}!`;
  const grid=document.getElementById('appsGrid');
  const sichtbar=ALLE_APPS.filter(a=>a.rollen.includes(currentSession.rolle));
  grid.innerHTML=sichtbar.map(a=>`
    <a href="${a.url}" class="app-card${a.special?' special':''}">
      <div class="app-card-icon">${a.icon}</div>
      <div class="app-card-name">${a.name}</div>
      <div class="app-card-desc">${a.desc}</div>
    </a>`).join('');
}

function doLogout(){
  currentSession=null;
  localStorage.removeItem('ghd_session');
  pinBuffer='';updatePinDots();
  document.getElementById('appScreen').style.display='none';
  document.getElementById('loginScreen').style.display='block';
  document.getElementById('pinError').textContent='';
}
</script>
</body>
</html>

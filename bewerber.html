<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salon Matcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!--
    SALON MATCHER – PROTOTYP, speichert und versendet nichts.

    Kultureller Passungsfilter mit 8 Alltagssituationen à 4 Antworten.
    Jede Antwort ist intern einem oder zwei Pflichtfeldern zugeordnet
    (grün / gelb / rot). Keine Durchschnittsbildung: ein rotes Signal in
    einem Feld macht das Feld rot, ein rotes Feld macht das Gesamtergebnis rot.
    Bewerber:innen sehen ihre Bewertung nie – alle bekommen dieselbe
    Abschlussseite, damit sich der Test nicht durch Wiederholen „lernen“ lässt.

    Beim späteren Anbinden an Supabase gelten die Regeln aus CLAUDE.md:
    eigene Tabelle mit RLS + explizite GRANTs, Abschicken nur über eine
    SECURITY DEFINER-Funktion (anon darf nichts lesen), Bewertung serverseitig
    berechnen, interne Sicht nur für die Chefin in der Schaltzentrale.
    Entscheidung: Grün = einladen · Gelb = Prüfzone, Gespräch nur bei sonst
    starkem Gesamteindruck oder fachlich besonderem Interesse, gelbe Stellen
    gezielt prüfen · Rot = keine Einladung, keine Ausnahme aus Sympathie,
    Mitleid oder Lebenslauf.
    Die Farbzuordnung darf dann NICHT mehr im öffentlichen Quelltext stehen.
  -->
  <style>
    :root {
      --bg:          #F8F4EA;
      --card:        #FFFFFF;
      --border:      #E4DBC5;
      --text:        #211D17;
      --text-soft:   #6F6858;
      --accent:      #896C32;
      --accent-dark: #6E5527;
      --accent-tint: #EEE6CD;
      --g:           #3F7A52;
      --g-tint:      #DDEBDF;
      --y:           #A67A22;
      --y-tint:      #F3E6C4;
      --r:           #B23A2E;
      --r-tint:      #F5DAD5;
      --radius:      14px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:#1B1813; --card:#25211A; --border:#3B3428; --text:#F1EADB; --text-soft:#B5AC99;
        --accent:#C9A55C; --accent-dark:#E0C07E; --accent-tint:#3A3020;
        --g:#7DBB8F; --g-tint:#23362A; --y:#D9AE55; --y-tint:#3A3020; --r:#E07A6E; --r-tint:#3D2420;
      }
    }
    :root[data-theme="dark"] {
      --bg:#1B1813; --card:#25211A; --border:#3B3428; --text:#F1EADB; --text-soft:#B5AC99;
      --accent:#C9A55C; --accent-dark:#E0C07E; --accent-tint:#3A3020;
      --g:#7DBB8F; --g-tint:#23362A; --y:#D9AE55; --y-tint:#3A3020; --r:#E07A6E; --r-tint:#3D2420;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:'Poppins', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background:var(--bg); color:var(--text);
      min-height:100vh; padding:16px;
      -webkit-font-smoothing:antialiased;
    }
    .wrap { max-width:600px; margin:0 auto; }
    .proto {
      background:var(--accent-tint); color:var(--accent-dark);
      font-size:12px; font-weight:600; text-align:center;
      padding:8px 12px; border-radius:10px; margin-bottom:16px;
    }
    .card {
      background:var(--card); border:1.5px solid var(--border);
      border-radius:var(--radius); padding:28px 22px;
      box-shadow:0 8px 32px rgba(137,108,50,0.08);
    }
    .brand { font-size:11px; letter-spacing:.12em; color:var(--text-soft); text-transform:uppercase; }
    h1 { font-size:23px; font-weight:700; margin:8px 0 14px; line-height:1.3; }
    h2 { font-size:18px; font-weight:600; line-height:1.5; }
    h3 { font-size:15px; font-weight:700; margin:24px 0 8px; }
    p  { font-size:14.5px; line-height:1.65; color:var(--text-soft); }
    p + p { margin-top:10px; }
    .muted { font-size:12.5px; color:var(--text-soft); }

    .bar { height:5px; background:var(--accent-tint); border-radius:3px; overflow:hidden; margin-bottom:18px; }
    .bar > div { height:100%; background:var(--accent); transition:width .3s; }
    .step { font-size:11px; letter-spacing:.1em; color:var(--text-soft); text-transform:uppercase; margin-bottom:10px; }

    .options { display:flex; flex-direction:column; gap:10px; margin-top:20px; }
    .opt {
      background:var(--bg); border:1.5px solid var(--border); border-radius:10px;
      padding:14px 16px; text-align:left; font:inherit; font-size:14.5px; line-height:1.5; color:var(--text);
      cursor:pointer; transition:border-color .15s;
    }
    .opt:hover, .opt:focus-visible { border-color:var(--accent); outline:none; }

    .btn {
      display:block; width:100%; margin-top:20px; padding:14px;
      background:var(--accent); color:#fff; border:none; border-radius:10px;
      font:inherit; font-size:15px; font-weight:600; cursor:pointer;
    }
    .btn:hover { background:var(--accent-dark); }
    .btn.ghost { background:none; color:var(--accent-dark); border:1.5px solid var(--border); }
    .link { background:none; border:none; color:var(--text-soft); font:inherit; font-size:13px; cursor:pointer; margin-top:16px; text-decoration:underline; }

    label.f { display:block; font-size:12px; font-weight:600; color:var(--text-soft); margin:14px 0 6px; }
    input[type=text], input[type=tel], select {
      width:100%; padding:12px; border:1.5px solid var(--border); border-radius:10px;
      font:inherit; font-size:15px; background:var(--bg); color:var(--text);
    }
    .consent { display:flex; gap:10px; align-items:flex-start; margin-top:16px; font-size:13px; line-height:1.5; color:var(--text-soft); }
    .consent input { margin-top:3px; width:18px; height:18px; accent-color:var(--accent); flex-shrink:0; }
    .msg { margin-top:14px; padding:12px; border-radius:10px; background:var(--accent-tint); color:var(--accent-dark); font-size:13.5px; }

    /* interne Sicht */
    .verdict { border-radius:12px; padding:16px; margin:14px 0 6px; }
    .verdict b { display:block; font-size:17px; margin-bottom:4px; }
    .verdict p { color:inherit; font-size:13.5px; }
    .v-g { background:var(--g-tint); color:var(--g); }
    .v-y { background:var(--y-tint); color:var(--y); }
    .v-r { background:var(--r-tint); color:var(--r); }
    .field { border:1.5px solid var(--border); border-radius:12px; padding:14px; margin-top:12px; }
    .field-head { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .field-head span:first-child { font-weight:600; font-size:14.5px; }
    .pill { font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:20px; white-space:nowrap; }
    .p-g { background:var(--g-tint); color:var(--g); }
    .p-y { background:var(--y-tint); color:var(--y); }
    .p-r { background:var(--r-tint); color:var(--r); }
    .sig { margin-top:10px; padding-left:10px; border-left:3px solid; font-size:13px; line-height:1.55; }
    .sig.r { border-color:var(--r); }
    .sig.y { border-color:var(--y); }
    .sig .sit { color:var(--text-soft); }
    .sig .ans { color:var(--text); margin:2px 0; }
    .sig .why { color:var(--text-soft); font-style:italic; }
    .ask { margin-top:10px; font-size:13px; color:var(--text); }
    .ask b { color:var(--text-soft); font-weight:600; }

    /* Fragenkatalog */
    .kat-sit { margin-top:22px; padding-top:18px; border-top:1px solid var(--border); }
    .kat-sit:first-of-type { border-top:none; padding-top:0; }
    .kat-meta { font-size:11.5px; color:var(--text-soft); letter-spacing:.05em; text-transform:uppercase; margin-bottom:6px; }
    .kat-q { font-size:14.5px; font-weight:600; line-height:1.5; margin-bottom:10px; }
    .kat-a { display:flex; gap:10px; align-items:flex-start; font-size:13.5px; line-height:1.5; margin-top:8px; }
    .kat-a .tags { display:flex; flex-direction:column; gap:3px; flex-shrink:0; width:86px; }
    .kat-a .pill { font-size:10.5px; padding:2px 7px; text-align:center; }
    .kat-a .why { display:block; font-size:12.5px; color:var(--text-soft); font-style:italic; margin-top:2px; }
    .rules { font-size:13.5px; line-height:1.65; margin:8px 0 0 18px; }
    .rules li + li { margin-top:6px; }
    .hidden { display:none; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="proto">Prototyp – es wird nichts gespeichert oder versendet</div>
  <div class="card" id="app"></div>
</div>

<script>
  // ── Pflichtfelder ──────────────────────────────────────────────────────
  const FELDER = {
    Z: { name: 'Zuwendung statt Selbstdarstellung',
         gespraech: 'Erzähl von einem Kundengespräch, bei dem du erst spät verstanden hast, was die Person eigentlich wollte. Woran hast du es gemerkt?' },
    O: { name: 'Offenheit statt vorschneller Ablehnung',
         gespraech: 'Was hast du zuletzt bei der Arbeit anders gemacht als gewohnt – und wie lange hast du es ausprobiert, bevor du dir eine Meinung gebildet hast?' },
    R: { name: 'Respekt im Alltag',
         gespraech: 'Wann hast du dich zuletzt bei jemandem im Team oder bei einer Kundin entschuldigt – und wofür?' },
    W: { name: 'Wertschätzung für Menschen',
         gespraech: 'Wie gehst du mit Kundinnen oder Kunden um, mit denen die Verständigung schwierig ist? Wie reagierst du, wenn im Team über jemanden gelästert wird?' }
  };

  // ── 8 Situationen ──────────────────────────────────────────────────────
  // b: Bewertung je Pflichtfeld – g = grün, y = gelb, r = rot
  // w: interne Begründung (nur in der Chefin-Sicht)
  const SITUATIONEN = [
    { art: 'Kundin', q: 'Eine neue Kundin sitzt zur Beratung bei dir. Sie erzählt ziemlich ausführlich, was sie bei ihrem letzten Friseur gestört hat. Du hast nach zwei Sätzen schon ein Bild im Kopf, was ihr stehen würde.', a: [
      { t: 'Ich lasse sie ausreden und frage nach, was genau sie gestört hat, bevor ich etwas vorschlage.',
        b: { Z: 'g' } },
      { t: 'Ich sage ihr, dass ich schon eine klare Idee habe, und zeige ihr ein paar meiner Arbeiten auf dem Handy. Das gibt ihr Sicherheit.',
        b: { Z: 'r' }, w: 'Unterbricht und rückt die eigene Arbeit in den Mittelpunkt, bevor die Kundin verstanden ist.' },
      { t: 'Ich höre zu, sage aber wenig. Sie soll sich nicht gedrängt fühlen – wenn sie fertig ist, lege ich los.',
        b: { Z: 'y' }, w: 'Hört zu, fragt aber nicht nach – Interesse bleibt passiv.' },
      { t: 'Ich erkläre ihr kurz, wie ich normalerweise arbeite, damit sie gleich weiß, was sie bei mir erwartet.',
        b: { Z: 'y' }, w: 'Freundlich, aber stark auf die eigene Rolle statt auf die Kundin gerichtet.' }
    ]},
    { art: 'Team', q: 'In der Teambesprechung erzählt eine neue Kollegin, wie in ihrem alten Salon die Farbberatung abgelaufen ist. Bei euch läuft das seit Jahren anders – und gut.', a: [
      { t: 'Ich frage sie, was dort besser funktioniert hat und wo es gehakt hat.',
        b: { Z: 'g', O: 'g' } },
      { t: 'Ich warte, bis sie fertig ist, und erzähle dann von einem ähnlichen Fall bei mir, der gut ausgegangen ist.',
        b: { Z: 'r', O: 'y' }, w: 'Nimmt das Thema der Kollegin als Anlass für die eigene Geschichte.' },
      { t: 'Ich höre zu und denke mir meinen Teil. Wenn sie länger da ist, sieht sie ja, wie es bei uns läuft.',
        b: { Z: 'y', O: 'r' }, w: 'Hat das Neue innerlich schon abgelehnt, ohne es zu prüfen.' },
      { t: 'Ich finde es interessant, würde es aber erst ausprobieren, wenn die Chefin sagt, dass wir es ändern.',
        b: { Z: 'g', O: 'y' }, w: 'Offen, braucht aber Absicherung von oben, bevor etwas ausprobiert wird.' }
    ]},
    { art: 'Neuer Ablauf', q: 'Ab nächstem Monat kommen Rezepturen und Kundennotizen nicht mehr auf die Karteikarte, sondern ins Tablet. Die ersten Tage dauert dadurch alles etwas länger.', a: [
      { t: 'Am Anfang nervt mich das sicher. Aber ich geb dem ein paar Wochen, dann weiß ich, ob es was taugt.',
        b: { O: 'g' }, w: 'Gibt dem Neuen eine echte Chance und urteilt erst danach.' },
      { t: 'Ich trag es ein, wie es verlangt wird. Was ich davon halte, spielt ja eigentlich keine große Rolle.',
        b: { O: 'y' }, w: 'Macht mit, setzt sich aber nicht damit auseinander.' },
      { t: 'Das hatten wir in meinem alten Salon auch. Nach drei Monaten haben wieder alle auf Papier geschrieben – ich würde uns die Umstellung sparen.',
        b: { O: 'r' }, w: 'Urteilt aus alter Erfahrung, bevor es hier ausprobiert ist.' },
      { t: 'Ich trag alles ins Tablet ein, schreib die Rezepturen aber zusätzlich auf die Karte. Wenn das Ding einmal abstürzt, ist sonst alles weg.',
        b: { O: 'y' }, w: 'Probiert, traut dem Neuen aber nicht und sichert doppelt ab.' }
    ]},
    { art: 'Alltag', q: 'Du stehst im Stau. Deine erste Kundin kommt um 8:30, du wirst etwa zehn Minuten zu spät sein. Es ist 8:15.', a: [
      { t: 'Ich rufe im Salon an, damit jemand die Kundin empfängt, und entschuldige mich bei ihr, wenn ich da bin.',
        b: { R: 'g' } },
      { t: 'Ich schreibe kurz in die Team-Gruppe und lege gleich los, wenn ich da bin. Die zehn Minuten hole ich beim Föhnen wieder rein.',
        b: { R: 'r' }, w: 'Behandelt die Verspätung als Zeitproblem, nicht als Frage des Respekts – keine Entschuldigung.' },
      { t: 'Ich sage im Salon Bescheid. Ob ich mich bei der Kundin extra entschuldige, hängt davon ab, wie sie drauf ist.',
        b: { R: 'y' }, w: 'Entschuldigung ist situationsabhängig statt selbstverständlich.' },
      { t: 'Ich melde mich nicht extra – bis jemand die Nachricht liest, bin ich sowieso schon da. Vor Ort sage ich dann allen Bescheid.',
        b: { R: 'y' }, w: 'Pragmatisch, lässt aber Team und Kundin im Unklaren.' }
    ]},
    { art: 'Team', q: 'Samstag, voller Salon. Eine Kollegin sagt dir im Vorbeigehen ziemlich scharf, du sollst deinen Platz endlich aufräumen – vor deiner Kundin.', a: [
      { t: 'Ich räume auf und spreche sie später unter vier Augen darauf an, dass mich der Ton gestört hat.',
        b: { R: 'g' } },
      { t: 'Ich sage ihr gleich, dass ich das vor der Kundin nicht okay finde. Lieber sofort klar als später herumdrucksen.',
        b: { R: 'y' }, w: 'Berechtigter Punkt, aber im Moment und vor der Kundin – Stress wird weitergegeben.' },
      { t: 'Ich räume auf und sage nichts. Samstags ist jeder mal kurz angebunden, das nehme ich nicht persönlich.',
        b: { R: 'y' }, w: 'Hält Schroffheit unter Stress für normal.' },
      { t: 'Ich räume auf und erzähle es später den anderen, damit sie wissen, wie sie manchmal ist.',
        b: { R: 'r', W: 'y' }, w: 'Klärt nicht direkt, sondern redet hinter dem Rücken über die Kollegin.' }
    ]},
    { art: 'Kunde', q: 'Ein Kunde spricht kaum Deutsch. Er zeigt dir ein Foto auf dem Handy, ihr versteht euch nur mühsam. Die Kollegin am Nebenplatz sagt halblaut: „Viel Spaß, das wird eh nix.“', a: [
      { t: 'Ich zeig ihm am Foto und an seinen Haaren, wie kurz – Stück für Stück, zwischendurch mit dem Spiegel. Wenn ich unsicher bin, hol ich kurz jemanden dazu.',
        b: { W: 'g', Z: 'g' }, w: 'Bleibt beim Kunden, findet einfache Wege, holt Hilfe statt aufzugeben.' },
      { t: 'Ich schneid nach dem Foto, so gut es geht. Ganz genau wird es bei der Verständigung eh nicht, da muss man realistisch sein.',
        b: { W: 'r', Z: 'y' }, w: 'Gibt wegen der Sprache früh auf – der Kunde bekommt weniger als andere.' },
      { t: 'Ich frag die Kollegin vorne, ob sie ihn übernimmt. Sie hat bei so was mehr Routine, dann geht es für alle schneller.',
        b: { W: 'y', Z: 'y' }, w: 'Gibt den Kunden ab, weil es bequemer ist – „bei so was“.' },
      { t: 'Auf den Spruch geh ich nicht ein, auch später nicht. Sie meint es nicht so, und das bringt nur Stimmung ins Team.',
        b: { W: 'y' }, w: 'Lässt die Abwertung stehen, um Ruhe zu haben.' }
    ]},
    { art: 'Lernen', q: 'Die Chefin sieht dir beim Föhnen zu und sagt: „Sauber – aber nimm die größere Rundbürste und arbeite von unten, dann hält es länger.“ Du hast es anders gelernt, und bisher hat es immer gut ausgesehen.', a: [
      { t: 'Ich mache es ab jetzt so, wie sie sagt. Sie ist die Chefin.',
        b: { O: 'y' }, w: 'Ordnet sich unter, ohne selbst zu prüfen – Offenheit oder nur Anpassung? Im Gespräch klären.' },
      { t: 'Okay, ich probier es bei den nächsten Kundinnen so und schau, ob es wirklich länger hält.',
        b: { O: 'g' }, w: 'Probiert die Korrektur praktisch aus und prüft selbst nach – offen, aber nicht unterwürfig.' },
      { t: 'Ich nicke und mache weiter wie bisher. Solange das Ergebnis passt, gibt es keinen Grund, etwas zu ändern.',
        b: { O: 'r', R: 'y' }, w: 'Lehnt die Korrektur ab, ohne sie auszuprobieren – und sagt es nicht offen.' },
      { t: 'Ich frage, was ihr an meiner Art fehlt, und lasse es mir einmal zeigen.',
        b: { O: 'g', Z: 'g' }, w: 'Will verstehen, worum es geht, statt sich zu verteidigen.' }
    ]},
    { art: 'Kundin', q: 'Eine Stammkundin hat sich die Haare selbst gefärbt, es ist fleckig geworden. Noch an der Garderobe fragt sie: „Sag ehrlich, schaut das schlimm aus?“', a: [
      { t: '„Ja, das ist ziemlich fleckig geworden. Kriegen wir aber hin – setz dich, ich schau mir das an.“',
        b: { W: 'g' }, w: 'Ehrlich und gleich bei der Lösung.' },
      { t: '„Ehrlich gesagt schon. Ich sag es dir lieber gleich direkt – sonst probierst du es beim nächsten Mal wieder selber.“',
        b: { W: 'r' }, w: 'Ehrlichkeit als Erziehungsmaßnahme – die Würde der Kundin wird zweitrangig.' },
      { t: '„Komm erst mal rein. Was hast du denn genommen?“ Was ich davon halte, sag ich ihr, wenn ich es bei Licht gesehen hab.',
        b: { W: 'g', Z: 'g' }, w: 'Fängt sie auf und will erst verstehen, bevor bewertet wird.' },
      { t: '„Mach dir nichts draus – letzte Woche war eine da, bei der war es noch viel ärger.“',
        b: { W: 'y', Z: 'y' }, w: 'Beruhigt mit einer anderen Kundin, statt bei ihr zu bleiben.' }
    ]}
  ];

  // ── Bewertung: keine Durchschnitte ─────────────────────────────────────
  // Feld rot  = mindestens ein rotes Signal im Feld
  // Feld gelb = kein rotes, aber mindestens ein gelbes Signal
  // Feld grün = nur grüne Signale
  // Gesamt    = schlechtestes Feld
  const RANG = { g: 0, y: 1, r: 2 };
  function auswerten(antworten) {
    const felder = {};
    for (const k of Object.keys(FELDER)) felder[k] = { farbe: 'g', signale: [] };
    antworten.forEach(({ s, a }) => {
      const opt = SITUATIONEN[s].a[a];
      for (const [k, farbe] of Object.entries(opt.b)) {
        felder[k].signale.push({ s, a, farbe });
        if (RANG[farbe] > RANG[felder[k].farbe]) felder[k].farbe = farbe;
      }
    });
    const gesamt = Object.values(felder).reduce((m, f) => RANG[f.farbe] > RANG[m] ? f.farbe : m, 'g');
    return { felder, gesamt };
  }

  // ── Oberfläche ─────────────────────────────────────────────────────────
  const app = document.getElementById('app');
  let st;

  function reset() { st = { reihenfolge: [], i: 0, antworten: [], kontakt: null }; render(introView); }
  function render(view) { app.innerHTML = ''; view(); window.scrollTo(0, 0); }
  function h(tag, attrs = {}, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'on') e.addEventListener('click', v);
      else if (k === 'cls') e.className = v;
      else e.setAttribute(k, v);
    }
    e.append(...kids);
    return e;
  }
  const put = (...els) => app.append(...els);
  const mischen = arr => arr.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(p => p[1]);

  // 4. Einleitung
  function introView() {
    put(h('div', { cls: 'brand' }, 'A Great Hair Day · Salon Matcher'),
        h('h1', {}, 'Bevor wir uns kennenlernen'),
        h('p', {}, 'Wir sind ein kleines Team und arbeiten eng zusammen – miteinander und mit unseren Kundinnen und Kunden. Deshalb ist uns wichtig, wie jemand im Alltag handelt, nicht nur, was jemand kann.'),
        h('p', {}, 'Du bekommst acht kurze Situationen, wie sie bei uns vorkommen. Zu jeder gibt es vier Möglichkeiten. Oft passt keine ganz genau – wähle die, die dem am nächsten kommt, was du tatsächlich tun würdest.'),
        h('p', {}, 'Es geht nicht um Fachwissen. Du brauchst etwa fünf Minuten. Zurückspringen ist nicht möglich – die erste Wahl ist meistens die ehrlichste.'),
        h('button', { cls: 'btn', on: () => {
          st.reihenfolge = SITUATIONEN.map((s, idx) => ({ s: idx, opts: mischen([0, 1, 2, 3]) }));
          render(situationView);
        }}, 'Beginnen'),
        h('button', { cls: 'link', on: () => render(katalogView) }, 'Prototyp: Fragenkatalog mit Bewertung ansehen'));
  }

  // 1. Situationen
  function situationView() {
    const { s, opts } = st.reihenfolge[st.i];
    const sit = SITUATIONEN[s];
    const fill = h('div'); fill.style.width = (st.i / SITUATIONEN.length * 100) + '%';
    const o = h('div', { cls: 'options' });
    opts.forEach(a => o.append(h('button', { cls: 'opt', on: () => {
      st.antworten.push({ s, a });
      st.i++;
      render(st.i < SITUATIONEN.length ? situationView : abschlussView);
    }}, sit.a[a].t)));
    put(h('div', { cls: 'bar' }, fill),
        h('div', { cls: 'step' }, `Situation ${st.i + 1} von ${SITUATIONEN.length}`),
        h('h2', {}, sit.q), o);
  }

  // 5. Abschluss für Kandidat:innen – für alle gleich, ohne Bewertung
  function abschlussView() {
    const fill = h('div'); fill.style.width = '100%';
    const name = h('input', { type: 'text', id: 'name', autocomplete: 'name', maxlength: '80' });
    const tel  = h('input', { type: 'tel', id: 'tel', autocomplete: 'tel', maxlength: '30' });
    const stelle = h('select', { id: 'stelle' },
      h('option', { value: '' }, 'Bitte wählen'), h('option', {}, 'Lehrstelle'), h('option', {}, 'Gesell:in'), h('option', {}, 'Wiedereinstieg'));
    const insta = h('input', { type: 'text', id: 'insta', maxlength: '120' });
    const ok = h('input', { type: 'checkbox' });
    const msg = h('div', { cls: 'msg hidden' });
    put(h('div', { cls: 'bar' }, fill),
        h('div', { cls: 'brand' }, 'Danke für deine Zeit'),
        h('h1', {}, 'Deine Antworten sind vollständig'),
        h('p', {}, 'Wir sehen uns jede Rückmeldung persönlich an – es entscheidet kein Programm. Wenn wir den Eindruck haben, dass es für beide Seiten passen kann, melden wir uns für ein Kennenlernen im Salon.'),
        h('p', {}, 'Damit wir dich erreichen können, brauchen wir noch ein paar Angaben.'),
        h('label', { cls: 'f', for: 'name' }, 'Name *'), name,
        h('label', { cls: 'f', for: 'tel' }, 'Telefonnummer *'), tel,
        h('label', { cls: 'f', for: 'stelle' }, 'Du interessierst dich für *'), stelle,
        h('label', { cls: 'f', for: 'insta' }, 'Instagram oder Portfolio (freiwillig)'), insta,
        h('label', { cls: 'consent' }, ok, h('span', {}, 'Ich bin einverstanden, dass A Great Hair Day meine Angaben und Antworten zur Bearbeitung meiner Bewerbung speichert. Die Daten werden spätestens nach sechs Monaten gelöscht. Ich kann meine Einwilligung jederzeit widerrufen. *')),
        msg,
        h('button', { cls: 'btn', on: () => {
          msg.classList.remove('hidden');
          if (!name.value.trim() || !tel.value.trim() || !stelle.value) { msg.textContent = 'Bitte fülle Name, Telefonnummer und Stelle aus.'; return; }
          if (!ok.checked) { msg.textContent = 'Bitte bestätige die Einwilligung zum Datenschutz.'; return; }
          st.kontakt = { name: name.value.trim(), tel: tel.value.trim(), stelle: stelle.value, insta: insta.value.trim() };
          msg.textContent = 'Prototyp: Hier würde die Bewerbung abgeschickt. Es wurde nichts gespeichert oder versendet.';
        }}, 'Abschicken'),
        h('button', { cls: 'btn ghost', on: () => render(internView) }, 'Prototyp: Interne Sicht der Chefin'),
        h('button', { cls: 'link', on: reset }, 'Neu starten'));
  }

  // 6. Interne Sicht
  const FARBTEXT = { g: 'Grün', y: 'Gelb', r: 'Rot' };
  const GESAMT = {
    g: ['Gesamt: Grün – zum Gespräch einladen', 'Alle vier Pflichtfelder grün.'],
    y: ['Gesamt: Gelb – Prüfzone, kein automatisches Ja', 'Gespräch nur, wenn der Gesamteindruck sonst stark ist oder die Bewerbung fachlich besonders interessant wirkt. Dann jede gelbe Stelle unten im Gespräch gezielt prüfen. Gelb ist kein Ausschluss, aber auch kein Durchwinken.'],
    r: ['Gesamt: Rot – keine Einladung zum Gespräch', 'In mindestens einem Pflichtfeld eine rote Antwort. Keine Ausnahme aus Sympathie, Mitleid oder Lebenslauf. Rot bleibt Ausschluss.']
  };
  function internView() {
    const { felder, gesamt } = auswerten(st.antworten);
    const k = st.kontakt;
    put(h('div', { cls: 'brand' }, 'Intern · nur für die Chefin'),
        h('h1', {}, k ? `${k.name} · ${k.stelle}` : 'Bewerbung (ohne Kontaktdaten)'),
        h('div', { cls: 'verdict v-' + gesamt }, h('b', {}, GESAMT[gesamt][0]), h('p', {}, GESAMT[gesamt][1])));

    // Rote Felder zuerst
    const reihen = Object.entries(felder).sort((x, y) => RANG[y[1].farbe] - RANG[x[1].farbe]);
    for (const [key, f] of reihen) {
      const box = h('div', { cls: 'field' },
        h('div', { cls: 'field-head' }, h('span', {}, FELDER[key].name), h('span', { cls: 'pill p-' + f.farbe }, FARBTEXT[f.farbe])));
      const auff = f.signale.filter(x => x.farbe !== 'g').sort((x, y) => RANG[y.farbe] - RANG[x.farbe]);
      if (!auff.length) box.append(h('div', { cls: 'muted', style: 'margin-top:8px' }, `${f.signale.length} Signale, alle grün.`));
      auff.forEach(x => {
        const sit = SITUATIONEN[x.s], opt = sit.a[x.a];
        box.append(h('div', { cls: 'sig ' + x.farbe },
          h('div', { cls: 'sit' }, (x.farbe === 'r' ? 'Rote Flagge · ' : 'Gelb · ') + sit.q),
          h('div', { cls: 'ans' }, 'Gewählt: ' + opt.t),
          h('div', { cls: 'why' }, opt.w || '')));
      });
      if (f.farbe !== 'g') box.append(h('div', { cls: 'ask' }, h('b', {}, 'Im Gespräch fragen: '), FELDER[key].gespraech));
      put(box);
    }
    put(h('button', { cls: 'btn ghost', on: () => render(abschlussView) }, 'Zurück'),
        h('button', { cls: 'link', on: reset }, 'Neu starten'));
  }

  // 1–3 im Überblick: Katalog mit Zuordnung und Regeln (nur Prototyp)
  function katalogView() {
    put(h('div', { cls: 'brand' }, 'Intern · Fragenkatalog'),
        h('h1', {}, 'Situationen und Bewertung'),
        h('p', {}, 'Bewerber:innen sehen die Antworten in zufälliger Reihenfolge und nie die Farben.'));
    const ul = h('ul', { cls: 'rules' },
      h('li', {}, 'Ein Pflichtfeld ist rot, sobald darin eine rote Antwort vorkommt.'),
      h('li', {}, 'Ein Pflichtfeld ist gelb, wenn keine rote, aber mindestens eine gelbe Antwort vorkommt.'),
      h('li', {}, 'Es wird nichts verrechnet – grüne Antworten gleichen eine rote nicht aus.'));
    const entscheid = h('ul', { cls: 'rules' },
      h('li', {}, h('b', {}, 'Gesamt-Grün'), ' (alle vier Felder grün): zum Gespräch einladen.'),
      h('li', {}, h('b', {}, 'Gesamt-Gelb'), ' (kein Feld rot, mindestens eines gelb): kein automatisches Ja. Gespräch nur, wenn der Gesamteindruck sonst stark ist oder die Bewerbung fachlich besonders interessant wirkt. Die gelben Stellen werden im Gespräch gezielt geprüft. Gelb ist kein Ausschluss, aber auch kein Durchwinken.'),
      h('li', {}, h('b', {}, 'Gesamt-Rot'), ' (mindestens ein Feld rot): keine Einladung zum Gespräch. Keine Ausnahme aus Sympathie, Mitleid oder Lebenslauf. Rot bleibt Ausschluss.'));
    put(h('h3', {}, 'Auswertungslogik'), ul, h('h3', {}, 'Entscheidung'), entscheid,
        h('p', { style: 'margin-top:10px' }, 'Grüne Antworten gleichen kein Rot aus. Der Matcher ist ein Vorfilter für Kultur, nicht ein netter Eindruckstest.'));

    const zaehl = {};
    SITUATIONEN.forEach(s => new Set(s.a.flatMap(a => Object.keys(a.b))).forEach(k => zaehl[k] = (zaehl[k] || 0) + 1));
    put(h('p', { style: 'margin-top:10px' }, 'Situationen pro Feld: ' + Object.keys(FELDER).map(k => `${FELDER[k].name.split(' ')[0]} ${zaehl[k]}×`).join(' · ')));

    put(h('h3', {}, 'Die acht Situationen'));
    SITUATIONEN.forEach((s, idx) => {
      const box = h('div', { cls: 'kat-sit' },
        h('div', { cls: 'kat-meta' }, `Situation ${idx + 1} · ${s.art}`),
        h('div', { cls: 'kat-q' }, s.q));
      s.a.forEach(a => {
        const tags = h('div', { cls: 'tags' });
        for (const [k, f] of Object.entries(a.b)) tags.append(h('span', { cls: 'pill p-' + f }, `${FELDER[k].name.split(' ')[0]} · ${FARBTEXT[f]}`));
        const txt = h('div', {}, a.t);
        if (a.w) txt.append(h('span', { cls: 'why' }, a.w));
        box.append(h('div', { cls: 'kat-a' }, tags, txt));
      });
      put(box);
    });
    put(h('button', { cls: 'btn ghost', on: reset }, 'Zurück zum Start'));
  }

  reset();
</script>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F4EFE8">
<title>Sponsorenwand · Haarnetzwerk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4EFE8; --panel: #FFFFFF; --ink: #1B1A18; --muted: #6E675E;
    --line: #E2DACF; --accent: #1B1A18; --accent-ink: #FFFFFF; --danger: #9B3B2E;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 'Jost', system-ui, sans-serif; }
  header { padding: 22px 24px 8px; }
  .zurueck { display: inline-block; margin-bottom: 12px; padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--panel); color: var(--muted); font-size: 13px; font-weight: 500; text-decoration: none; }
  .zurueck:hover { color: var(--ink); border-color: var(--muted); }
  h1 { font: 500 30px/1.1 'Cormorant Garamond', Georgia, serif; margin: 0; }
  header p { margin: 4px 0 0; color: var(--muted); }
  .wrap { display: grid; grid-template-columns: 360px 1fr; gap: 24px; padding: 16px 24px 40px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .panel + .panel { margin-top: 16px; }
  .panel h2 { font: 500 13px/1 'Jost', sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], select, textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px;
    font: inherit; color: var(--ink); background: #FDFBF8; }
  textarea { resize: vertical; min-height: 58px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  button { font: inherit; cursor: pointer; border-radius: 9px; border: 1px solid var(--line); background: #FDFBF8; color: var(--ink); padding: 8px 12px; }
  button:hover { border-color: var(--muted); }
  .primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; padding: 12px 16px; width: 100%; font-size: 16px; }
  .primary:hover { opacity: .9; }
  .ghost-danger { color: var(--danger); }
  .upload { display: block; border: 1.5px dashed var(--line); border-radius: 12px; padding: 16px; text-align: center; color: var(--muted); cursor: pointer; margin-bottom: 12px; }
  .upload:hover { border-color: var(--muted); color: var(--ink); }
  .upload input { display: none; }
  .logos { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .logos li { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; padding: 6px; border: 1px solid var(--line); border-radius: 10px; }
  .logos img { width: 56px; height: 40px; object-fit: contain; border-radius: 6px; background: #EEE9E2; }
  .logos input { padding: 6px 8px; font-size: 14px; }
  .logos .btns { display: flex; gap: 4px; }
  .logos .btns button { padding: 4px 8px; font-size: 13px; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 8px; }
  .preview { position: sticky; top: 16px; }
  .preview canvas { display: block; max-width: 100%; max-height: calc(100vh - 120px); margin: 0 auto; border-radius: 6px;
    box-shadow: 0 10px 40px rgba(40, 30, 20, .14); background: #fff; }
  .hint { font-size: 13px; color: var(--muted); text-align: center; margin-top: 10px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button { flex: 1; border: 0; border-radius: 0; }
  .seg button.on { background: var(--accent); color: var(--accent-ink); }
  @media (max-width: 860px) {
    .wrap { grid-template-columns: 1fr; padding: 12px 16px 32px; }
    header { padding: 18px 16px 4px; }
    .preview { position: static; order: -1; }
  }
</style>
</head>
<body>
<header>
  <a class="zurueck" href="index.html">← Zurück</a>
  <h1>Sponsorenwand</h1>
  <p>Dankeswand oder Einladung: Logos hochladen, Texte anpassen, als Bild herunterladen. Alles bleibt auf deinem Gerät.</p>
</header>

<div class="wrap">
  <div>
    <div class="panel">
      <h2>Was soll es werden?</h2>
      <div class="seg" id="fModus">
        <button type="button" data-v="dank" class="on">Dankeswand</button>
        <button type="button" data-v="einladung">Einladung</button>
      </div>
    </div>

    <div class="panel">
      <h2>Veranstaltung</h2>
      <div class="nur-dank">
        <label for="fTitel">Überschrift</label>
        <input type="text" id="fTitel" value="Danke an unsere Sponsoren">
      </div>
      <div class="nur-einladung" hidden>
        <label for="fETitel">Überschrift</label>
        <input type="text" id="fETitel" value="Einladung zum">
      </div>
      <div class="row">
        <div><label for="fEvent">Veranstaltung</label><input type="text" id="fEvent" value="Genussabend"></div>
        <div><label for="fDatum">Datum</label><input type="text" id="fDatum" value="09.11.2026" placeholder="TT.MM.JJJJ"></div>
      </div>
      <div class="nur-dank">
        <label for="fText">Dankestext (optional)</label>
        <textarea id="fText">Das Haarnetzwerk sagt von Herzen Danke für eure Unterstützung.</textarea>
      </div>
      <div class="nur-einladung" hidden>
        <label for="fZeit">Uhrzeit</label>
        <input type="text" id="fZeit" placeholder="z. B. ab 19:00 Uhr">
        <label for="fOrt">Ort</label>
        <textarea id="fOrt" placeholder="Name der Location&#10;Straße, PLZ Ort"></textarea>
        <label for="fEText">Einladungstext (optional)</label>
        <textarea id="fEText">Wir laden dich herzlich zu einem Abend voller Genuss, Austausch und guter Gespräche im Kreis des Haarnetzwerks ein.</textarea>
        <label for="fAnmeldung">Anmeldung (optional)</label>
        <input type="text" id="fAnmeldung" placeholder="z. B. Um Anmeldung wird gebeten bis 30.10.2026">
        <label for="fELabel">Zeile über den Logos</label>
        <input type="text" id="fELabel" value="Mit freundlicher Unterstützung von">
      </div>
      <label for="fFuss">Fußzeile (optional)</label>
      <input type="text" id="fFuss" value="#Haarnetzwerk">
    </div>

    <div class="panel">
      <h2>Format &amp; Stil</h2>
      <label for="fFormat">Format</label>
      <select id="fFormat">
        <option value="1080x1350">Instagram-Beitrag · 1080 × 1350</option>
        <option value="1080x1080">Quadrat · 1080 × 1080</option>
        <option value="1080x1920">Story · 1080 × 1920</option>
        <option value="1920x1080">Bildschirm / Beamer · 1920 × 1080</option>
        <option value="2480x3508">A4 Hochformat zum Drucken · 300 dpi</option>
        <option value="3508x2480">A4 Querformat zum Drucken · 300 dpi</option>
      </select>
      <label>Hintergrund</label>
      <div class="seg" id="fStil">
        <button type="button" data-v="creme" class="on">Creme</button>
        <button type="button" data-v="weiss">Weiß</button>
        <button type="button" data-v="schwarz">Schwarz</button>
      </div>
      <label class="upload" style="margin:14px 0 0">
        <input type="file" id="fVeranstalter" accept="image/*">
        Veranstalter-Logo austauschen
      </label>
    </div>

    <div class="panel">
      <h2>Sponsoren</h2>
      <label class="upload">
        <input type="file" id="fLogos" accept="image/*" multiple>
        <strong>+ Logos hinzufügen</strong><br><span style="font-size:13px">mehrere auf einmal möglich (JPG, PNG, SVG)</span>
      </label>
      <ul class="logos" id="logoListe"></ul>
      <div class="row" style="margin-top:12px">
        <button type="button" class="ghost-danger" id="btnLeeren">Alle Logos entfernen</button>
        <button type="button" id="btnBeispiel">Beispiel: Genussabend</button>
      </div>
    </div>

    <div style="margin-top:16px">
      <button type="button" class="primary" id="btnDownload">⬇ Als Bild herunterladen (PNG)</button>
    </div>
  </div>

  <div class="preview">
    <canvas id="cv"></canvas>
    <div class="hint" id="hint"></div>
  </div>
</div>

// ---------- Bild laden & analysieren ----------
function ladeBild(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}
function dateiAlsDataURL(f) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
}

// Hintergrundfarbe aus den Ecken schätzen und Rand wegschneiden,
// damit jedes Logo gleich groß wirkt – egal wie viel Weißraum die Datei hat.
function analysiere(img) {
  const roh = erkenne(img);
  if (roh.bg || roh.transparent) return { bg: roh.bg, crop: roh.crop, quelle: img };
  // heller Hintergrund: fast-weiße Flächen durchsichtig machen, dann neu zuschneiden
  const k = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  const x = c.getContext('2d'); x.drawImage(img, 0, 0, c.width, c.height);
  const id = x.getImageData(0, 0, c.width, c.height), d = id.data;
  for (let o = 0; o < d.length; o += 4) {
    const lum = 0.299 * d[o] + 0.587 * d[o + 1] + 0.114 * d[o + 2];
    d[o + 3] = Math.round(d[o + 3] * Math.max(0, Math.min(1, (244 - lum) / 34)));
  }
  x.putImageData(id, 0, 0);
  const neu = erkenne(c);
  return { bg: null, crop: neu.crop, quelle: c };
}
function erkenne(img) {
  const nw = img.naturalWidth || img.width, nh = img.naturalHeight || img.height;
  const maxSeite = 400;
  const k = Math.min(1, maxSeite / Math.max(nw, nh));
  const w = Math.max(1, Math.round(nw * k)), h = Math.max(1, Math.round(nh * k));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h).data;
  const px = (i, j) => { const o = (j * w + i) * 4; return [d[o], d[o + 1], d[o + 2], d[o + 3]]; };
  const ecken = [px(0, 0), px(w - 1, 0), px(0, h - 1), px(w - 1, h - 1),
                 px(Math.floor(w / 2), 0), px(Math.floor(w / 2), h - 1)];
  const transparent = ecken.filter(p => p[3] < 20).length >= 3;
  let bg = [255, 255, 255];
  if (!transparent) {
    const opak = ecken.filter(p => p[3] >= 20);
    bg = [0, 1, 2].map(ch => Math.round(opak.map(p => p[ch]).sort((a, b) => a - b)[Math.floor(opak.length / 2)]));
  }
  const tol = 42;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const o = (j * w + i) * 4;
    const inhalt = transparent ? d[o + 3] > 30
      : d[o + 3] > 30 && Math.max(Math.abs(d[o] - bg[0]), Math.abs(d[o + 1] - bg[1]), Math.abs(d[o + 2] - bg[2])) > tol;
    if (inhalt) { if (i < x0) x0 = i; if (i > x1) x1 = i; if (j < y0) y0 = j; if (j > y1) y1 = j; }
  }
  if (x1 < 0) { x0 = 0; y0 = 0; x1 = w - 1; y1 = h - 1; }
  const hell = (0.299 * bg[0] + 0.587 * bg[1] + 0.114 * bg[2]) > 235;
  return {
    transparent,
    bg: transparent || hell ? null : `rgb(${bg.join(',')})`,
    crop: { x: x0 / k, y: y0 / k, w: (x1 - x0 + 1) / k, h: (y1 - y0 + 1) / k },
  };
}

// Veranstalter-Logo in eine einfärbbare Silhouette verwandeln (hell = durchsichtig),
// damit es auf jedem Hintergrund funktioniert.
function silhouette(img, farbe) {
  const w = img.naturalWidth, h = img.naturalHeight;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0);
  const id = x.getImageData(0, 0, w, h), d = id.data;
  const [r, g, b] = farbe.match(/\w\w/g).map(v => parseInt(v, 16));
  for (let o = 0; o < d.length; o += 4) {
    const lum = 0.299 * d[o] + 0.587 * d[o + 1] + 0.114 * d[o + 2];
    const a = Math.max(0, Math.min(255, (250 - lum) * 255 / 110)) * (d[o + 3] / 255);
    d[o] = r; d[o + 1] = g; d[o + 2] = b; d[o + 3] = a;
  }
  x.putImageData(id, 0, 0);
  return c;
}

async function sponsorAus(name, src) {
  const img = await ladeBild(src);
  return { name, src, img, info: analysiere(img) };
}

// ---------- Zeichnen ----------
function rundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function umbrechen(text, maxB) {
  const woerter = text.split(/\s+/).filter(Boolean), zeilen = [];
  let z = '';
  for (const w of woerter) { const t = z ? z + ' ' + w : w; if (ctx.measureText(t).width > maxB && z) { zeilen.push(z); z = w; } else z = t; }
  if (z) zeilen.push(z);
  return zeilen;
}
function gesperrt(text, x, y, abstand) {
  // Text mit Buchstabenabstand, zentriert um x
  const zeichen = [...text];
  const breite = zeichen.reduce((s, c) => s + ctx.measureText(c).width, 0) + abstand * (zeichen.length - 1);
  let cx = x - breite / 2;
  ctx.textAlign = 'left';
  for (const c of zeichen) { ctx.fillText(c, cx, y); cx += ctx.measureText(c).width + abstand; }
  ctx.textAlign = 'center';
}
function besteRaster(n, W, H, gap, ziel) {
  let best = null;
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols);
    let cw = (W - gap * (cols - 1)) / cols, ch = (H - gap * (rows - 1)) / rows;
    if (cw / ch > ziel * 1.25) cw = ch * ziel * 1.25;
    if (ch / cw > 1 / ziel * 1.1) ch = cw / ziel * 1.1;
    const score = Math.min(cw, ch * ziel) * (rows * cols - n > cols - 1 ? 0.5 : 1);
    if (!best || score > best.score) best = { cols, rows, cw, ch, score };
  }
  return best;
}

function zeichne() {
  if (state.modus === 'einladung') return zeichneEinladung();
  const [W, H] = $('fFormat').value.split('x').map(Number);
  cv.width = W; cv.height = H;
  const S = STILE[state.stil];
  const s = Math.min(W, H) / 1080;
  const quer = W / H > 1.3;
  const P = 72 * s;
  const serif = "'Cormorant Garamond', Georgia, 'Times New Roman', serif";
  const sans = "'Jost', 'Helvetica Neue', Arial, sans-serif";

  ctx.fillStyle = S.bg; ctx.fillRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';

  const titel = $('fTitel').value.trim();
  const zeile = [$('fEvent').value.trim(), $('fDatum').value.trim()].filter(Boolean).join('  ·  ').toUpperCase();
  const text = $('fText').value.trim();
  const fuss = $('fFuss').value.trim();

  // Kopfbereich
  let y = P;
  const logoG = (quer ? 170 : 210) * s;
  const titelG = (quer ? 64 : 76) * s;
  const zeileG = 24 * s, textG = 30 * s;
  const vlogo = state.veranstalter ? silhouette(state.veranstalter, S.ink) : null;
  if (vlogo) {
    const f = logoG / Math.max(vlogo.width, vlogo.height);
    ctx.drawImage(vlogo, W / 2 - vlogo.width * f / 2, y, vlogo.width * f, vlogo.height * f);
    y += vlogo.height * f + 34 * s;
  }
  if (titel) {
    ctx.fillStyle = S.ink; ctx.font = `italic 500 ${titelG}px ${serif}`;
    for (const z of umbrechen(titel, W - 2 * P)) { y += titelG * 0.92; ctx.fillText(z, W / 2, y); y += titelG * 0.12; }
    y += 18 * s;
  }
  if (zeile) {
    ctx.fillStyle = S.muted; ctx.font = `400 ${zeileG}px ${sans}`;
    y += zeileG; gesperrt(zeile, W / 2, y, zeileG * 0.22); y += 22 * s;
  }
  // feine Trennlinie
  ctx.strokeStyle = S.line; ctx.lineWidth = Math.max(1, 1.5 * s);
  ctx.beginPath(); ctx.moveTo(W / 2 - 60 * s, y + 6 * s); ctx.lineTo(W / 2 + 60 * s, y + 6 * s); ctx.stroke();
  y += 30 * s;
  if (text) {
    ctx.fillStyle = S.ink; ctx.font = `400 ${textG}px ${serif}`;
    for (const z of umbrechen(text, Math.min(W - 2 * P, 820 * s))) { y += textG * 1.05; ctx.fillText(z, W / 2, y); y += textG * 0.25; }
  }
  y += 40 * s;

  // Fußzeile
  let unten = H - P;
  if (fuss) {
    ctx.fillStyle = S.muted; ctx.font = `400 ${22 * s}px ${sans}`;
    gesperrt(fuss, W / 2, H - P + 8 * s, 22 * s * 0.18);
    unten -= 44 * s;
  }

  zeichneLogos(P, y, W - 2 * P, unten - y, s, S, 26 * s);
}

function zeichneLogos(x0, y, flW, flH, s, S, gap) {
  const sans = "'Jost', 'Helvetica Neue', Arial, sans-serif";
  const n = state.sponsoren.length;
  if (!n) {
    ctx.strokeStyle = S.line; ctx.setLineDash([10 * s, 10 * s]); ctx.lineWidth = 2 * s;
    rundRect(x0, y, flW, flH, 20 * s); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = S.muted; ctx.font = `400 ${28 * s}px ${sans}`; ctx.textAlign = 'center';
    ctx.fillText('Hier erscheinen die Sponsoren-Logos', x0 + flW / 2, y + flH / 2);
    return;
  }
  const R = besteRaster(n, flW, flH, gap, 1.55);
  const rasterH = R.rows * R.ch + (R.rows - 1) * gap;
  const y0 = y + (flH - rasterH) / 2;
  const radius = Math.min(18 * s, R.ch * 0.14);
  state.sponsoren.forEach((sp, i) => {
    const r = Math.floor(i / R.cols), c = i % R.cols;
    const inZeile = r === R.rows - 1 ? n - r * R.cols : R.cols;
    const zeilenB = inZeile * R.cw + (inZeile - 1) * gap;
    const x = x0 + (flW - zeilenB) / 2 + c * (R.cw + gap);
    const yy = y0 + r * (R.ch + gap);

    ctx.save();
    ctx.shadowColor = S.shadow; ctx.shadowBlur = Math.min(24 * s, R.ch * 0.15); ctx.shadowOffsetY = Math.min(6 * s, R.ch * 0.04);
    ctx.fillStyle = sp.info.bg || S.card;
    rundRect(x, yy, R.cw, R.ch, radius); ctx.fill();
    ctx.restore();
    if (S.border && !sp.info.bg) { ctx.strokeStyle = S.border; ctx.lineWidth = Math.max(1, s); rundRect(x, yy, R.cw, R.ch, radius); ctx.stroke(); }

    ctx.save(); rundRect(x, yy, R.cw, R.ch, radius); ctx.clip();
    const pad = Math.min(R.cw, R.ch) * 0.16;
    const bw = R.cw - 2 * pad, bh = R.ch - 2 * pad;
    const cr = sp.info.crop;
    const f = Math.min(bw / cr.w, bh / cr.h);
    const dw = cr.w * f, dh = cr.h * f;
    ctx.drawImage(sp.info.quelle, cr.x, cr.y, cr.w, cr.h, x + (R.cw - dw) / 2, yy + (R.ch - dh) / 2, dw, dh);
    ctx.restore();
  });
}

// „09.11.2026“ → „Montag, 9. November 2026“; alles andere bleibt, wie es eingetippt wurde
function datumLang(text) {
  const m = text.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if (!m) return text;
  const d = new Date(+m[3], +m[2] - 1, +m[1]);
  if (d.getMonth() !== +m[2] - 1) return text;
  return d.toLocaleDateString('de-AT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

function zeichneEinladung() {
  const [W, H] = $('fFormat').value.split('x').map(Number);
  cv.width = W; cv.height = H;
  const S = STILE[state.stil];
  const s = Math.min(W, H) / 1080;
  const quer = W / H > 1.3;
  const P = 72 * s;
  const serif = "'Cormorant Garamond', Georgia, 'Times New Roman', serif";
  const sans = "'Jost', 'Helvetica Neue', Arial, sans-serif";
  ctx.fillStyle = S.bg; ctx.fillRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';

  const v = id => $(id).value.trim();
  const fuss = v('fFuss');
  const vlogo = state.veranstalter ? silhouette(state.veranstalter, S.ink) : null;
  const logosDa = state.sponsoren.length > 0;

  // Platz unten: Fußzeile + Sponsorenband
  let unten = H - P;
  if (fuss) unten -= 44 * s;
  const bandH = logosDa ? Math.round(H * (quer ? 0.24 : 0.22)) : 0;
  const labelH = logosDa && v('fELabel') ? 46 * s : 0;
  const textUnten = unten - bandH - labelH - (logosDa ? 40 * s : 0);

  // Textblock einmal messen, dann so skalieren, dass er in den Platz passt
  function block(k, zeichnen) {
    let y = 0;
    const breit = Math.min(W - 2 * P, 860 * s);
    const zeile = (txt, font, farbe, groesse, lh, sperr) => {
      ctx.font = font(groesse);
      const zeilen = sperr ? [txt] : txt.split('\n').flatMap(z => umbrechen(z, breit));
      for (const z of zeilen) {
        y += groesse * lh;
        if (zeichnen) { ctx.fillStyle = farbe; ctx.textAlign = 'center'; sperr ? gesperrt(z, W / 2, P + y, groesse * sperr) : ctx.fillText(z, W / 2, P + y); }
        y += groesse * 0.2;
      }
    };
    if (vlogo) {
      const g = (quer ? 150 : 190) * s * k, f = g / Math.max(vlogo.width, vlogo.height);
      if (zeichnen) ctx.drawImage(vlogo, W / 2 - vlogo.width * f / 2, P + y, vlogo.width * f, vlogo.height * f);
      y += vlogo.height * f + 30 * s * k;
    }
    if (v('fETitel')) { zeile(v('fETitel').toUpperCase(), g => `400 ${g}px ${sans}`, S.muted, 24 * s * k, 1, 0.32); y += 6 * s * k; }
    if (v('fEvent')) { zeile(v('fEvent'), g => `italic 500 ${g}px ${serif}`, S.ink, 118 * s * k, 0.9, 0); y += 4 * s * k; }
    // Trennlinie
    y += 16 * s * k;
    if (zeichnen) { ctx.strokeStyle = S.line; ctx.lineWidth = Math.max(1, 1.5 * s); ctx.beginPath(); ctx.moveTo(W / 2 - 60 * s, P + y); ctx.lineTo(W / 2 + 60 * s, P + y); ctx.stroke(); }
    y += 18 * s * k;
    if (v('fDatum')) zeile(datumLang(v('fDatum')), g => `500 ${g}px ${serif}`, S.ink, 46 * s * k, 1, 0);
    if (v('fZeit')) { y += 12 * s * k; zeile(v('fZeit').toUpperCase(), g => `400 ${g}px ${sans}`, S.ink, 24 * s * k, 1, 0.24); }
    if (v('fOrt')) { y += 10 * s * k; zeile(v('fOrt'), g => `400 ${g}px ${serif}`, S.muted, 32 * s * k, 1, 0); }
    if (v('fEText')) { y += 22 * s * k; zeile(v('fEText'), g => `400 ${g}px ${serif}`, S.ink, 32 * s * k, 1.05, 0); }
    if (v('fAnmeldung')) { y += 18 * s * k; zeile(v('fAnmeldung'), g => `400 ${g}px ${sans}`, S.muted, 23 * s * k, 1.1, 0); }
    return y;
  }
  const platz = textUnten - P;
  let k = 1;
  const hoehe = block(1, false);
  k = Math.max(0.55, Math.min(1.3, platz / hoehe));
  // Text vertikal im freien Bereich etwas zentrieren
  const verschub = Math.max(0, (platz - block(k, false)) * 0.4);
  ctx.save(); ctx.translate(0, verschub); block(k, true); ctx.restore();

  if (logosDa) {
    let y = unten - bandH - labelH;
    if (labelH) {
      ctx.fillStyle = S.muted; ctx.font = `400 ${20 * s}px ${sans}`; ctx.textAlign = 'center';
      gesperrt(v('fELabel').toUpperCase(), W / 2, y + 22 * s, 20 * s * 0.24);
      y += labelH;
    }
    zeichneLogos(P, y, W - 2 * P, bandH, s, S, 18 * s);
  }
  if (fuss) {
    ctx.fillStyle = S.muted; ctx.font = `400 ${22 * s}px ${sans}`; ctx.textAlign = 'center';
    gesperrt(fuss, W / 2, H - P + 8 * s, 22 * s * 0.18);
  }
}

// ---------- Liste ----------
function liste() {
  const ul = $('logoListe'); ul.innerHTML = '';
  if (!state.sponsoren.length) { ul.innerHTML = '<li class="empty" style="display:block;border:0">Noch keine Logos. Lade oben welche hoch.</li>'; }
  state.sponsoren.forEach((sp, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<img alt=""><input type="text" aria-label="Name des Sponsors"><div class="btns">
      <button type="button" title="nach oben" data-a="hoch">↑</button>
      <button type="button" title="nach unten" data-a="runter">↓</button>
      <button type="button" title="entfernen" data-a="weg" class="ghost-danger">✕</button></div>`;
    li.querySelector('img').src = sp.src;
    const inp = li.querySelector('input'); inp.value = sp.name;
    inp.oninput = () => { sp.name = inp.value; };
    li.querySelectorAll('button').forEach(b => b.onclick = () => {
      const a = b.dataset.a, L = state.sponsoren;
      if (a === 'weg') L.splice(i, 1);
      if (a === 'hoch' && i > 0) [L[i - 1], L[i]] = [L[i], L[i - 1]];
      if (a === 'runter' && i < L.length - 1) [L[i + 1], L[i]] = [L[i], L[i + 1]];
      aktualisiere();
    });
    ul.appendChild(li);
  });
  $('hint').textContent = `${state.sponsoren.length} Logo${state.sponsoren.length === 1 ? '' : 's'} · ${$('fFormat').selectedOptions[0].text}`;
}
function aktualisiere() { liste(); zeichne(); }

async function ladeBeispiel() {
  if (!DEFAULTS) return;
  state.sponsoren = await Promise.all(DEFAULTS.sponsoren.map(s => sponsorAus(s.name, s.src)));
  $('fEvent').value = 'Genussabend'; $('fDatum').value = '09.11.2026';
  aktualisiere();
}

  state.modus = b.dataset.v;
  $('fModus').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.nur-dank').forEach(e => e.hidden = state.modus !== 'dank');
  document.querySelectorAll('.nur-einladung').forEach(e => e.hidden = state.modus !== 'einladung');
  zeichne();
});
$('fStil').querySelectorAll('button').forEach(b => b.onclick = () => {
  state.stil = b.dataset.v;
  $('fStil').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  zeichne();
});
$('fLogos').addEventListener('change', async e => {
  for (const f of e.target.files) {
    try { state.sponsoren.push(await sponsorAus(f.name.replace(/\.[^.]+$/, ''), await dateiAlsDataURL(f))); }
    catch { alert(`„${f.name}“ konnte nicht gelesen werden.`); }
  }
  e.target.value = ''; aktualisiere();
});
$('fVeranstalter').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  state.veranstalter = await ladeBild(await dateiAlsDataURL(f)); e.target.value = ''; zeichne();
});
$('btnLeeren').onclick = () => { if (confirm('Alle Sponsoren-Logos entfernen?')) { state.sponsoren = []; aktualisiere(); } };
$('btnBeispiel').onclick = ladeBeispiel;
$('btnDownload').onclick = () => {
  zeichne();
  const name = [state.modus === 'einladung' ? 'Einladung' : 'Sponsorenwand', $('fEvent').value.trim(), $('fDatum').value.trim()].filter(Boolean).join('_')
    .replace(/[^\wäöüÄÖÜß.-]+/g, '-');
  cv.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name + '.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, 'image/png');
};

(async () => {
  try { await document.fonts.load("italic 500 40px 'Cormorant Garamond'"); await document.fonts.load("400 20px 'Jost'"); await document.fonts.load("400 20px 'Cormorant Garamond'"); } catch {}
  if (DEFAULTS) state.veranstalter = await ladeBild(DEFAULTS.veranstalter);
  await ladeBeispiel();
  if (!DEFAULTS) aktualisiere();
  document.fonts.ready.then(zeichne);
})();
</script>
</body>
</html>
